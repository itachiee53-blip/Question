<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ศัพท์ป๊อป</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: sticker-book look. Thick ink outlines, offset shadows, pastel category tiles on a dotted page. One view at a time: home → learn / quiz → result. */
:root{
  --page:#f1f3ff; --dot:#d9ddfb; --card:#ffffff; --ink:#1d1b2f; --soft:#5d5a78;
  --blue:#5b6cff; --pink:#ff5c8a; --mint:#2fcf8a; --sun:#ffc94d; --bad:#ff5c5c;
  --f-en:"Fredoka","Mitr",system-ui,sans-serif;
  --f-th:"Mitr","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--ink);min-height:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.stk{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);background:var(--card);padding:8px 16px;font-family:var(--f-th);font-weight:500;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.sun{background:var(--sun)}
.btn.mint{background:var(--mint);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* header */
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-en);font-weight:700;font-size:28px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;margin:0;line-height:1}
.logo .b{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--ink)}
.logo .th{font-family:var(--f-th);font-size:16px;font-weight:500;color:var(--soft)}
.sp{flex:1}
.lvl{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px}
.lvl .n{font-family:var(--f-en);font-weight:700;background:var(--sun);border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.xpbar{width:110px;height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#eef}
.xpbar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
.lvl small{font-family:var(--f-en);font-weight:600;color:var(--soft)}

/* mascot hero */
.hero{display:flex;align-items:center;gap:18px;padding:16px 20px}
.mascot{width:96px;height:96px;flex:none}
.mascot.bounce{animation:bounce .5s}
@keyframes bounce{40%{transform:translateY(-12px) scale(1.05)}70%{transform:translateY(2px) scale(.98)}}
.hero h2{margin:0;font-family:var(--f-th);font-weight:600;font-size:22px;line-height:1.3;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--soft)}

.sec{font-family:var(--f-th);font-weight:600;font-size:18px;margin:4px 0 -4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cat{padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.cat .ic{font-size:44px;line-height:1;width:64px;height:64px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;background:#fff8}
.cat .nm{font-family:var(--f-th);font-weight:600;font-size:18px;line-height:1.2}
.cat .en{font-family:var(--f-en);font-weight:600;color:var(--soft);font-size:15px}
.cat .stars{position:absolute;right:14px;top:14px;font-size:18px;letter-spacing:1px}
.cat .row{display:flex;gap:8px;margin-top:auto}
.cat .row .btn{flex:1;padding:6px 8px;font-size:15px}
.review{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#ffe6ee}
.review .t{flex:1;min-width:0}
.review b{font-family:var(--f-th)}

/* top bar inside learn/quiz */
.qbar{display:flex;align-items:center;gap:12px}
.qbar .x{width:44px;height:44px;padding:0;font-size:20px;flex:none}
.prog{flex:1;height:18px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);width:0;transition:width .35s;border-right:3px solid var(--ink)}
.hearts{font-size:20px;white-space:nowrap}
.combo{font-family:var(--f-en);font-weight:700;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:0 10px;white-space:nowrap}
.combo.pop{animation:bounce .4s}

/* learn */
.flash{padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:320px;justify-content:center;position:relative}
.flash .em{font-size:110px;line-height:1.1;animation:pin .35s}
@keyframes pin{from{transform:scale(.6) rotate(-10deg);opacity:0}}
.flash .w{font-family:var(--f-en);font-weight:700;font-size:56px;line-height:1.05;letter-spacing:-1px}
.flash .t{font-family:var(--f-th);font-size:24px;color:var(--soft)}
.say{width:54px;height:54px;border-radius:50%;padding:0;font-size:24px;display:grid;place-items:center;background:var(--sun)}
.flash .say{position:absolute;right:16px;top:16px}
.lnav{display:flex;gap:12px;justify-content:center;align-items:center}
.lnav .cnt{font-family:var(--f-en);font-weight:600;color:var(--soft);min-width:70px;text-align:center}

/* quiz */
.qa{display:grid;grid-template-columns:1fr;gap:16px}
.prompt{padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:200px;justify-content:center;position:relative}
.prompt .ask{font-family:var(--f-th);font-weight:500;color:var(--soft);font-size:17px}
.prompt .em{font-size:96px;line-height:1.1;animation:pin .35s}
.prompt .big{font-family:var(--f-en);font-weight:700;font-size:48px;line-height:1.1}
.prompt .bigth{font-family:var(--f-th);font-weight:600;font-size:40px;line-height:1.2}
.prompt .say{width:84px;height:84px;font-size:38px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);background:#fff;padding:14px 10px;font-family:var(--f-en);font-weight:600;font-size:24px;min-height:70px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .06s,box-shadow .06s,background .15s}
.opt.th{font-family:var(--f-th);font-weight:500;font-size:21px}
.opt.emo{font-size:54px;min-height:96px}
.opt .k{position:absolute;left:8px;top:4px;font-size:12px;color:var(--soft);font-family:var(--f-en)}
.opt:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.opt.good{background:#c9f7df;animation:bounce .4s}
.opt.wrong{background:#ffd3d3;animation:shake .4s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.opts.locked .opt{pointer-events:none}

.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.slot{width:44px;height:52px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:var(--f-en);font-weight:700;font-size:28px;display:grid;place-items:center;padding:0}
.slot.f{background:#e7ebff}
.slots.good .slot{background:#c9f7df}
.slots.wrong{animation:shake .4s}
.slots.wrong .slot{background:#ffd3d3}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:52px;height:56px;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);background:var(--sun);font-family:var(--f-en);font-weight:700;font-size:28px;padding:0}
.tile:active{transform:translate(3px,3px);box-shadow:none}
.tile.used{visibility:hidden}
.spellrow{display:flex;gap:10px;justify-content:center}

.fbk{position:sticky;bottom:10px;display:flex;align-items:center;gap:14px;padding:12px 16px;animation:up .25s ease-out;z-index:5}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.fbk.good{background:#c9f7df} .fbk.bad{background:#ffe0e0}
.fbk .msg{flex:1;min-width:0}
.fbk .msg b{font-family:var(--f-th);font-size:20px;display:block;line-height:1.2}
.fbk .msg span{font-family:var(--f-en);font-weight:600;font-size:18px}
.fbk .msg span em{font-family:var(--f-th);font-style:normal;font-weight:400;color:var(--soft);font-size:16px}
.fbk .mascot{width:56px;height:56px}

/* result */
.res{padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.res h2{margin:0;font-family:var(--f-th);font-weight:600;font-size:30px}
.bigstars{font-size:56px;letter-spacing:6px;line-height:1}
.bigstars span{display:inline-block;animation:pin .4s backwards}
.bigstars span:nth-child(2){animation-delay:.15s} .bigstars span:nth-child(3){animation-delay:.3s}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-family:var(--f-th);background:#fff}
.pill b{font-family:var(--f-en);font-size:22px}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;width:100%;margin-top:6px}
.wi{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;text-align:left;min-width:0}
.wi.no{background:#ffe6e6}
.wi .e{font-size:24px}
.wi .tx{min-width:0;line-height:1.15}
.wi .tx b{font-family:var(--f-en);font-weight:600;display:block}
.wi .tx small{font-family:var(--f-th);color:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

@media (min-width:760px){
  .qa{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:stretch}
  .prompt{min-height:300px}
}
/* phone held sideways: put prompt and answers side by side, shrink */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:8px 16px}
  .wrap{gap:10px}
  .qa{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px}
  .prompt{min-height:0;padding:10px}
  .prompt .em{font-size:64px} .prompt .big{font-size:34px} .prompt .bigth{font-size:28px}
  .opt{min-height:54px;font-size:20px;padding:8px}
  .opt.emo{font-size:40px;min-height:64px}
  .opts{gap:8px}
  .flash{min-height:0;padding:12px}
  .flash .em{font-size:70px} .flash .w{font-size:40px}
  .hero{padding:10px 14px} .mascot{width:70px;height:70px}
  .slot{width:38px;height:44px;font-size:24px} .tile{width:44px;height:46px;font-size:24px}
}
@media (max-width:420px){
  .opt{font-size:20px} .opt.th{font-size:18px}
  .flash .w{font-size:44px}
  .slot{width:36px;height:46px;font-size:24px} .tile{width:44px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<canvas id="confetti"></canvas>

<script>
(()=>{
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- words ---------- */
const CATS=[
 {id:'animals',th:'สัตว์',en:'Animals',ic:'🐾',c:'#ffe08a',w:[['cat','แมว','🐱'],['dog','สุนัข','🐶'],['elephant','ช้าง','🐘'],['tiger','เสือ','🐯'],['rabbit','กระต่าย','🐰'],['monkey','ลิง','🐒'],['bird','นก','🐦'],['fish','ปลา','🐟'],['horse','ม้า','🐴'],['cow','วัว','🐮'],['pig','หมู','🐷'],['snake','งู','🐍']]},
 {id:'fruits',th:'ผลไม้',en:'Fruits',ic:'🍓',c:'#ffc2d1',w:[['apple','แอปเปิล','🍎'],['banana','กล้วย','🍌'],['grape','องุ่น','🍇'],['orange','ส้ม','🍊'],['mango','มะม่วง','🥭'],['watermelon','แตงโม','🍉'],['pineapple','สับปะรด','🍍'],['strawberry','สตรอว์เบอร์รี','🍓'],['coconut','มะพร้าว','🥥'],['lemon','มะนาว','🍋'],['cherry','เชอร์รี','🍒'],['peach','ลูกพีช','🍑']]},
 {id:'food',th:'อาหาร',en:'Food',ic:'🍜',c:'#ffd6a8',w:[['rice','ข้าว','🍚'],['bread','ขนมปัง','🍞'],['egg','ไข่','🥚'],['noodles','ก๋วยเตี๋ยว','🍜'],['chicken','ไก่','🍗'],['cheese','ชีส','🧀'],['cake','เค้ก','🍰'],['soup','ซุป','🍲'],['pizza','พิซซ่า','🍕'],['milk','นม','🥛'],['water','น้ำ','💧'],['ice cream','ไอศกรีม','🍦']]},
 {id:'body',th:'ร่างกาย',en:'Body',ic:'✋',c:'#c9f2dc',w:[['eye','ตา','👁️'],['ear','หู','👂'],['nose','จมูก','👃'],['mouth','ปาก','👄'],['hand','มือ','✋'],['foot','เท้า','🦶'],['leg','ขา','🦵'],['tooth','ฟัน','🦷'],['brain','สมอง','🧠'],['heart','หัวใจ','❤️'],['arm','แขน','💪'],['tongue','ลิ้น','👅']]},
 {id:'school',th:'โรงเรียน',en:'School',ic:'🎒',c:'#c7dbff',w:[['book','หนังสือ','📖'],['pencil','ดินสอ','✏️'],['pen','ปากกา','🖊️'],['bag','กระเป๋า','🎒'],['ruler','ไม้บรรทัด','📏'],['scissors','กรรไกร','✂️'],['teacher','ครู','🧑‍🏫'],['computer','คอมพิวเตอร์','💻'],['clock','นาฬิกา','🕒'],['paper','กระดาษ','📄'],['crayon','สีเทียน','🖍️'],['school','โรงเรียน','🏫']]},
 {id:'nature',th:'ธรรมชาติ',en:'Nature',ic:'🌈',c:'#d9f7b8',w:[['sun','ดวงอาทิตย์','☀️'],['moon','ดวงจันทร์','🌙'],['star','ดาว','⭐'],['rain','ฝน','🌧️'],['cloud','เมฆ','☁️'],['snow','หิมะ','❄️'],['wind','ลม','💨'],['rainbow','รุ้งกินน้ำ','🌈'],['tree','ต้นไม้','🌳'],['flower','ดอกไม้','🌸'],['mountain','ภูเขา','⛰️'],['sea','ทะเล','🌊']]},
 {id:'transport',th:'ยานพาหนะ',en:'Transport',ic:'🚗',c:'#c6f0ff',w:[['car','รถยนต์','🚗'],['bus','รถบัส','🚌'],['train','รถไฟ','🚆'],['plane','เครื่องบิน','✈️'],['boat','เรือ','⛵'],['bicycle','จักรยาน','🚲'],['motorcycle','มอเตอร์ไซค์','🏍️'],['taxi','แท็กซี่','🚕'],['truck','รถบรรทุก','🚚'],['rocket','จรวด','🚀'],['helicopter','เฮลิคอปเตอร์','🚁'],['ship','เรือเดินสมุทร','🚢']]},
 {id:'home',th:'ในบ้าน',en:'Home',ic:'🏠',c:'#e3d1ff',w:[['bed','เตียง','🛏️'],['chair','เก้าอี้','🪑'],['door','ประตู','🚪'],['window','หน้าต่าง','🪟'],['key','กุญแจ','🔑'],['sofa','โซฟา','🛋️'],['toilet','ชักโครก','🚽'],['spoon','ช้อน','🥄'],['knife','มีด','🔪'],['phone','โทรศัพท์','📱'],['television','โทรทัศน์','📺'],['house','บ้าน','🏠']]},
 {id:'actions',th:'คำกริยา',en:'Actions',ic:'🏃',c:'#fff0a3',w:[['run','วิ่ง','🏃'],['swim','ว่ายน้ำ','🏊'],['sleep','นอนหลับ','😴'],['read','อ่าน','📚'],['write','เขียน','✍️'],['sing','ร้องเพลง','🎤'],['dance','เต้นรำ','💃'],['cook','ทำอาหาร','🧑‍🍳'],['cry','ร้องไห้','😢'],['laugh','หัวเราะ','😂'],['drink','ดื่ม','🥤'],['climb','ปีน','🧗']]},
 {id:'feelings',th:'ความรู้สึก',en:'Feelings',ic:'😊',c:'#ffd0ec',w:[['happy','มีความสุข','😊'],['sad','เศร้า','😢'],['angry','โกรธ','😠'],['scared','กลัว','😱'],['tired','เหนื่อย','😫'],['sleepy','ง่วงนอน','🥱'],['sick','ป่วย','🤒'],['hungry','หิว','🤤'],['shy','เขินอาย','☺️'],['surprised','ประหลาดใจ','😮'],['cool','เท่','😎'],['love','รัก','😍']]}
];
CATS.forEach(c=>c.words=c.w.map(([en,th,em])=>({en,th,em,cat:c.id})));
const ALL=CATS.flatMap(c=>c.words);
const byEn=Object.fromEntries(ALL.map(w=>[w.en,w]));

/* ---------- saved progress (this browser only) ---------- */
const KEY='sapop-v1';
let SAVE={xp:0,stars:{},review:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)SAVE={...SAVE,...s};}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}};
const level=()=>Math.floor(SAVE.xp/100)+1;

/* ---------- audio ---------- */
let actx=null;
function tone(f,d=.1,type='sine',v=.07,at=0){
  if(!actx)return;const t=actx.currentTime+at,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={good(){tone(660,.1,'triangle');tone(990,.16,'triangle',.07,.09);},bad(){tone(220,.18,'square',.04);tone(170,.22,'square',.04,.12);},tap(){tone(520,.05,'triangle',.04);},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.07,i*.12));}};
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}}
const hasTTS='speechSynthesis' in window;
let voice=null;
function loadVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|google/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(hasTTS){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
function speak(word){
  if(!hasTTS)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- mascot (Popo, a round ink blob) ---------- */
function mascot(mood='happy',cls=''){
  const mouth={happy:'M38 62 Q50 74 62 62',wow:'',sad:'M38 68 Q50 58 62 68',cheer:'M34 60 Q50 80 66 60 Z'}[mood];
  const m=mood==='wow'?'<ellipse cx="50" cy="65" rx="6" ry="8" fill="#1d1b2f"/>':mood==='cheer'?`<path d="${mouth}" fill="#1d1b2f"/><path d="M42 68 Q50 74 58 68" fill="#ff5c8a"/>`:`<path d="${mouth}" stroke="#1d1b2f" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const brow=mood==='sad'?'<path d="M30 39 L42 34 M70 39 L58 34" stroke="#1d1b2f" stroke-width="3.5" stroke-linecap="round"/>':'';
  return `<svg class="mascot ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 8 C76 8 92 26 92 52 C92 78 74 94 50 94 C26 94 8 78 8 52 C8 26 24 8 50 8Z" fill="#5b6cff" stroke="#1d1b2f" stroke-width="4"/>
    <path d="M44 9 Q50 0 58 6" stroke="#1d1b2f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="26" cy="60" rx="7" ry="4.5" fill="#ff9fbd"/><ellipse cx="74" cy="60" rx="7" ry="4.5" fill="#ff9fbd"/>
    <circle cx="36" cy="46" r="9" fill="#fff" stroke="#1d1b2f" stroke-width="3"/><circle cx="64" cy="46" r="9" fill="#fff" stroke="#1d1b2f" stroke-width="3"/>
    <circle cx="${mood==='sad'?36:38}" cy="${mood==='sad'?49:47}" r="4" fill="#1d1b2f"/><circle cx="${mood==='sad'?64:66}" cy="${mood==='sad'?49:47}" r="4" fill="#1d1b2f"/>
    ${brow}${m}</svg>`;
}

/* ---------- views ---------- */
const app=$('#app');
const starStr=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
function header(){
  const lv=level(),p=SAVE.xp%100;
  return `<header class="hdr">
    <h1 class="logo"><span class="b">Word</span>Pop <span class="th">ศัพท์ป๊อป</span></h1><span class="sp"></span>
    <div class="lvl stk"><span class="n">Lv.${lv}</span><div class="xpbar" title="${p}/100 XP"><i style="width:${p}%"></i></div><small>${SAVE.xp} XP</small></div>
  </header>`;
}
const GREET=['วันนี้เรียนหมวดไหนดี?','เลือกหมวดแล้วกด 📖 เรียน ก่อนก็ได้นะ','เก็บดาวให้ครบ 3 ดวงทุกหมวดเลย!','ฝึกวันละนิด เก่งขึ้นทุกวัน'];
function home(){
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  const rv=SAVE.review.filter(e=>byEn[e]);
  const total=CATS.reduce((a,c)=>a+(SAVE.stars[c.id]||0),0);
  app.innerHTML=header()+`
  <section class="hero stk">${mascot('happy','bounce')}<div><h2>${pick(GREET)}</h2><p>คำศัพท์ ${ALL.length} คำ · ${CATS.length} หมวด · ดาวที่เก็บแล้ว ${total}/${CATS.length*3}</p></div></section>
  ${rv.length?`<section class="review stk"><span style="font-size:36px">🔁</span><div class="t"><b>ทบทวนคำที่เคยตอบผิด</b><div style="color:var(--soft)">${rv.length} คำรออยู่</div></div><button class="btn pink" id="rvBtn" type="button">ฝึกเลย</button></section>`:''}
  <h2 class="sec">เลือกหมวด</h2>
  <section class="grid">${CATS.map(c=>`
    <article class="cat stk" style="background:${c.c}">
      <span class="stars" aria-label="${SAVE.stars[c.id]||0} ดาว">${starStr(SAVE.stars[c.id]||0)}</span>
      <span class="ic">${c.ic}</span>
      <div><div class="nm">${c.th}</div><div class="en">${c.en} · ${c.words.length} คำ</div></div>
      <div class="row"><button class="btn" type="button" data-learn="${c.id}">📖 เรียน</button><button class="btn pri" type="button" data-play="${c.id}">🎮 เล่น</button></div>
    </article>`).join('')}</section>`;
  app.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{unlockAudio();learn(b.dataset.learn);});
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{unlockAudio();quiz(b.dataset.play);});
  const rb=$('#rvBtn');if(rb)rb.onclick=()=>{unlockAudio();quiz('review');};
  scrollTo(0,0);
}

/* learn: flashcards */
function learn(cid,i=0){
  const c=CATS.find(x=>x.id===cid),w=c.words[i];
  app.innerHTML=`
  <div class="qbar"><button class="btn x" id="back" type="button" aria-label="กลับหน้าแรก">✕</button><div class="prog"><i style="width:${(i+1)/c.words.length*100}%"></i></div><span class="combo">${c.ic} ${c.th}</span></div>
  <section class="flash stk" style="background:${c.c}">
    ${hasTTS?'<button class="btn say" id="say" type="button" aria-label="ฟังเสียง">🔊</button>':''}
    <div class="em">${w.em}</div><div class="w">${esc(w.en)}</div><div class="t">${esc(w.th)}</div>
  </section>
  <div class="lnav">
    <button class="btn" id="prev" type="button" ${i===0?'disabled':''}>◀ ก่อนหน้า</button>
    <span class="cnt">${i+1} / ${c.words.length}</span>
    ${i<c.words.length-1?'<button class="btn pri" id="next" type="button">ถัดไป ▶</button>':'<button class="btn mint" id="go" type="button">🎮 ไปทดสอบ!</button>'}
  </div>`;
  speak(w.en);
  $('#back').onclick=home;
  if($('#say'))$('#say').onclick=()=>speak(w.en);
  $('#prev').onclick=()=>learn(cid,i-1);
  if($('#next'))$('#next').onclick=()=>{sfx.tap();learn(cid,i+1);};
  if($('#go'))$('#go').onclick=()=>quiz(cid);
  keyH=e=>{if(e.key==='ArrowRight'&&$('#next'))$('#next').click();if(e.key==='ArrowLeft'&&i>0)$('#prev').click();if(e.key===' '){e.preventDefault();speak(w.en);}};
  swipe($('.flash'),dir=>{if(dir<0&&$('#next'))$('#next').click();if(dir>0&&i>0)$('#prev').click();});
}
function swipe(el,cb){let x0=null;el.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)cb(dx);x0=null;});}

/* quiz */
let Q=null,keyH=null;
const TYPES=['pic','th2en','en2th','listen','spell'];
const canSpell=w=>!w.en.includes(' ')&&w.en.length<=8;
function quiz(cid){
  let pool,distract;
  if(cid==='review'){pool=shuffle(SAVE.review.map(e=>byEn[e]).filter(Boolean)).slice(0,10);distract=ALL;}
  else{const c=CATS.find(x=>x.id===cid);pool=shuffle(c.words).slice(0,10);distract=c.words;}
  const qs=pool.map((w,i)=>{
    let types=['pic','th2en','en2th'];
    if(hasTTS)types.push('listen');
    if(canSpell(w))types.push('spell','spell');
    const t=i<2?'pic':pick(types);
    return {w,t};
  });
  Q={cid,qs,i:0,hearts:3,combo:0,best:0,xp:0,right:[],wrong:[],distract};
  ask();
}
function opts4(w,pool){
  const same=shuffle(pool.filter(x=>x.en!==w.en&&x.em!==w.em&&x.th!==w.th));
  const more=shuffle(ALL.filter(x=>x.en!==w.en&&!same.includes(x)));
  return shuffle([w,...[...same,...more].slice(0,3)]);
}
function qbar(){
  return `<div class="qbar"><button class="btn x" id="back" type="button" aria-label="ออก">✕</button><div class="prog"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><span class="hearts" aria-label="หัวใจ ${Q.hearts}">${'❤️'.repeat(Q.hearts)}${'🤍'.repeat(3-Q.hearts)}</span>${Q.combo>=2?`<span class="combo pop">🔥${Q.combo}</span>`:''}</div>`;
}
function ask(){
  const {w,t}=Q.qs[Q.i];Q.locked=false;
  let prompt='',body='';
  if(t==='pic'){prompt=`<div class="ask">นี่คืออะไร?</div><div class="em">${w.em}</div>`;}
  if(t==='th2en'){prompt=`<div class="ask">คำนี้ภาษาอังกฤษว่าอะไร?</div><div class="bigth">${esc(w.th)}</div>`;}
  if(t==='en2th'){prompt=`<div class="ask">คำนี้แปลว่าอะไร?</div><div class="big">${esc(w.en)}</div>${hasTTS?'<button class="btn say" id="say" type="button" aria-label="ฟังเสียง" style="width:48px;height:48px;font-size:20px">🔊</button>':''}`;}
  if(t==='listen'){prompt=`<div class="ask">ฟังแล้วเลือกรูปให้ถูก</div><button class="btn say" id="say" type="button" aria-label="ฟังอีกครั้ง">🔊</button><div class="ask" style="font-size:14px">แตะเพื่อฟังอีกครั้ง</div>`;}
  if(t==='spell'){prompt=`<div class="ask">สะกดคำนี้</div><div class="em">${w.em}</div><div class="bigth" style="font-size:24px">${esc(w.th)}</div>`;}
  if(t==='spell'){
    const letters=w.en.split('');
    const extra=shuffle('abcdefghijklmnoprstuwy'.split('').filter(l=>!letters.includes(l))).slice(0,2);
    Q.tiles=shuffle([...letters,...extra]);Q.fill=[];
    body=`<div class="stk" style="padding:16px;display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div class="slots" id="slots">${letters.map((_,i)=>`<button class="slot" type="button" data-s="${i}" aria-label="ช่องที่ ${i+1}"></button>`).join('')}</div>
      <div class="tiles">${Q.tiles.map((l,i)=>`<button class="tile" type="button" data-t="${i}">${l}</button>`).join('')}</div>
      <div class="spellrow"><button class="btn" id="clr" type="button">↺ ล้าง</button></div></div>`;
  }else{
    Q.opts=opts4(w,Q.distract);
    const cls=t==='listen'?'emo':t==='en2th'?'th':'';
    body=`<div class="opts" id="opts">${Q.opts.map((o,i)=>`<button class="opt ${cls}" type="button" data-o="${i}"><span class="k">${i+1}</span>${t==='listen'?o.em:t==='en2th'?esc(o.th):esc(o.en)}</button>`).join('')}</div>`;
  }
  app.innerHTML=qbar()+`<div class="qa"><section class="prompt stk">${prompt}</section>${body}</div><div id="fbk"></div>`;
  $('#back').onclick=home;
  if($('#say'))$('#say').onclick=()=>speak(w.en);
  if(t==='listen'||t==='en2th')setTimeout(()=>speak(w.en),250);
  if(t==='spell'){
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>tapTile(+b.dataset.t));
    app.querySelectorAll('.slot').forEach(b=>b.onclick=()=>untap(+b.dataset.s));
    $('#clr').onclick=()=>{Q.fill=[];drawSlots();};
  }else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  keyH=e=>{
    if(Q.locked){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#nextBtn')?.click();}return;}
    if(t==='spell'){const k=e.key.toLowerCase();const idx=Q.tiles.findIndex((l,i)=>l===k&&!Q.fill.includes(i));if(idx>=0)tapTile(idx);if(e.key==='Backspace'){Q.fill.pop();drawSlots();}return;}
    const n=+e.key;if(n>=1&&n<=4)choose(n-1);
  };
}
function tapTile(i){if(Q.locked||Q.fill.includes(i))return;const w=Q.qs[Q.i].w;if(Q.fill.length>=w.en.length)return;Q.fill.push(i);sfx.tap();drawSlots();if(Q.fill.length===w.en.length)setTimeout(checkSpell,180);}
function untap(s){if(Q.locked)return;Q.fill.splice(s);drawSlots();}
function drawSlots(){
  app.querySelectorAll('.slot').forEach((el,i)=>{const t=Q.fill[i];el.textContent=t!=null?Q.tiles[t]:'';el.classList.toggle('f',t!=null);});
  app.querySelectorAll('.tile').forEach(el=>el.classList.toggle('used',Q.fill.includes(+el.dataset.t)));
}
function checkSpell(){
  const w=Q.qs[Q.i].w,got=Q.fill.map(i=>Q.tiles[i]).join('');
  const ok=got===w.en;
  $('#slots').classList.add(ok?'good':'wrong');
  if(!ok)setTimeout(()=>{app.querySelectorAll('.slot').forEach((el,i)=>el.textContent=w.en[i]);$('#slots').classList.remove('wrong');$('#slots').classList.add('good');},500);
  result(ok,15);
}
function choose(i){
  if(Q.locked)return;
  const {w}=Q.qs[Q.i],ok=Q.opts[i].en===w.en;
  const btns=app.querySelectorAll('.opt');
  btns.forEach((b,j)=>{if(Q.opts[j].en===w.en)b.classList.add('good');else if(j===i)b.classList.add('wrong');else b.classList.add('dim');});
  $('#opts').classList.add('locked');
  result(ok,10);
}
const PRAISE=['เยี่ยมมาก!','เก่งสุดๆ!','ถูกต้อง!','สุดยอด!','ใช่เลย!'];
const COMFORT=['ไม่เป็นไร จำไว้นะ','เกือบแล้ว!','สู้ๆ ข้อหน้าเอาใหม่'];
function result(ok,base){
  Q.locked=true;
  const {w}=Q.qs[Q.i];
  if(ok){Q.combo++;Q.best=Math.max(Q.best,Q.combo);const g=base+Math.min(10,(Q.combo-1)*2);Q.xp+=g;Q.right.push(w);sfx.good();if(Q.combo%5===0)confetti(40);}
  else{Q.combo=0;Q.hearts--;Q.wrong.push(w);sfx.bad();}
  setTimeout(()=>speak(w.en),ok?200:450);
  const last=Q.i>=Q.qs.length-1||Q.hearts<=0;
  $('#fbk').innerHTML=`<div class="fbk stk ${ok?'good':'bad'}">${mascot(ok?'cheer':'sad')}
    <div class="msg"><b>${ok?pick(PRAISE)+(Q.combo>=2?` 🔥${Q.combo}`:''):pick(COMFORT)}</b><span>${w.em} ${esc(w.en)} <em>= ${esc(w.th)}</em></span></div>
    <button class="btn ${ok?'mint':'pink'}" id="nextBtn" type="button">${last?'ดูผล':'ต่อไป ▶'}</button></div>`;
  const hb=app.querySelector('.hearts');if(hb)hb.innerHTML='❤️'.repeat(Q.hearts)+'🤍'.repeat(3-Q.hearts);
  $('#nextBtn').onclick=()=>{if(last)finish();else{Q.i++;ask();}};
  $('#nextBtn').focus({preventScroll:true});
  $('#fbk').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  const n=Q.qs.length,r=Q.right.length,out=Q.hearts<=0;
  const stars=out?0:r===n?3:r>=n*.8?2:r>=n*.5?1:0;
  SAVE.xp+=Q.xp;
  if(Q.cid!=='review')SAVE.stars[Q.cid]=Math.max(SAVE.stars[Q.cid]||0,stars);
  const rv=new Set(SAVE.review);Q.wrong.forEach(w=>rv.add(w.en));Q.right.forEach(w=>{if(Q.cid==='review')rv.delete(w.en);});SAVE.review=[...rv];
  persist();
  const answered=[...Q.right.map(w=>[w,1]),...Q.wrong.map(w=>[w,0])];
  app.innerHTML=header()+`<section class="res stk">
    ${mascot(stars>=2?'cheer':stars===1?'happy':'sad','bounce')}
    <h2>${out?'หัวใจหมดแล้ว!':stars===3?'เพอร์เฟกต์!':stars===2?'เก่งมาก!':stars===1?'ผ่านแล้ว!':'ลองอีกครั้งนะ'}</h2>
    <div class="bigstars">${[0,1,2].map(i=>`<span>${i<stars?'⭐':'☆'}</span>`).join('')}</div>
    <div class="pills"><span class="pill">ถูก <b>${r}</b>/${n}</span><span class="pill">ได้ <b>+${Q.xp}</b> XP</span><span class="pill">คอมโบสูงสุด <b>${Q.best}</b></span></div>
    <div class="wlist">${answered.map(([w,ok])=>`<div class="wi ${ok?'':'no'}"><span class="e">${w.em}</span><div class="tx"><b>${esc(w.en)}</b><small>${esc(w.th)}</small></div><span style="margin-left:auto">${ok?'✅':'❌'}</span></div>`).join('')}</div>
    <div class="actions">
      ${Q.wrong.length?'<button class="btn pink" id="rv" type="button">🔁 ฝึกคำที่ผิด</button>':''}
      <button class="btn pri" id="again" type="button">🎮 เล่นอีกครั้ง</button>
      <button class="btn" id="home" type="button">🏠 หน้าแรก</button>
    </div></section>`;
  if(stars>=2){sfx.win();confetti(stars===3?160:70);}
  const cid=Q.cid;
  $('#again').onclick=()=>quiz(cid);$('#home').onclick=home;
  if($('#rv'))$('#rv').onclick=()=>quiz('review');
  keyH=null;scrollTo(0,0);
}
addEventListener('keydown',e=>{if(keyH&&e.target.tagName!=='INPUT')keyH(e);});

/* ---------- confetti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#5b6cff','#ff5c8a','#2fcf8a','#ffc94d','#1d1b2f'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,life:120});
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();}
  raf=parts.length?requestAnimationFrame(step):0;
}

home();
})();
</script>
