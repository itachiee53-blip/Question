<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นับแคล</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>นับแคล</h1>

  <section class="card">
    <div class="row"><span id="date"></span>
      <label>เป้าหมาย <input id="goal" type="number" min="500" step="50"> kcal</label></div>
    <div class="total"><b id="eaten">0</b> / <span id="goalText">0</span> kcal</div>
    <div class="bar"><div id="fill"></div></div>
    <div id="left" class="muted"></div>
  </section>

  <section class="card">
    <h2>ถาม AI 🤖</h2>
    <input id="aiText" placeholder="เช่น ข้าวมันไก่ 1 จาน + ชาเย็น">
    <div class="row">
      <label class="btn ghost-btn">📷 ถ่ายรูป<input id="aiImg" type="file" accept="image/*" capture="environment" hidden></label>
      <button id="aiGo">วิเคราะห์</button>
    </div>
    <div id="aiMsg" class="muted"></div>
  </section>

  <section class="card">
    <h2>เพิ่มอาหาร</h2>
    <input id="search" list="foods" placeholder="ค้นหาเมนู เช่น ข้าวผัด">
    <datalist id="foods"></datalist>
    <div class="row">
      <input id="kcal" type="number" min="0" placeholder="kcal">
      <input id="qty" type="number" min="0.5" step="0.5" value="1" title="จำนวน">
      <button id="add">เพิ่ม</button>
    </div>
  </section>

  <section class="card">
    <div class="row"><h2>วันนี้กินอะไรไป</h2><button id="clear" class="ghost">ล้างวันนี้</button></div>
    <ul id="list"></ul>
  </section>
  <details class="card">
    <summary>ตั้งค่า Gemini</summary>
    <input id="gkey" type="password" placeholder="API key (เก็บไว้ในเครื่องนี้เท่านั้น)">
    <input id="gmodel" placeholder="gemini-2.5-flash">
    <p class="muted">ขอ key ฟรีที่ aistudio.google.com/apikey</p>
  </details>
</main>
<script src="js/foods.js"></script>
<script src="js/storage.js"></script>
<script src="js/gemini.js"></script>
<script src="js/app.js"></script>
</body>
</html>
