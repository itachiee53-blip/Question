<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4636">

<body>
<title>Notebook Monsters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: the whole game is a page in a Thai school exercise book. Canvas = the page; HUD = masking tape; answers = four sticky notes along the bottom edge. */
:root{
  --paper:#fbfaf3; --rule:#b9cbe6; --margin:#e57373; --desk:#5b4636;
  --ink:#22305c; --pencil:#4b4b4b; --red:#d8342c;
  --hl-y:#fff04d; --hl-p:#ff9fd0; --hl-g:#9cf08f; --hl-b:#8fd6ff; --hl-o:#ffbe6b;
  --tape:#efe3b4;
  --f-th:"Itim",system-ui,sans-serif;
  --f-en:"Patrick Hand","Itim",system-ui,sans-serif;
  --f-mark:"Permanent Marker","Itim",system-ui,sans-serif;
  --hand:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme:light;
}
html,body{height:100%;background:var(--desk);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:var(--f-th);-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:none;border:0}
button:focus-visible{outline:3px dashed var(--red);outline-offset:3px}

.game{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;left:0;right:0;top:6px;display:flex;align-items:flex-start;gap:10px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(56px,calc(env(safe-area-inset-left,0px) + 48px));pointer-events:none}
.tape{background:var(--tape);opacity:.95;padding:2px 14px 3px;font-size:20px;line-height:1.25;clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,3% 96%,0 50%);box-shadow:0 1px 0 #0001;white-space:nowrap}
.hearts{color:var(--red);letter-spacing:2px;transform:rotate(-2deg)}
.hearts .gone{color:#c9b9a0}
.page{transform:rotate(1.5deg)}
.sp{flex:1}
.score{font-family:var(--f-en);font-size:24px;transform:rotate(-1deg)}
.combo{font-family:var(--f-en);font-size:22px;color:var(--red);transform:rotate(3deg)}
.pause{pointer-events:auto;width:40px;height:36px;border:2.5px solid var(--ink);border-radius:var(--hand);background:var(--paper);font-family:var(--f-en);font-size:20px;line-height:1}
.eraser{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:84px;height:46px;border-radius:10px 10px 12px 12px;background:linear-gradient(90deg,#ff8fa7 0 55%,#3c6fd1 55% 100%);border:2.5px solid var(--ink);transform:rotate(-8deg);box-shadow:3px 4px 0 #0002;font-family:var(--f-th);font-size:13px;color:#fff;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 2px}
.eraser b{position:absolute;left:-10px;top:-12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-en);font-size:17px;transform:rotate(8deg)}
.eraser[disabled]{filter:grayscale(1);opacity:.55}
.shav{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:66px;width:78px;height:8px;border:2px solid var(--ink);border-radius:var(--hand);overflow:hidden;background:#fff}
.shav i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#e8b26a 0 6px,#c98a3d 6px 9px);transition:width .2s}
.typed{position:absolute;left:50%;bottom:22%;transform:translateX(-50%) rotate(-2deg);font-family:var(--f-en);font-size:34px;color:var(--ink);background:linear-gradient(transparent 55%,var(--hl-y) 55% 90%,transparent 90%);padding:0 6px;pointer-events:none}

.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--desk);box-shadow:inset 0 8px 10px -6px #0006}
.note{--c:var(--hl-y);--r:-1.6deg;position:relative;min-height:62px;background:var(--c);transform:rotate(var(--r));box-shadow:2px 5px 0 #0003,inset 0 -10px 14px -12px #0003;font-family:var(--f-en);font-size:clamp(20px,2.8vw,30px);color:var(--ink);line-height:1.05;padding:6px 6px 4px;overflow-wrap:anywhere;transition:transform .08s}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:46%;height:16px;transform:translateX(-50%) rotate(2deg);background:#f4ecc9cc;box-shadow:0 1px 0 #0001}
.note:nth-child(2){--c:var(--hl-p);--r:1.2deg} .note:nth-child(3){--c:var(--hl-g);--r:-.8deg} .note:nth-child(4){--c:var(--hl-b);--r:1.8deg}
.note .k{position:absolute;left:7px;bottom:3px;font-size:13px;opacity:.5}
.note:active{transform:rotate(var(--r)) translateY(3px) scale(.97);box-shadow:1px 2px 0 #0003}
.note.new{animation:stick .3s ease-out}
@keyframes stick{from{transform:rotate(calc(var(--r) - 8deg)) translateY(-14px);opacity:0}}
.note.bad .w{text-decoration:line-through 3px var(--red)}
.note.bad{animation:nope .35s}
@keyframes nope{25%{transform:rotate(var(--r)) translateX(-7px)}75%{transform:rotate(var(--r)) translateX(7px)}}
.note.hint{animation:wig .6s infinite}
@keyframes wig{50%{transform:rotate(calc(var(--r) + 3deg)) scale(1.05)}}
.note.match{outline:3px solid var(--ink);outline-offset:2px}
.bar.lock .note{filter:saturate(.3) brightness(.95)}
@media (max-width:560px) and (orientation:portrait){.bar{grid-template-columns:1fr 1fr;gap:12px 10px}.note{min-height:54px}}
@media (orientation:landscape) and (max-height:480px){.note{min-height:40px;font-size:21px;padding:3px 6px}.bar{padding-top:9px;gap:10px}}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:#3b2d22cc;overflow:auto}
.sheet{position:relative;width:min(780px,100%);margin:auto;background:var(--paper);background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px 48px,transparent 48px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);padding:26px 22px 22px 64px;box-shadow:0 10px 0 -4px #e9e4d2,0 12px 30px #0006;transform:rotate(-.6deg);animation:slide .35s ease-out}
@keyframes slide{from{transform:translateY(40px) rotate(-3deg);opacity:0}}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:90px;height:26px;background:#f1e6bccc}
.sheet::before{left:30px;transform:rotate(-8deg)} .sheet::after{right:30px;transform:rotate(7deg)}
.holes{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly}
.holes i{width:16px;height:16px;border-radius:50%;background:#3b2d22;box-shadow:inset 0 2px 3px #0008}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.title{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(38px,7.5vw,74px);line-height:.95;color:var(--ink);transform:rotate(-2deg)}
.title span{display:inline-block;background:linear-gradient(transparent 50%,var(--hl-y) 50% 88%,transparent 88%);padding:0 8px}
.title small{display:block;font-family:var(--f-th);font-size:.38em;color:var(--red);margin-top:6px;transform:rotate(1deg)}
.lead{margin:0;font-size:19px;max-width:34em}
.how{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:17px}
.how span{display:inline-flex;align-items:center;gap:6px}
.how svg{width:30px;height:30px}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
@media (max-width:560px){.books{grid-template-columns:1fr}}
.book{--c:#4f9d69;position:relative;background:var(--c);border-radius:4px 10px 10px 4px;padding:18px 12px 14px 22px;box-shadow:inset 10px 0 0 #0002,4px 5px 0 #0003;text-align:left;transition:transform .12s;color:var(--ink)}
.book:hover{transform:translateY(-4px) rotate(-1deg)}
.book:nth-child(2){--c:#3f6fb5} .book:nth-child(3){--c:#c8553d}
.lbl{background:#fff;border:2px solid #0003;border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;font-size:16px;line-height:1.35}
.lbl .r{border-bottom:1.5px dotted #0004;display:flex;gap:6px}
.lbl .r em{font-style:normal;color:#0009;min-width:3.2em}
.lbl b{font-family:var(--f-en);font-weight:400;font-size:19px}
.book .ex{display:block;margin-top:8px;color:#fff;font-family:var(--f-en);font-size:18px;opacity:.9}
.toggles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:17px}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk i{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:var(--hand);display:grid;place-items:center;font-style:normal;font-family:var(--f-mark);color:var(--red);font-size:18px;line-height:1}
.big{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1.05;transform:rotate(-1.5deg)}
.big.red{color:var(--red)}
.btn{font-family:var(--f-th);font-size:21px;padding:8px 26px;border:3px solid var(--ink);border-radius:var(--hand);background:var(--hl-y);box-shadow:3px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn.plain{background:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stats{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;font-size:17px}
.stats b{display:block;font-family:var(--f-en);font-weight:400;font-size:34px;line-height:1;color:var(--ink)}
.stickers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
@media (max-width:560px){.stickers{grid-template-columns:1fr}}
.stk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;transition:transform .12s}
.stk:hover{transform:rotate(-3deg) scale(1.04)}
.stk .disc{width:92px;height:92px;border-radius:50%;background:var(--c,#fff04d);border:5px solid #fff;box-shadow:0 0 0 2px #0002,2px 4px 0 #0002;display:grid;place-items:center}
.stk .disc svg{width:56px;height:56px}
.stk .n{font-size:20px}
.stk .d{font-size:15px;color:#555}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;width:100%;max-height:30vh;overflow:auto;text-align:left;font-size:17px}
.mw{display:flex;gap:6px;align-items:baseline;text-align:left;padding:2px 0;border-bottom:1px dashed #0002}
.mw b{font-family:var(--f-en);font-weight:400;font-size:21px;color:var(--red)}
.newrec{font-family:var(--f-mark);color:var(--red);border:3px solid var(--red);border-radius:var(--hand);padding:2px 12px;transform:rotate(-6deg);font-size:20px}
@media (orientation:landscape) and (max-height:480px){.sheet{padding:18px 16px 16px 58px}.panel{gap:8px}.title{font-size:44px}.lead{font-size:16px}.book{padding:10px 10px 10px 18px}.stk .disc{width:64px;height:64px}.stk .disc svg{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){.note.new,.note.bad,.note.hint,.sheet{animation:none}}
</style>

<div class="game">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <span class="tape hearts" id="hp">♥♥♥♥♥</span>
      <span class="tape page" id="pageLbl">หน้า 1</span>
      <span class="sp"></span>
      <span class="combo" id="combo" hidden>x0</span>
      <span class="tape score" id="score">0</span>
      <button class="pause" type="button" id="pauseBtn" aria-label="หยุดเกม">II</button>
    </div>
    <div class="shav" ><i id="shav"></i></div>
    <button class="eraser" type="button" id="eraser" aria-label="ยางลบยักษ์ ลบศัตรูทั้งหน้า"><b id="eraserN">1</b></button>
    <div class="typed" id="typed"></div>
  </div>
  <div class="bar" id="bar">
    <button class="note" type="button" data-i="0"><span class="w">…</span><span class="k">1</span></button>
    <button class="note" type="button" data-i="1"><span class="w">…</span><span class="k">2</span></button>
    <button class="note" type="button" data-i="2"><span class="w">…</span><span class="k">3</span></button>
    <button class="note" type="button" data-i="3"><span class="w">…</span><span class="k">4</span></button>
  </div>
</div>
<div class="ov" id="ov"><div class="sheet"><div class="holes"><i></i><i></i><i></i></div><div class="panel" id="panel"></div></div></div>

let ac=null,nb=null;

function nz(d,v,type,f,q=1,at=0,f2){
  if(!ac||!OPT.sfx)return;const t=ac.currentTime+at,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nb;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(ac.destination);s.start(t,Math.random()*.3);s.stop(t+d+.02);
}
function tn(f,d,type='sine',v=.08,f2=0,at=0){
  if(!ac||!OPT.sfx)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}

function blob(x,y,r,id,irr=.1,n=12){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=r*(1+(hh(id*13.1+i)-.5)*irr*2);p.push([x+Math.cos(a)*k+(hh(id+i*7.3)-.5)*1.8,y+Math.sin(a)*k+(hh(id*3.7+i)-.5)*1.8]);}return p;}

  const w=pick(pool);G.recent.push(w.en);if(G.recent.length>Math.min(25,G.words.length/2))G.recent.shift();return w;
}

const notes=[...document.querySelectorAll('.note')];
function setNote(i,w){G.slots[i]=w;const b=notes[i];b.querySelector('.w').textContent=w?w.en:'…';b.classList.remove('new','bad');void b.offsetWidth;b.classList.add('new');}
function refreshBar(){

    if(i<0)i=G.slots.reduce((bi,s,j)=>alive.findIndex(a=>a.en===s.en)>alive.findIndex(a=>a.en===G.slots[bi].en)?j:bi,0);
    setNote(i,w);
  }
  for(let i=0;i<4;i++)if(!G.slots[i]){const h=have();setNote(i,pick(G.words.filter(w=>!h.has(w.en)&&!aliveSet.has(w.en))));}
}
function replaceSlot(i){
  const alive=live().sort((a,b)=>b.y-a.y).map(cur),have=new Set(G.slots.filter(Boolean).map(w=>w.en));
  setNote(i,alive.find(w=>!have.has(w.en))||pick(G.words.filter(w=>!have.has(w.en)&&!alive.some(a=>a.en===w.en))));

/* ---------- combat ---------- */
function fire(slot){
  if(state!=='play'||!G||G.t<G.lockUntil)return;
  const w=typeof slot==='number'?G.slots[slot]:slot;if(!w)return;
  const tg=live().filter(e=>cur(e).en===w.en).sort((a,b)=>b.y-a.y);
  if(!tg.length){
    G.combo=0;G.lockUntil=G.t+.7;SFX.bad();
    if(typeof slot==='number'){const b=notes[slot];b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}
    G.floats.push({x:W/2,y:groundY()-130*SC,text:'ผิด!',c:RED,life:1.3,size:22,font:FONT_TH});
    return;
  }
  strike(tg[0],true);
  if(G.chain&&Math.random()<G.chain){const o=live().filter(x=>!x.boss);if(o.length){const t=pick(o);setTimeout(()=>{if(G&&!t.dying&&state==='play')strike(t,false);},160);}}
  const si=G.slots.findIndex(s=>s&&s.en===w.en);
  if(si>=0&&!live().some(x=>cur(x).en===w.en))replaceSlot(si);
}
function strike(e,learn){
  const w=cur(e),tx=W/2,ty=groundY()-56*SC;
  G.aim=Math.atan2(e.y-ty,e.x-tx);
  G.strokes.push({x1:tx+Math.cos(G.aim)*64*SC,y1:ty+Math.sin(G.aim)*64*SC,x2:e.x,y2:e.y,life:.22,id:Math.random()*99});
  SFX.scribble();hitstop=.05;
  if(learn){G.combo++;G.best=Math.max(G.best,G.combo);G.learned.add(w.en);speak(w.en);
    G.charge++;if(G.charge>=10){G.charge=0;G.erasers++;G.floats.push({x:W-70,y:H-120,text:'+1 ยางลบ',c:INK,life:1.3,size:24,font:FONT_TH});SFX.sticker();}
    if(TUT<3){TUT++;store.set('nm-tut',TUT);}}
  const height=1-clamp(e.y/hitY(),0,1);
  const pts=Math.round((100+height*80+Math.min(G.combo,30)*10)*G.mult*(e.boss?1.5:1));
  G.score+=pts;
  G.floats.push({x:e.x,y:e.y-e.r-48*SC,text:`${w.en} = ${w.th}`,c:'#1f7a3a',life:1.5,size:22,font:FONT_TH,tick:true});

  if(e.boss&&e.idx<e.words.length-1){e.idx++;e.flash=.3;shake=Math.max(shake,6);crumbs(e.x,e.y,12);SFX.shield();refreshBar();return;}

}
function crumbs(x,y,n,s=1){for(let i=0;i<n;i++){const a=rnd(-Math.PI,0)+rnd(-.5,.5),v=rnd(80,320)*SC*s;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.5,1),max:1,w:rnd(3,8)*SC,h:rnd(2,4)*SC,rot:rnd(0,6),vr:rnd(-8,8),c:pick(['#ff8fa7','#f3a8b7','#9a9a9a','#c4b49a','#e8b26a'])});}}

/* ---------- update ---------- */
function update(dt){
  if(!G)return;
  if(hitstop>0){hitstop-=dt;return;}
  G.t+=dt;seed=Math.floor(G.t*8)%3;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(state==='play'){
    if(G.spawnLeft>0){
      G.spawnT-=dt;
      if(G.spawnT<=0&&live().length<Math.min(2+Math.floor(G.wave/2),6)){
        if(G.bossPending){spawn(true);G.bossPending=false;}else{spawn(false);G.spawnLeft--;}
        G.spawnT=Math.max(1.1,3-G.wave*.12)*rnd(.8,1.2);
      }
    }else if(!G.enemies.length&&!G.bossPending&&!G.sweep){state='between';setTimeout(showShop,800);}
    for(const e of G.enemies){
      if(e.dying)continue;
      e.y+=e.vy*G.slow*dt;e.x=e.bx+Math.sin(G.t*1.2+e.ph)*12*SC;e.flash=Math.max(0,e.flash-dt);
      if(e.y+e.r*.6>=hitY())baseHit(e);
    }
    G.barT-=dt;if(G.barT<=0){G.barT=.35;refreshBar();}
  }
  for(const e of G.enemies)if(e.dying>0){e.dying-=dt;if(e.dying<=0){e.dying=-1;crumbs(e.x,e.y,e.boss?60:22,e.boss?1.6:1);SFX.pop();}}
  G.enemies=G.enemies.filter(e=>e.dying!==-1);
  if(G.sweep){
    G.sweep.x+=W*1.6*dt;
    for(const e of G.enemies){if(!e.dying&&e.x<G.sweep.x&&!G.sweep.done.has(e.id)){G.sweep.done.add(e.id);
      if(e.boss&&e.idx<e.words.length-1){e.idx++;e.flash=.3;}else{e.dying=.15;G.score+=50;}}}
    if(G.sweep.x>W+150*SC){G.sweep=null;G.slots=[null,null,null,null];refreshBar();}
  }
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy+=520*SC*dt;p.rot+=p.vr*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0&&p.y<H+20);
  G.strokes.forEach(s=>s.life-=dt);G.strokes=G.strokes.filter(s=>s.life>0);
  G.floats.forEach(f=>{f.life-=dt;f.y-=20*dt;});G.floats=G.floats.filter(f=>f.life>0);
  G.redX=Math.max(0,(G.redX||0)-dt);
}

  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;shake=Math.max(0,shake-1.2);
  cx.drawImage(bg,0,0,W,H);
  cx.save();cx.translate(sx,sy);
  const hy=hitY();
  cx.setLineDash([10,8]);line(marginX()+4,hy,W-8,hy,5,2,RED);cx.setLineDash([]);
    if(G){
    const near=live().sort((a,b)=>b.y-a.y)[0];
    for(const e of G.enemies)drawMonster(e,e===near);
    drawFort();
    for(const s of G.strokes){cx.globalAlpha=s.life/.22;
      for(let k=0;k<2;k++){cx.strokeStyle=PENCIL;cx.lineWidth=(4-k*2)*SC;cx.beginPath();const n=7;for(let i=0;i<=n;i++){const t=i/n;cx.lineTo(s.x1+(s.x2-s.x1)*t+(i%n?(hh(s.id+i+k)-.5)*10:0),s.y1+(s.y2-s.y1)*t+(i%n?(hh(s.id+i*2+k)-.5)*10:0));}cx.stroke();}
      cx.globalAlpha=1;}
    for(const p of G.parts){cx.globalAlpha=clamp(p.life/p.max*1.5,0,1);cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();}
    cx.globalAlpha=1;
    if(G.sweep)drawSweep();
    if(near&&TUT<3&&state==='play')drawHint(near);
    for(const f of G.floats)drawFloat(f);
    if(G.banner)drawBanner(G.banner);
  }
  cx.restore();
}
function drawMonster(e,isNear){
  const {x,y,r,id}=e,t=G.t;
  const danger=y>hitY()-130*SC;
  const sp=clamp((t-e.born)*4,0,1);
  cx.save();cx.translate(x,y);cx.rotate(e.rot);cx.scale(sp,sp);
  const legs=e.boss?6:3;
  for(let i=0;i<legs;i++){const lx=(i-(legs-1)/2)*r*.55,st=Math.sin(t*9+i*2+e.ph)*r*.18;line(lx,r*.7,lx+st,r*1.25,id*7+i,2.4*SC);line(lx+st,r*1.25,lx+st+r*.15,r*1.25,id*9+i,2.4*SC);}
  const irr=[.08,.18,.3,.06,.12][e.kind%5]||.1;
  const pts=blob(0,0,r,id,e.boss?.12:irr,e.kind===2?16:12);
  cx.save();cx.translate(4*SC,3*SC);curve(pts);cx.fillStyle=e.flash?'#fff':e.col;cx.fill();cx.restore();
  curve(pts);cx.strokeStyle=danger&&isNear?RED:INK;cx.lineWidth=2.6*SC;cx.stroke();
  cx.save();curve(pts);cx.clip();cx.strokeStyle='#22305c33';cx.lineWidth=1.2;for(let k=-r;k<r*2;k+=6*SC){cx.beginPath();cx.moveTo(k,r);cx.lineTo(k+r*.6,r*.3);cx.stroke();}cx.restore();
  if(e.kind===0||e.boss){line(-r*.5,-r*.75,-r*.75,-r*1.25,id+31,2.6*SC);line(-r*.75,-r*1.25,-r*.25,-r*.9,id+32,2.6*SC);line(r*.5,-r*.75,r*.75,-r*1.25,id+33,2.6*SC);line(r*.75,-r*1.25,r*.25,-r*.9,id+34,2.6*SC);}
  if(e.kind===1){line(0,-r,r*.2,-r*1.5,id+35,2.4*SC);cx.beginPath();cx.arc(r*.2,-r*1.55,4*SC,0,7);cx.fillStyle=INK;cx.fill();}
  const look=Math.atan2(groundY()-y,W/2-x);
  const eyes=e.kind===3?[[0,-.15,.38]]:e.boss?[[-.35,-.2,.2],[0,-.32,.17],[.35,-.2,.2]]:[[-.3,-.15,.22],[.3,-.15,.22]];
  for(const [ex,ey,er] of eyes){cx.beginPath();cx.arc(ex*r,ey*r,er*r,0,7);cx.fillStyle='#fff';cx.fill();cx.strokeStyle=INK;cx.lineWidth=2*SC;cx.stroke();
    cx.beginPath();cx.arc(ex*r+Math.cos(look)*er*r*.45,ey*r+Math.sin(look)*er*r*.45,er*r*.45,0,7);cx.fillStyle=INK;cx.fill();}
  cx.beginPath();cx.moveTo(-r*.32,r*.3);cx.quadraticCurveTo(0,r*(danger?.6:.48),r*.32,r*.3);cx.strokeStyle=INK;cx.lineWidth=2.4*SC;cx.stroke();
  cx.fillStyle='#fff';for(const tx of [-.15,.1]){cx.beginPath();cx.moveTo(tx*r,r*.34);cx.lineTo(tx*r+r*.1,r*.34);cx.lineTo(tx*r+r*.05,r*.46);cx.closePath();cx.fill();cx.stroke();}
  if(e.boss){cx.font=`${r*.42}px ${FONT_MK}`;cx.fillStyle=RED;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('F',r*.62,-r*.62);cx.beginPath();cx.arc(r*.62,-r*.62,r*.28,0,7);cx.strokeStyle=RED;cx.lineWidth=2.5;cx.stroke();}
  if(e.dying>0){const k=1-e.dying/.32;cx.strokeStyle=PENCIL;cx.lineWidth=3*SC;cx.beginPath();const n=Math.floor(k*14);for(let i=0;i<=n;i++){cx.lineTo(-r+i/14*r*2+(hh(id+i)-.5)*6,(i%2?-r*.8:r*.8)+(hh(id*2+i)-.5)*8);}cx.stroke();}
  cx.restore();
  if(e.dying)return;
  if(e.boss){for(let i=0;i<e.words.length;i++){cx.beginPath();cx.arc(x-(e.words.length-1)*10*SC+i*20*SC,y+r*1.5,6*SC,0,7);if(i>=e.idx){cx.fillStyle=RED;cx.fill();}cx.strokeStyle=RED;cx.lineWidth=2;cx.stroke();}}
  const w=cur(e),fs=(e.boss?26:22)*SC;
  cx.font=`${fs}px ${FONT_TH}`;
  const emo='';
  const tw=cx.measureText(w.th).width+(emo?fs*1.25:0)+24*SC,th=fs*1.65;
  const lx=clamp(x-tw/2,marginX()+6,W-tw-6),ly=Math.max(50,y-r-th-16*SC-(e.boss?14*SC:0));
  cx.save();cx.translate(lx+tw/2,ly+th/2);cx.rotate(e.rot*-1.5);
  cx.fillStyle='#0000001a';cx.fillRect(-tw/2+3,-th/2+4,tw,th);
  cx.fillStyle='#fffbe0';cx.fillRect(-tw/2,-th/2,tw,th);
  cx.fillStyle='#efe3b4cc';cx.save();cx.rotate(.08);cx.fillRect(-tw*.18,-th/2-7*SC,tw*.36,13*SC);cx.restore();
  cx.textBaseline='middle';cx.textAlign='left';cx.fillStyle=INK;let tx=-tw/2+12*SC;
  if(emo){cx.font=`${fs*.95}px sans-serif`;cx.fillText(emo,tx,2);tx+=fs*1.25;cx.font=`${fs}px ${FONT_TH}`;}
  cx.fillText(w.th,tx,2);
  if(isNear&&danger){cx.strokeStyle=RED;cx.lineWidth=2.5;cx.beginPath();cx.ellipse(0,0,tw/2+10,th/2+8,0,.2,Math.PI*2+.4);cx.stroke();}
  cx.restore();
}
function drawFort(){
  const x=W/2,y=groundY(),w=150*SC,h=60*SC,id=777;
  if(G.shield>0){cx.strokeStyle='#2b6cb0';cx.lineWidth=3;cx.setLineDash([6,6]);cx.beginPath();cx.ellipse(x,y-30*SC,w*.75,h*1.25,0,Math.PI,0);cx.stroke();cx.setLineDash([]);
    cx.font=`16px ${FONT_TH}`;cx.fillStyle='#2b6cb0';cx.textAlign='center';cx.textBaseline='alphabetic';cx.fillText('x'+G.shield,x+w*.62,y-h*1.25);}
  const pts=[[x-w/2,y],[x-w/2,y-h],[x-w/2+16*SC,y-h],[x-w/2+16*SC,y-h+12*SC],[x-w/2+34*SC,y-h+12*SC],[x-w/2+34*SC,y-h],[x+w/2-34*SC,y-h],[x+w/2-34*SC,y-h+12*SC],[x+w/2-16*SC,y-h+12*SC],[x+w/2-16*SC,y-h],[x+w/2,y-h],[x+w/2,y]];
  cx.beginPath();pts.forEach((p,i)=>{const jx=p[0]+(hh(id+i)-.5)*2,jy=p[1]+(hh(id+i*3)-.5)*2;i?cx.lineTo(jx,jy):cx.moveTo(jx,jy);});cx.closePath();
  cx.save();cx.translate(4,3);cx.fillStyle='#ffd8a8';cx.fill();cx.restore();cx.strokeStyle=INK;cx.lineWidth=2.8*SC;cx.stroke();
  for(let r=1;r<4;r++){const yy=y-r*h/4;line(x-w/2+4,yy,x+w/2-4,yy,id+r*11,1.3,'#22305c55');}
  cx.beginPath();cx.moveTo(x-16*SC,y);cx.lineTo(x-16*SC,y-24*SC);cx.quadraticCurveTo(x,y-40*SC,x+16*SC,y-24*SC);cx.lineTo(x+16*SC,y);cx.fillStyle='#fbfaf3';cx.fill();cx.strokeStyle=INK;cx.lineWidth=2.4*SC;cx.stroke();
  line(x+w/2-10*SC,y-h,x+w/2-10*SC,y-h-38*SC,id+90,2.4*SC);
  cx.beginPath();cx.moveTo(x+w/2-10*SC,y-h-38*SC);cx.lineTo(x+w/2+22*SC,y-h-30*SC+Math.sin(G.t*5)*3);cx.lineTo(x+w/2-10*SC,y-h-22*SC);cx.closePath();cx.fillStyle=RED;cx.fill();cx.strokeStyle=INK;cx.stroke();
  cx.font=`${12*SC}px ${FONT_MK}`;cx.fillStyle='#fff';cx.textAlign='left';cx.textBaseline='middle';cx.fillText('A+',x+w/2-6*SC,y-h-30*SC);
  cx.save();cx.translate(x,y-56*SC);cx.rotate(G.aim);
  const L=64*SC,T=13*SC;
  cx.fillStyle='#ff8fa7';cx.fillRect(-14*SC,-T/2,10*SC,T);cx.fillStyle='#b8b8c8';cx.fillRect(-4*SC,-T/2,8*SC,T);
  cx.fillStyle='#ffd23f';cx.fillRect(4*SC,-T/2,L-20*SC,T);
  cx.fillStyle='#f2d2a2';cx.beginPath();cx.moveTo(L-16*SC,-T/2);cx.lineTo(L,0);cx.lineTo(L-16*SC,T/2);cx.fill();
  cx.fillStyle=PENCIL;cx.beginPath();cx.moveTo(L-5*SC,-T*.16);cx.lineTo(L,0);cx.lineTo(L-5*SC,T*.16);cx.fill();
  cx.strokeStyle=INK;cx.lineWidth=2*SC;cx.strokeRect(-14*SC,-T/2,L-2*SC,T);line(4*SC,0,L-18*SC,0,id+50,1,'#c79a1c');
  cx.restore();
  cx.beginPath();cx.arc(x,y-56*SC,10*SC,0,7);cx.fillStyle=G.t<G.lockUntil?RED:'#fbfaf3';cx.fill();cx.strokeStyle=INK;cx.lineWidth=2.2*SC;cx.stroke();
  if(G.redX){cx.globalAlpha=Math.min(1,G.redX*2);line(x-60*SC,y-90*SC,x+60*SC,y,1,7*SC,RED);line(x+60*SC,y-90*SC,x-60*SC,y,2,7*SC,RED);cx.globalAlpha=1;}
}
function drawSweep(){
  const x=G.sweep.x,y=H*.45,w=120*SC,h=H*.9;
  cx.fillStyle='#fbfaf3aa';cx.fillRect(0,0,Math.max(0,x-w/2),H);
  cx.save();cx.translate(x,y);cx.rotate(-.12);
  cx.fillStyle='#ff8fa7';cx.fillRect(-w/2,-h/2,w,h*.55);cx.fillStyle='#3c6fd1';cx.fillRect(-w/2,h*.05,w,h*.45);
  cx.strokeStyle=INK;cx.lineWidth=3;rr(-w/2,-h/2,w,h,14);cx.stroke();
  cx.font=`${26*SC}px ${FONT_MK}`;cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';cx.save();cx.rotate(Math.PI/2);cx.fillText('ERASER',h*.25,0);cx.restore();
  cx.restore();
}
function drawHint(e){
  const i=G.slots.findIndex(s=>s&&s.en===cur(e).en);if(i<0)return;
  const nr=notes[i].getBoundingClientRect(),cr=cv.getBoundingClientRect();
  const tx=nr.left+nr.width/2-cr.left,ty=H-6;
  const fx=e.x+e.r*.9,fy=e.y+e.r;
  cx.strokeStyle=RED;cx.lineWidth=3;cx.setLineDash([2,7]);cx.lineCap='round';cx.beginPath();cx.moveTo(fx,fy);cx.quadraticCurveTo((fx+tx)/2+60*SC,(fy+ty)/2,tx,ty-8);cx.stroke();cx.setLineDash([]);
  line(tx,ty-8,tx-10,ty-24,91,3,RED);line(tx,ty-8,tx+12,ty-22,92,3,RED);
  cx.font=`${22*SC}px ${FONT_TH}`;cx.fillStyle=RED;cx.textAlign='center';cx.textBaseline='alphabetic';cx.fillText('แตะ!',tx,ty-34*SC);
  notes.forEach((n,j)=>n.classList.toggle('hint',j===i));
}
function drawFloat(f){
  cx.globalAlpha=clamp(f.life*2,0,1);
  cx.font=`${f.size*SC}px ${f.font}`;cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(f.text).width;
  if(f.hl){cx.fillStyle='#fff04dcc';cx.save();cx.translate(f.x,f.y);cx.rotate(-.04);cx.fillRect(-w/2-10,-f.size*SC*.1,w+20,f.size*SC*.55);cx.restore();}
  if(f.boxed){cx.fillStyle='#fffbe0';cx.fillRect(f.x-w/2-16,f.y-f.size*SC*.85,w+32,f.size*SC*1.7);cx.strokeStyle=RED;cx.lineWidth=2.5;cx.strokeRect(f.x-w/2-16,f.y-f.size*SC*.85,w+32,f.size*SC*1.7);}
  cx.fillStyle=f.c;cx.fillText(f.text+(f.tick?' ✓':''),f.x,f.y);
  if(f.circle){cx.strokeStyle=f.c;cx.lineWidth=2;cx.beginPath();cx.ellipse(f.x,f.y,w/2+8,f.size*SC*.6,-.1,.3,Math.PI*2+.2);cx.stroke();}
  cx.globalAlpha=1;
}
function drawBanner(b){
  const k=b.t>1.9?(2.2-b.t)/.3:b.t<.4?b.t/.4:1;cx.globalAlpha=k;
  cx.font=`${60*SC}px ${FONT_TH}`;cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(b.text).width;
  cx.save();cx.translate(W/2,H*.36);cx.rotate(-.03);cx.fillStyle=b.boss?'#ff9fd0cc':'#fff04dcc';cx.fillRect(-w/2-14,-2,(w+28)*Math.min(1,k*1.2),30*SC);cx.restore();
  cx.fillStyle=b.boss?RED:INK;cx.fillText(b.text,W/2,H*.36);
  if(b.sub){cx.font=`${24*SC}px ${FONT_TH}`;cx.fillText(b.sub,W/2,H*.36+52*SC);}
  cx.globalAlpha=1;
}

/* ---------- HUD ---------- */
function hud(){
  if(!G)return;
  $('#hp').innerHTML='♥'.repeat(Math.max(0,G.hp))+`<span class="gone">${'♡'.repeat(Math.max(0,5-G.hp))}</span>`;
  $('#pageLbl').textContent='หน้า '+G.wave;
  $('#score').textContent=G.score.toLocaleString('en-US');
  const c=$('#combo');c.hidden=G.combo<2;c.textContent='x'+G.combo;
  $('#eraserN').textContent=G.erasers;$('#eraser').disabled=G.erasers<=0;
  $('#shav').style.width=G.charge*10+'%';
  $('#bar').classList.toggle('lock',G.t<G.lockUntil);
  $('#typed').textContent=typed;
  notes.forEach((b,i)=>b.classList.toggle('match',!!typed&&!!G.slots[i]&&G.slots[i].en.startsWith(typed)));
  if(TUT>=3)notes.forEach(n=>n.classList.remove('hint'));
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'||state==='dying'||state==='between')update(dt);
  draw();hud();requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
const ov=$('#ov'),panel=$('#panel');
function show(html){panel.innerHTML=html;ov.hidden=false;const s=ov.querySelector('.sheet');s.style.animation='none';void s.offsetWidth;s.style.animation='';}
const HOW=`<div class="how">
  <span><svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="13" fill="#9cf08f" stroke="#22305c" stroke-width="2.5"/><circle cx="15" cy="19" r="3" fill="#22305c"/><circle cx="25" cy="19" r="3" fill="#22305c"/></svg>คำไทย</span>
  <span><svg viewBox="0 0 40 40"><rect x="6" y="8" width="28" height="24" fill="#fff04d" stroke="#22305c" stroke-width="2.5" transform="rotate(-6 20 20)"/><path d="M12 20 h16" stroke="#22305c" stroke-width="2.5"/></svg>แตะคำอังกฤษ</span>
</div>`;
function title(){
  state='title';G=null;typed='';notes.forEach(n=>{n.classList.remove('hint','match');n.querySelector('.w').textContent='…';});
  show(`<h1 class="title"><span>Notebook</span><br>Monsters<small>ปีศาจหน้าสมุด</small></h1>
    ${HOW}
    <div class="books">${Object.entries(TIERS).map(([k,t])=>`<button class="book" type="button" data-tier="${k}"><div class="lbl"><span class="r"><em>ระดับ</em>${t.lvl}</span><span class="r"><em>สถิติ</em><b>${BEST[k]?BEST[k].toLocaleString('en-US'):'-'}</b></span></div></button>`).join('')}</div>
    <div class="toggles"><button class="chk" type="button" id="tSfx"><i>${OPT.sfx?'✓':''}</i>เสียง</button><button class="chk" type="button" id="tVoice"><i>${OPT.voice?'✓':''}</i>อ่านคำ</button></div>`);
  panel.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>start(b.dataset.tier));
  $('#tSfx').onclick=e=>{OPT.sfx=!OPT.sfx;e.currentTarget.querySelector('i').textContent=OPT.sfx?'✓':'';store.set('nm-opt',OPT);};
  $('#tVoice').onclick=e=>{OPT.voice=!OPT.voice;e.currentTarget.querySelector('i').textContent=OPT.voice?'✓':'';store.set('nm-opt',OPT);};
}
function start(tier){
  audio();
  if(matchMedia('(pointer:coarse)').matches){try{document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}
  ov.hidden=true;typed='';newGame(tier);
}
function showShop(){
  if(!G)return;state='shop';
  const opts=shuffle(UPG.filter(u=>!(u.id==='repair'&&G.hp>=G.maxHp))).slice(0,3);
  show(`<h2 class="big">เลือก 1 ดวง</h2>
    <div class="stickers">${opts.map(u=>`<button class="stk" type="button" data-u="${u.id}"><span class="disc" style="--c:${u.c}">${ICON[u.id]}</span><span class="n">${u.n}</span><span class="d">${u.d}</span></button>`).join('')}</div>
    ${(G.wave+1)%4===0?'<p class="lead" style="color:var(--red)">ต่อไป: บอส!</p>':''}`);
  panel.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.u;SFX.sticker();
    if(id==='repair')G.hp=Math.min(G.maxHp,G.hp+2);if(id==='shield')G.shield+=2;if(id==='eraser')G.erasers++;
    if(id==='slow')G.slow*=.88;if(id==='chain')G.chain=Math.min(.9,G.chain+.3);if(id==='mult')G.mult*=1.25;
    ov.hidden=true;nextWave();
  });
}
function gameOver(){
  if(!G)return;state='over';
  const nb=G.score>(BEST[G.tier]||0);if(nb){BEST[G.tier]=G.score;store.set('nm-best',BEST);}
  const tier=G.tier;
  show(`<h2 class="big red">ป้อมแตก!</h2>${nb?'<span class="newrec">สถิติใหม่!</span>':''}
    <div class="stats"><div><b>${G.score.toLocaleString('en-US')}</b>คะแนน</div><div><b>${G.wave}</b>หน้า</div><div><b>${G.learned.size}</b>คำถูก</div></div>
    ${G.missed.length?`<p class="lead">คำที่พลาด</p><div class="missed">${G.missed.map(w=>`<button class="mw" type="button" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.th)}</span></button>`).join('')}</div>`:''}
    <div class="row"><button class="btn" type="button" id="again">อีกรอบ</button><button class="btn plain" type="button" id="menu">เมนู</button></div>`);
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,true));
  $('#again').onclick=()=>start(tier);$('#menu').onclick=title;
}
function pause(){
  if(state!=='play')return;state='paused';
  show(`<h2 class="big">พัก</h2><div class="row"><button class="btn" type="button" id="resume">เล่นต่อ</button><button class="btn plain" type="button" id="quit">เมนู</button></div>`);
  $('#resume').onclick=()=>{ov.hidden=true;state='play';last=performance.now();};$('#quit').onclick=title;$('#resume').focus();
}
$('#pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(e.key==='Escape'){pause();return;}
  if(/^[1-4]$/.test(e.key)&&!typed){fire(+e.key-1);return;}
  if(e.key===' '&&!typed){e.preventDefault();useEraser();return;}
  if(e.key==='Backspace'){typed=typed.slice(0,-1);e.preventDefault();return;}
  if(e.key==='Enter'){typed='';return;}
  if(/^[a-zA-Z ]$/.test(e.key)){
    typed=(typed+e.key.toLowerCase()).slice(0,20);
    const on=live().map(cur),ex=on.find(w=>w.en===typed);
    if(ex){fire(ex);typed='';return;}
    if(!on.some(w=>w.en.startsWith(typed))&&!G.slots.some(s=>s&&s.en.startsWith(typed))){SFX.bad();typed='';}
  }
});

window.__nm=()=>G;
fit();title();requestAnimationFrame(frame);
})();
</script>
