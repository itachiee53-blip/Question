<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b2a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clay War</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="bg" class="layer"></canvas>
<canvas id="gl" class="layer"></canvas>
<canvas id="fx" class="layer"></canvas>

<!-- HUD ระหว่างเล่น -->
<div id="hud" hidden>
  <div class="top">
    <div class="pill">🪙 <b id="gold">0</b></div>
    <div class="pill">👥 <b id="pop">0</b></div>
    <canvas id="mini" width="300" height="24"></canvas>
    <button id="upgBtn" class="pill btn-i">🏰 อัปเกรด</button>
    <button id="muteBtn" class="pill btn-i">🔊</button>
    <button id="pauseBtn" class="pill btn-i">⏸</button>
  </div>
  <div id="upg" class="upg" hidden></div>
  <div class="bottom">
    <div id="shop" class="shop"></div>
    <div class="skills" id="skills"></div>
    <div class="modes">
      <button data-mode="defend" class="mode on">🛡️<span>ตั้งรับ</span></button>
      <button data-mode="attack" class="mode">⚔️<span>บุก!</span></button>
    </div>
  </div>
</div>

<div id="banner" class="banner"></div>

<!-- หน้าเริ่มเกม -->
<div id="start" class="screen">
  <h1 class="title">CLAY<span>WAR</span></h1>
  <p class="sub">สงครามทหารดินเหนียว</p>
  <div id="levels" class="levels"></div>
  <button id="playBtn" class="big">▶ เริ่มเกม</button>
  <p class="hint">⛏️ ฟาร์มแร่ · 🗡️ สร้างกองทัพ · 🏰 ทำลายฐานศัตรู</p>
  <p class="credit">โมเดล 3D: Quaternius (CC0)</p>
</div>

<!-- ขออนุญาตหมุนจอ -->
<div id="perm" class="screen dim" hidden>
  <div class="panel">
    <div class="ico rot">📱</div>
    <h2>เกมนี้เล่นแนวนอน</h2>
    <p>ขออนุญาตเปิดเต็มจอและหมุนหน้าจอเป็นแนวนอนนะครับ</p>
    <div class="row"><button id="permNo" class="ghost">ไม่เป็นไร</button><button id="permYes" class="big sm">อนุญาต</button></div>
  </div>
</div>

<!-- เตือนให้หมุนจอ (ถ้าเครื่องหมุนให้อัตโนมัติไม่ได้) -->
<div id="rotate" class="screen dim">
  <div class="ico rot">📱</div><h2>หมุนจอเป็นแนวนอน</h2><p>เพื่อเล่นต่อ</p>
</div>

<!-- หยุดชั่วคราว -->
<div id="pause" class="screen dim" hidden>
  <div class="panel"><h2>หยุดชั่วคราว</h2>
    <div class="col"><button id="resumeBtn" class="big sm">▶ เล่นต่อ</button><button id="quitBtn" class="ghost">ออกไปหน้าแรก</button></div>
  </div>
</div>

<!-- จบเกม -->
<div id="end" class="screen dim" hidden>
  <div class="panel"><div id="endIco" class="ico"></div><h2 id="endTitle"></h2><p id="endStars" class="stars"></p><p id="endText"></p>
    <div class="col"><button id="nextBtn" class="big sm"></button><button id="menuBtn" class="ghost">หน้าแรก</button></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/upgrades.js"></script>
<script src="js/scenery.js"></script>
<script src="js/render.js"></script>
<script src="js/units.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/render3d.js"></script>
</body>
</html>
