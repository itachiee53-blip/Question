<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Last Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;600;800&family=Special+Elite&display=swap">
<style>
:root{
  --bg:#0b0d0e;--panel:#14181ae8;--line:#ffffff1f;--text:#ece8de;--dim:#ece8de99;
  --ok:#8fd15a;--no:#d8402f;--amber:#f2b33d;--steel:#8fa3a0;--paper:#e9e1c9;--ink:#2a2620;
  --f-th:"Kanit",system-ui,sans-serif;--f-disp:"Bebas Neue","Kanit",sans-serif;--f-type:"Special Elite","Courier New",monospace;
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-th);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button[disabled]{cursor:not-allowed;opacity:.35}
input{font:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.vig{background:radial-gradient(ellipse at 50% 50%,transparent 50%,#000b 100%)}
.grain{opacity:.08;mix-blend-mode:overlay}
.red{background:radial-gradient(ellipse at 50% 50%,transparent 35%,#b0100cbb 100%);opacity:0;transition:opacity .4s}
.red.on{opacity:1;transition:none}
.splat{opacity:0;transition:opacity 2.5s}.splat.on{opacity:1;transition:none}
.black{background:#000;opacity:0;transition:opacity .8s;z-index:60}.black.on{opacity:1}
.beat{background:radial-gradient(ellipse at 50% 50%,transparent 45%,#80100c55 100%);animation:beat 1s infinite;opacity:0}
.beat.on{opacity:1}
@keyframes beat{0%,100%{opacity:.25}12%{opacity:1}24%{opacity:.4}36%{opacity:.9}}
.rotate{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#070909;text-align:center;padding:24px}
.rotate b{font-size:22px}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:flex}}

/* ---------- top bar ---------- */
.top{position:fixed;top:calc(8px + var(--safe-t));left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:14px;line-height:1.2}
.chip b{font-family:var(--f-disp);font-size:20px;letter-spacing:1px;margin-right:6px;font-weight:400}
.sp{flex:1}
.ib{height:38px;min-width:38px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.ib svg{width:18px;height:18px}
.timer{font-family:var(--f-disp);font-size:24px;letter-spacing:1px;color:#ff7a5a;padding:2px 12px}
.timer.low{animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.4}}
.trust{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.trust i{display:block;width:70px;height:6px;border-radius:3px;background:#fff2;overflow:hidden}
.trust i b{display:block;height:100%;background:var(--amber);transition:width .5s}

/* ---------- tools (left) ---------- */
.tools{position:fixed;left:calc(10px + var(--safe-l));top:58px;bottom:calc(10px + var(--safe-b));z-index:20;display:flex;flex-direction:column;gap:6px;justify-content:center}
.tools.two{display:grid;grid-template-columns:62px 62px;align-content:center}
.tool{width:62px;padding:7px 2px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;position:relative}
.tool svg{width:24px;height:24px}
.tool.on{border-color:var(--amber);background:#3a2e12e8}
.tool.new::after{content:"";position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--amber)}

/* ---------- dialogue ---------- */
.say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));z-index:22;width:min(560px,calc(100% - 420px));min-width:320px;background:#0d1012f0;border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px}
.say .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--amber);margin-bottom:2px}
.say .who .btns{margin-left:auto;display:flex;gap:6px}
.say .who button{font-size:12px;color:var(--text);background:#ffffff14;border-radius:8px;padding:3px 9px}
.say .who button.on{background:var(--amber);color:#1a1408}
.en{font-size:19px;line-height:1.45;color:#fff}
.en .w{border-radius:4px;padding:0 1px;cursor:pointer}
.en .w:active,.en .w.hit{background:#f2b33d44}
.th{font-size:15px;line-height:1.4;color:var(--dim);margin-top:4px}
.say.tap{cursor:pointer}
.say .more{position:absolute;right:12px;bottom:6px;font-size:11px;color:var(--dim);animation:pulse 1.4s infinite}
.say.cut{width:min(720px,calc(100% - 40px))}

/* word popover */
.pop{position:fixed;z-index:70;background:#1d2224;border:1px solid var(--amber);border-radius:10px;padding:8px 12px;min-width:120px;max-width:260px;box-shadow:0 8px 24px #000a;transform:translate(-50%,-100%)}
.pop b{font-size:18px;display:block}.pop span{font-size:15px;color:var(--amber)}
.pop button{margin-top:4px;font-size:12px;background:#ffffff14;border-radius:6px;padding:2px 8px}

/* ---------- questions + decision (right) ---------- */
.side{position:fixed;right:calc(10px + var(--safe-r));top:58px;bottom:calc(10px + var(--safe-b));z-index:20;width:200px;display:flex;flex-direction:column;gap:6px}
.qs{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1;min-height:0}
.q{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.25}
.q small{display:block;font-size:11px;color:var(--dim)}
.q.used{opacity:.45}
.dec{display:flex;flex-direction:column;gap:6px}
.dec button{border-radius:12px;padding:10px;font-size:17px;font-weight:600;border:1px solid}
.yes{background:#2d4a1ce8;border-color:var(--ok)!important;color:#dff5c8}
.no{background:#4a1a14e8;border-color:var(--no)!important;color:#ffd8d0}
.alt{background:#3a2e12e8;border-color:var(--amber)!important;color:#ffe9b8;font-size:15px!important}

/* ---------- panels (documents etc.) ---------- */
.panel{position:fixed;left:calc(84px + var(--safe-l) + var(--toolw,0px));top:58px;z-index:30;max-height:calc(100% - 70px);overflow:auto;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateY(12px);opacity:0}}
.x{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;background:#0006;color:#fff;font-size:16px;z-index:2}
.card{width:340px;border-radius:12px;background:var(--paper);color:var(--ink);padding:12px 14px;font-family:var(--f-type);position:relative;box-shadow:0 10px 30px #000c}
.card h4{margin:0 0 8px;font-size:13px;letter-spacing:1px;border-bottom:2px solid #2a262055;padding-bottom:5px;font-weight:400}
.card .row{display:flex;gap:12px}
.card .ph{width:96px;height:116px;border-radius:6px;background:#bcb59f center/cover;flex:none;border:2px solid #2a262033}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:14px;align-content:start}
.card dt{color:#6b6352;font-size:11px;padding-top:2px}
.card dd{margin:0;font-weight:700}
.card.permit{background:#cfe0ea}
.card.permit h4{color:#20405a}
.seal{position:absolute;right:14px;bottom:12px;width:62px;height:62px;border-radius:50%;border:3px solid #b8302acc;color:#b8302acc;display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;transform:rotate(-14deg);font-family:var(--f-disp);letter-spacing:1px;line-height:1.05}
.sheet{width:340px;border-radius:12px;background:#121618f2;border:1px solid var(--line);padding:12px 14px;position:relative}
.sheet h4{margin:0 0 8px;font-size:15px;color:var(--amber);font-weight:600}
.sheet canvas{display:block;width:100%;border-radius:8px;background:#0a0c0d}
.sheet .note{font-size:13px;color:var(--dim);margin-top:6px}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items span{background:#ffffff12;border-radius:8px;padding:5px 9px;font-size:15px}
.reading{font-family:var(--f-disp);font-size:54px;text-align:center;letter-spacing:2px;line-height:1}
.reading.hot{color:#ff6a4a}
.rules li{margin:4px 0;font-size:15px}.rules li small{display:block;color:var(--dim);font-size:12px}
.rules li.new{color:var(--amber)}

/* stamp */
.stamp{position:fixed;left:50%;top:42%;z-index:40;font-family:var(--f-disp);font-size:64px;letter-spacing:4px;padding:4px 22px;border:6px solid;border-radius:10px;transform:translate(-50%,-50%) rotate(-12deg);animation:stamp .35s ease-out;pointer-events:none}
.stamp.ok{color:#8fd15a;border-color:#8fd15a}.stamp.no{color:#ff5a46;border-color:#ff5a46}.stamp.q{color:var(--amber);border-color:var(--amber)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}}

/* ---------- cutscene ---------- */
.lb{position:fixed;left:0;right:0;height:9vh;background:#000;z-index:21;transition:transform .5s}
.lb.t{top:0;transform:translateY(-100%)}.lb.b{bottom:0;transform:translateY(100%)}
body.cut .lb{transform:none}
.card-title{position:fixed;inset:0;z-index:61;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;text-align:center}
.card-title b{font-family:var(--f-disp);font-size:72px;letter-spacing:6px;font-weight:400;animation:fadein 1.2s}
.card-title span{font-size:20px;color:var(--dim);animation:fadein 2s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.skip{position:fixed;right:calc(14px + var(--safe-r));top:calc(12px + 9vh);z-index:25;font-size:13px;color:var(--dim);background:#0008;border-radius:8px;padding:4px 10px}

/* ---------- full screens ---------- */
.scr{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px calc(16px + var(--safe-r)) 16px calc(16px + var(--safe-l));background:radial-gradient(ellipse at 50% 40%,#11161acc,#050607f5)}
.box{width:min(620px,100%);max-height:100%;overflow:auto;background:#101416f0;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.box h2{margin:0 0 4px;font-size:24px}.box h3{margin:14px 0 6px;font-size:16px;color:var(--amber);font-weight:600}
.box p{margin:6px 0;color:var(--dim);font-size:15px}
.big{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--amber);color:#1a1408;font-size:18px;font-weight:600}
.big.sec{background:#ffffff14;color:var(--text)}
.title{text-align:center}
.title h1{margin:0;font-family:var(--f-disp);font-size:min(84px,13vh,11vw);letter-spacing:.1em;line-height:.9;font-weight:400}
.title h1 small{display:block;font-size:22px;letter-spacing:4px;color:var(--dim)}
.title .menu{width:280px;margin:18px auto 0}
.scr:has(.title){overflow:auto}
@media (max-height:520px) and (orientation:landscape){
  .title{display:flex;align-items:center;gap:6vw;text-align:left}
  .title h1{font-size:min(76px,19vh)}.title h1 small{font-size:min(20px,5vh);margin-top:6px}
  .title .menu{margin:0;width:min(300px,42vw)}.title .menu .big{margin-top:8px;padding:min(11px,2.6vh);font-size:min(17px,4.4vh)}
}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;color:var(--dim);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0a0c0d;color:#fff;font-size:18px}
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sum td:first-child{width:22px}
.sum .r{color:var(--dim);font-size:13px}
.okc{color:var(--ok)}.noc{color:var(--no)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{padding:10px 12px;border-radius:10px;background:#ffffff10;border:1px solid var(--line);text-align:left;font-size:16px}
.opt.right{background:#2d4a1c;border-color:var(--ok)}.opt.wrong{background:#4a1a14;border-color:var(--no)}
.vrow{display:flex;gap:6px}.vrow select{flex:1;min-width:0;padding:7px 8px;border-radius:8px;background:#0a0c0d;color:var(--text);border:1px solid var(--line);font:inherit;font-size:14px}
.vrow .vt{padding:6px 14px;border-radius:8px;background:#ffffff12;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:6px 12px;border-radius:8px;background:#ffffff12;font-size:14px}.seg button.on{background:var(--amber);color:#1a1408}
.book{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:15px}
.book div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.book small{color:var(--dim)}
.load{flex-direction:column;gap:14px}
.pb{width:240px;height:6px;border-radius:3px;background:#fff2;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}

/* ---------- QTE ---------- */
.qte{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);z-index:35;width:min(520px,90%);text-align:center}
.qte .track{position:relative;height:16px;border-radius:8px;background:#000a;border:1px solid var(--line);margin-bottom:10px}
.qte .track i{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%)}
.qte .track .gate{position:absolute;top:-6px;bottom:-6px;width:4px;background:#fff;left:88%}
.qte button{width:100%;padding:16px;border-radius:14px;background:#b8201a;color:#fff;font-size:24px;font-weight:800;letter-spacing:1px;border:2px solid #ff8a7a;animation:pulse .5s infinite}
.toast{position:fixed;left:50%;top:calc(56px + var(--safe-t));transform:translateX(-50%);z-index:45;padding:8px 18px;border-radius:999px;background:#000d;border:1px solid var(--line);font-size:15px;animation:fadein .2s;pointer-events:none}
@media (max-height:420px){
  .en{font-size:17px}.th{font-size:14px}.say{padding:8px 12px}
  .tool{width:56px;padding:5px 2px;font-size:11px}.tool svg{width:21px;height:21px}
  .side{width:180px}.q{font-size:13px;padding:5px 8px}.dec button{padding:8px;font-size:16px}
  .card,.sheet{width:300px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="fx vig"></div>
<canvas class="fx grain" id="grain" width="160" height="160"></canvas>
<div class="fx beat" id="beat"></div>
<div class="fx red" id="red"></div>
<canvas class="fx splat" id="splat"></canvas>
<div class="rotate"><b>หมุนจอเป็นแนวนอน</b></div>
<i class="lb t"></i><i class="lb b"></i>

<div class="top" id="top" hidden>
  <div class="chip"><b id="tDay">DAY 1</b><span id="tDate"></span></div>
  <div class="trust" id="tTrust"><span>จ่า</span><i><b id="trustBar"></b></i></div>
  <div class="timer" id="timer" hidden></div>
  <div class="sp"></div>
  <button class="ib" id="rulesBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>กฎ</button>
  <button class="ib" id="bookBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>สมุด</button>
  <button class="ib" id="menuBtn" type="button" aria-label="เมนู"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
</div>
<div class="tools" id="tools" hidden></div>
<div class="side" id="side" hidden><div class="qs" id="qs"></div><div class="dec" id="dec"></div></div>
<div class="say" id="say" hidden><div class="who"><span id="sayWho"></span><span class="btns"><button type="button" id="sayAgain">ฟังอีก</button><button type="button" id="saySlow">ช้า</button><button type="button" id="sayTh">แปล</button></span></div><div class="en" id="sayEn"></div><div class="th" id="sayTh2" hidden></div><span class="more" id="sayMore" hidden>แตะเพื่อไปต่อ ›</span></div>
<div id="panel"></div>
<div id="layer"></div>
<div class="fx black" id="black"></div>
<div class="scr load" id="loading"><div class="title"><h1>LAST<br>CHECKPOINT<small>ด่านสุดท้าย</small></h1></div><div class="pb"><i id="loadBar"></i></div><small id="loadTxt">กำลังโหลด…</small></div>
<div class="scr" id="screen" hidden></div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const WORDS=/*WORDS*/{};
const VERSION='3.0.0';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- save ---------------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const SAVE_KEY='lc-save-v1';
const DEF_OPTS={voice:true,rate:.9,th:false,sfx:80,amb:70,vm:'',vf:'',meF:false};
let P=store.get(SAVE_KEY,null);
function freshSave(){
  // words learned in the old zombie game carry over into the notebook
  const old=store.get('dw-save-v1',null);
  return {v:1,name:'',sis:'',day:1,started:false,F:{},hist:[],book:{},known:old&&old.learned?old.learned.slice(0,3000):[],opts:Object.assign({},DEF_OPTS,P&&P.opts),endings:P?P.endings||[]:[]};
}
if(!P)P=freshSave();
P.opts=Object.assign({},DEF_OPTS,P.opts);
const save=()=>store.set(SAVE_KEY,P);

/* ---------------- dictionary: story glossary first, then the word lists ---------------- */
const DICT=new Map();
for(const lv in WORDS)for(const [,ws] of WORDS[lv])for(const [en,th] of ws){const k=en.toLowerCase();if(!DICT.has(k))DICT.set(k,th);}
function lookup(w){
  let k=w.toLowerCase().replace(/[’]/g,"'").replace(/^[^a-z']+|[^a-z']+$/g,'');if(!k)return null;
  const G=STORY.gloss;
  const tryK=x=>G[x]||DICT.get(x);
  let r=tryK(k);if(r)return {w:k,th:r};
  const base=k.replace(/'s$/,'').replace(/n't$/,'');
  for(const c of [base,base.replace(/ies$/,'y'),base.replace(/es$/,''),base.replace(/s$/,''),base.replace(/ed$/,''),base.replace(/ed$/,'e'),base.replace(/d$/,''),base.replace(/ing$/,''),base.replace(/ing$/,'e'),base.replace(/([a-z])\1ing$/,'$1'),base.replace(/([a-z])\1ed$/,'$1'),base.replace(/ly$/,''),base.replace(/er$/,''),base.replace(/est$/,'')]){
    if(c&&c.length>1&&(r=tryK(c)))return {w:c,th:r};}
  return null;
}
function addBook(w,th){if(!w)return;const e=P.book[w]||(P.book[w]={th,n:0,day:P.day});e.n++;e.th=th;save();}

/* ---------------- audio ---------------- */
let ac=null,master=null,sfxBus=null,ambBus=null,noiseBuf=null,amb=null;
function audio(){

let VOICES=[];
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|organ|princess|ralph|superstar|trinoids|whisper|wobble|zarvox|kathy|\bfred\b|grandma|grandpa|eddy|\bflo\b|\breed\b|rocko|sandy|shelley/i;
const FEM=/female|woman|samantha|victoria|karen|moira|tessa|fiona|zira|susan|hazel|serena|allison|\bava\b|\bkate\b|joanna|salli|kimberly|\bivy\b|emma|\bamy\b|libby|sonia|jenny|\baria\b|michelle|catherine|natasha|clara|nicky|\bzoe\b|evie|google us english|google uk english female|x-(iob|iog|sfg|tpc|tpf|gba|gbc|gbg|afa|afc|ena|enc)/i;

const vKey=v=>v.name+' '+(v.voiceURI||'');
const vGender=v=>FEM.test(vKey(v))?'f':MAL.test(vKey(v))?'m':'';
const vScore=v=>(/natural|neural|enhanced|premium/i.test(vKey(v))?4:0)+(/google|online/i.test(vKey(v))?2:0)+(/en[-_](us|gb)/i.test(v.lang)?1:0)-(NOVELTY.test(v.name)?9:0);

  const want=g==='f'?P.opts.vf:P.opts.vm;const picked=want&&VOICES.find(v=>v.voiceURI===want||v.name===want);if(picked)return {v:picked,fake:false};
  const same=VOICES.filter(v=>vGender(v)===g);if(same.length)return {v:same[0],fake:false};

// a scene is a list of steps: {who,en,th} lines, {cam}, {wait}, {fade}, {title}, {run:fn}, {if:fn,then:[],else:[]}
let CUT=null;
async function runCut(steps){
  document.body.classList.add('cut');hideHud();CUT={skip:false};const skipB=document.createElement('button');skipB.className='skip';skipB.textContent='ข้าม ›';skipB.onclick=()=>{CUT.skip=true;if(sayWait){const r=sayWait;sayWait=null;r();}};document.body.appendChild(skipB);
  try{await runSteps(steps);}finally{skipB.remove();document.body.classList.remove('cut');hideSay();CUT=null;$('.card-title')?.remove();}
}
async function runSteps(steps){
  for(const s0 of steps){const s=typeof s0==='function'?s0():s0;if(!s)continue;
    if(Array.isArray(s)){await runSteps(s);continue;}
    if(s.if!==undefined){const ok=typeof s.if==='function'?s.if(P.F):s.if;await runSteps(ok?(s.then||[]):(s.else||[]));continue;}
    const skip=CUT&&CUT.skip;
    if(s.cam){const p=camTo(s.cam,skip?0:(s.t??1.4));if(!s.nowait)await p;}
    if(s.run){const r=s.run();if(r&&r.then&&!s.nowait)await r;}
    if(s.sfx)SFX[s.sfx]&&SFX[s.sfx]();
    if(s.fade!==undefined)await fade(s.fade==='out');
    if(s.title){const d=document.createElement('div');d.className='card-title';d.innerHTML=`<b>${esc(sub(s.title))}</b><span>${esc(sub(s.sub||''))}</span>`;document.body.appendChild(d);if(!skip)await sleep(s.t?s.t*1000:2600);d.remove();}
    if(s.en||s.th){if(skip&&!s.must){continue;}await say(s,{wait:true,cut:true});}
    if(s.wait&&!skip)await sleep(s.wait*1000);

const QUEUE_SLOTS=[[-.3,-5.0],[-.6,-6.4],[-.2,-7.8],[-.7,-9.2],[-.3,-10.6],[-.8,-12.0]];
const COUNTER=[.9,-2.35];
async function startDay(n){
  P.day=n;P.started=true;save();const d=STORY.days[n-1];

function spawnQ(i){const id=D.queue[i];if(!id||D.queue['a'+i])return;const def=getDef(id);if(!def)return;const a=makeActor(def.look);if(!a)return;

async function decide(k){
  if(D.busy)return;D.busy=true;closePanel();const p=D.cur,def=p.def;
  stamp(k==='yes'?'ok':k==='quar'?'q':'no',k==='yes'?'ผ่าน':k==='quar'?'กักตัว':'ไม่ผ่าน');
  if(k==='quar')D.qLeft--;
  const right=def.right||'yes';const ok=right===k||(Array.isArray(right)&&right.includes(k));
  const r={id:p.id,name:def.name,k,ok,why:def.why||'',inf:!!def.inf};D.res.push(r);
  const goesIn=k==='yes'||(def.inKeys||[]).includes(k);
  P.F.trust=(P.F.trust||0)+(ok?1:def.inf&&goesIn?-2:-1);
  if(def.inf&&goesIn)P.F.infIn=(P.F.infIn||0)+1;
  if(!def.inf&&right==='yes'&&k==='no')P.F.innDenied=(P.F.innDenied||0)+1;
  P.F['d_'+p.id]=k;topBar();save();
  $('#qs').innerHTML='';$('#dec').innerHTML='';
  const react=def.after&&def.after[k];
  if(react)await react(P.F,D);
  else{const l=def.bye&&def.bye[k];if(l)await say(l);await sleep(700);}
  hideSay();
  if(!p.gone){const a=p.actor;
    if(goesIn)await walk(a,[[-.4,-1.4],[-2.0,-.6],[-2.2,4]],{});
    else if(k==='quar')await walk(a,[[-.4,-1.4],[-2.2,-.6],[-4.2,1.0]],{});
    else await walk(a,[[2.2,-2.4],[2.4,-14]],{});

  if(def.leave)def.leave(D);
  D.cur=null;D.busy=false;await nextPerson();
}

/* ---------------- menus ---------------- */
function title(){
  hideHud();hideSay();clearDay();D=null;ambience('wind');setWeather('wind');setTod(.82);camTo('outside',0);
  const s=$('#screen');const cont=P.started&&!P.done;
  s.innerHTML=`<div class="title"><h1>LAST<br>CHECKPOINT<small>ด่านสุดท้าย</small></h1><div class="menu">
    ${cont?`<button class="big" type="button" id="mCont">เล่นต่อ · วันที่ ${P.day}</button>`:''}
    <button class="big ${cont?'sec':''}" type="button" id="mNew">เริ่มใหม่</button>
    <button class="big sec" type="button" id="mBook">สมุดคำศัพท์</button>
    <button class="big sec" type="button" id="mOpt">ตั้งค่า</button>
    <button class="big sec" type="button" id="mGames">เลือกเกม</button></div></div>`;
  s.hidden=false;
  if(cont)$('#mCont').onclick=async()=>{SFX.ui();s.hidden=true;await fade(true);await startDay(P.day);await fade(false);};
  $('#mNew').onclick=()=>{SFX.ui();if(cont&&!confirm('เริ่มใหม่? ความคืบหน้าจะหาย'))return;nameScreen();};
  $('#mBook').onclick=()=>{SFX.ui();bookScreen(title);};$('#mOpt').onclick=()=>{SFX.ui();optScreen(title);};
  $('#mGames').onclick=()=>{location.href='./';};
}
function nameScreen(){
  const s=$('#screen');s.innerHTML=`<div class="box"><h2>ก่อนเริ่ม</h2>
    <label class="field"><span>ชื่อของคุณ</span><input id="nP" maxlength="14" autocomplete="off" placeholder="นนท์"></label>
    <label class="field"><span>ชื่อน้องสาว</span><input id="nS" maxlength="14" autocomplete="off" placeholder="แพร"></label>
    <button class="big" type="button" id="nGo">เริ่มเกม</button></div>`;s.hidden=false;
  const clean=v=>v.replace(/[^A-Za-z\u0E00-\u0E7F \-']/g,'').replace(/\s+/g,' ').trim().replace(/(^|\s)([a-z])/g,(m,a,c)=>a+c.toUpperCase()).slice(0,14);
  $('#nGo').onclick=async()=>{const a=clean($('#nP').value),b=clean($('#nS').value);if(!a||!b){toast('พิมพ์ชื่อก่อน');return;}
    const keep={opts:P.opts,endings:P.endings};P=freshSave();Object.assign(P,keep);P.name=a;P.sis=b;P.F={trust:0};save();SFX.ui();s.hidden=true;
    await fade(true);await startDay(1);await fade(false);};
}
function bookScreen(back){
  const s=$('#screen');const e=Object.entries(P.book).sort((a,b)=>b[1].day-a[1].day||a[0].localeCompare(b[0]));
  s.innerHTML=`<div class="box"><h2>สมุดคำศัพท์</h2><p>${e.length} คำจากด่าน${P.known.length?` · ${P.known.length} คำจากเกมเก่า`:''}</p>
    ${e.length?`<div class="book">${e.map(([w,v])=>`<div><span>${esc(w)}</span><small>${esc(v.th)}</small></div>`).join('')}</div>`:'<p>แตะคำในบทพูดเพื่อเก็บคำ</p>'}
    <button class="big" type="button" id="bkGo">กลับ</button></div>`;s.hidden=false;$('#bkGo').onclick=()=>{SFX.ui();s.hidden=true;back();};
}
function optScreen(back){
  loadVoices();
  const vsel=(k,g)=>{const cur=voiceFor(g).v;return `<select data-v="${k}">${VOICES.map(v=>`<option value="${esc(v.voiceURI||v.name)}" ${cur===v?'selected':''}>${esc(v.name.replace(/^(Microsoft|Google|Apple)\s+/,''))}${vGender(v)?` · ${vGender(v)==='f'?'หญิง':'ชาย'}`:''}</option>`).join('')}</select>`;};
  const s=$('#screen');const seg=(k,opts)=>`<div class="seg">${opts.map(([v,n])=>`<button type="button" data-k="${k}" data-v="${v}" class="${P.opts[k]==v?'on':''}">${n}</button>`).join('')}</div>`;
  s.innerHTML=`<div class="box"><h2>ตั้งค่า</h2>
    <h3>เสียงพูด</h3>${seg('voice',[[true,'เปิด'],[false,'ปิด']])}
    <h3>ความเร็วเสียง</h3>${seg('rate',[[.7,'ช้า'],[.9,'ปกติ'],[1.05,'เร็ว']])}
    ${VOICES.length?`<h3>เสียงผู้ชาย</h3><div class="vrow">${vsel('vm','m')}<button type="button" class="vt" data-g="m">ฟัง</button></div>
    <h3>เสียงผู้หญิง</h3><div class="vrow">${vsel('vf','f')}<button type="button" class="vt" data-g="f">ฟัง</button></div>`:''}
    <h3>เสียงตัวเรา</h3>${seg('meF',[[false,'ผู้ชาย'],[true,'ผู้หญิง']])}
    <h3>คำแปลไทย</h3>${seg('th',[[false,'แตะเพื่อดู'],[true,'แสดงเสมอ']])}
    <h3>เสียงเอฟเฟกต์</h3>${seg('sfx',[[0,'ปิด'],[50,'เบา'],[80,'ปกติ']])}
    <h3>เสียงบรรยากาศ</h3>${seg('amb',[[0,'ปิด'],[40,'เบา'],[70,'ปกติ']])}
    <button class="big" type="button" id="opGo">กลับ</button></div>`;
  s.hidden=false;
  s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;P.opts[k]=v==='true'?true:v==='false'?false:+v;save();applyVol();SFX.ui();optScreen(back);});
  s.querySelectorAll('select[data-v]').forEach(el=>el.onchange=()=>{P.opts[el.dataset.v]=el.value;save();speak(el.dataset.v==='vf'?"Hi. I'm Min. I run the radio.":"Check the card. Then check the face.",el.dataset.v==='vf'?'min':'carter');});
  s.querySelectorAll('.vt').forEach(b=>b.onclick=()=>speak(b.dataset.g==='f'?"Hi. I'm Min. I run the radio.":"Check the card. Then check the face.",b.dataset.g==='f'?'min':'carter'));
  $('#opGo').onclick=()=>{SFX.ui();s.hidden=true;back();};
}
$('#rulesBtn').onclick=()=>{SFX.paper();const d=STORY.days[P.day-1];const el=$('#panel');const on=el.querySelector('.rules');closePanel();if(on)return;
  el.innerHTML=`<div class="panel"><div class="sheet rules"><button class="x" type="button">✕</button><h4>กฎวันนี้</h4><ol>${d.rules.map(r=>`<li class="${r.new?'new':''}">${wordsHtml(r.en)}<small>${esc(r.th)}</small></li>`).join('')}</ol>
    <p class="note">${wordsHtml(sub(STORY.dateOf(P.day)))}</p></div></div>`;bindWords(el);el.querySelector('.x').onclick=closePanel;};
$('#bookBtn').onclick=()=>{SFX.ui();const back=()=>{};bookScreen(back);};
$('#menuBtn').onclick=()=>{SFX.ui();const s=$('#screen');s.innerHTML=`<div class="box"><h2>หยุดพัก</h2><button class="big" type="button" id="pGo">เล่นต่อ</button><button class="big sec" type="button" id="pOpt">ตั้งค่า</button><button class="big sec" type="button" id="pQuit">กลับเมนู</button></div>`;s.hidden=false;
  $('#pGo').onclick=()=>{s.hidden=true;};$('#pOpt').onclick=()=>optScreen(()=>{s.hidden=true;});$('#pQuit').onclick=()=>{s.hidden=true;title();};};

/* ---------------- QTE: a button you must hit in time ---------------- */
function qte({label,dur,marks,onTick,gateAt=88}){return new Promise(res=>{
  const el=document.createElement('div');el.className='qte';el.innerHTML=`<div class="track"><span class="gate" style="left:${gateAt}%"></span>${marks.map(m=>`<i style="background:${m.c}"></i>`).join('')}</div><button type="button">${esc(label)}</button>`;
  document.body.appendChild(el);const dots=el.querySelectorAll('.track i');const t0=clock;let done=false;
  const fin=t=>{if(done)return;done=true;el.remove();res(t);};
  el.querySelector('button').onpointerdown=e=>{e.preventDefault();fin(clock-t0);};
  const tick=()=>{if(done)return;const t=clock-t0;marks.forEach((m,i)=>{dots[i].style.left=clamp(m.at(t),0,100)+'%';});onTick&&onTick(t);if(t>=dur){fin(null);return;}requestAnimationFrame(tick);};tick();});}

/* ---------------- day timer ---------------- */
function stepTimer(dt){if(!D||!D.timer||state!=='play')return;if(!D.busy||D.cur){D.timer-=dt;}
  const t=Math.max(0,D.timer),m=Math.floor(t/60),s=Math.floor(t%60);const el=$('#timer');el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',t<30);
  if(t<=0&&!D.ended){D.ended=true;D.timer=0;STORY.days[P.day-1].onTimeUp?.(P.F,D);if(!D.busy){D.busy=true;const c=D.cur;if(c){walk(c.actor,[[.4,-6]]);D.cur=null;}endDay();}}}

/* ---------------- main loop ---------------- */
let clock=0,last=performance.now(),state='play';
const grain=$('#grain').getContext('2d');let grainT=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  for(const a of ACTORS)stepActor(a,dt);stepFx(dt);stepCam(dt);stepTimer(dt);
  for(const s of FLOODSPR)s.visible=flood.intensity>2;
  grainT+=dt;if(grainT>.08){grainT=0;const im=grain.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}grain.putImageData(im,0,0);}
  renderer.render(scene,camera);
}
// game-wide helpers the story uses
const G={say,sleep,walk,play,camTo,makeActor,removeActor,bloodBurst,bloodPool,splatter,flashRed,muzzle,chestOf,SFX,setTod,setWeather,toast,qte,fade,
  get D(){return D;},STAFF,cam,gate:()=>gate,P:()=>P,removeBandage,ambience,heart(on){$('#beat').classList.toggle('on',on);},
  shoot(from,target,{kill=true}={}){const f=from.clone?from:new THREE.Vector3(...from);muzzle(f);SFX.shot();if(target){const c=chestOf(target);bloodBurst(c,10);SFX.flesh();if(kill)die(target);}},
  die,gateTo(open,dur=1){return new Promise(r=>{const g=gate,a0=g.rotation.z,a1=open?1.35:0;let t=0;const iv=setInterval(()=>{t+=.016/dur;g.rotation.z=a0+(a1-a0)*Math.min(1,t);if(t>=1){clearInterval(iv);r();}},16);});},
  V:(x,y,z)=>new THREE.Vector3(x,y,z),rnd,pick,
};
function die(a,{pool=true}={}){if(!a||a.dead)return;a.dead=true;a.path=null;play(a,'Death',{once:true,fade:.1});SFX.groan(.12);if(pool)setTimeout(()=>bloodPool(a.obj.position.x,a.obj.position.z,rnd(1,1.6)),500);}

/* ---------------- boot ---------------- */
(async()=>{
  try{await loadAll();}catch(e){}
  buildWorld();setTod(.82);
  $('#loading').hidden=true;requestAnimationFrame(frame);
  window.__lc={get D(){return D;},get P(){return P;},STORY,startDay,decide,ask,openTool,title,camTo,CAMS,setTod,ACTORS,camera,scene,get state(){return state;},runCut,G,ending,lookup};
  title();
})();
</script>
