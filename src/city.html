<style>
:root{--bg:#0d1b26;--panel:#0b1520e0;--line:#ffffff24;--text:#f6f1e7;--dim:#f6f1e799;--sun:#ff8a3d;--pink:#ff4f8b;--teal:#3fd0c9;--gold:#ffcc4d;--green:#8ff0a4;
  --f-th:"Kanit",system-ui,sans-serif;--f-disp:"Bebas Neue","Kanit",sans-serif;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-th);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
button,a.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;text-decoration:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:10}
.btn{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:16px;text-align:center}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,var(--sun),var(--pink));border-color:transparent;color:#1d0c12;font-weight:600}
#top{top:calc(10px + var(--st));left:calc(10px + var(--sl));display:flex;gap:10px;align-items:center}
#pauseB{width:42px;height:42px;padding:0;font-size:18px;font-weight:800;border-radius:50%}
#money{font-family:var(--f-disp);font-size:28px;letter-spacing:1px;color:var(--green);text-shadow:0 2px 6px #000}
#stars{font-size:22px;color:var(--gold);text-shadow:0 0 8px #000;letter-spacing:2px}
#stars i{font-style:normal;opacity:.22}#stars i.on{opacity:1}
#stars.flash{animation:fl .5s steps(2) infinite}@keyframes fl{50%{color:#ff5d5d}}
#mini{top:calc(10px + var(--st));right:calc(10px + var(--sr));width:116px;height:116px;border-radius:50%;border:2px solid #ffffff55;box-shadow:0 6px 20px #0009;cursor:pointer}
#camB{top:calc(62px + var(--st));left:calc(10px + var(--sl));padding:5px 12px;font-size:14px;border-radius:999px}
#obj{top:calc(10px + var(--st));left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 330px));text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 14px 8px}
#objEn{font-size:22px;font-weight:600;line-height:1.25}
#objTh{font-size:15px;color:var(--gold);margin-top:1px}
#objBtns{display:flex;gap:6px;justify-content:center;margin-top:5px}
#objBtns .btn{padding:2px 12px;font-size:13px;border-radius:999px}
#objBtns .btn.used{opacity:.45}
.w{cursor:pointer;border-radius:4px}.w:hover,.w.on{background:#ffffff2a}
#sub{top:calc(118px + var(--st));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100vw - 330px));background:#0b1520cc;border:1px solid var(--line);border-radius:14px;padding:6px 14px;text-align:center}
#sub b{font-size:13px}#subEn{font-size:19px}#subTh{font-size:14px;color:var(--gold)}
#subOpts{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap}#subOpts .btn{padding:3px 10px;font-size:15px}
#talk{left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);width:min(700px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 16px 12px;z-index:20}
#tWho{font-size:14px;font-weight:600;letter-spacing:.5px}
#tEn{font-size:25px;line-height:1.3;margin:1px 0}
#tTh{font-size:16px;color:var(--gold)}
#tOpts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#tOpts .btn{text-align:left;font-size:19px;padding:7px 14px}
#tOpts small{display:block;color:var(--gold);font-size:14px}
#tBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#tBtns .btn{padding:6px 16px}
#offer{top:50%;left:50%;transform:translate(-50%,-50%);width:min(320px,calc(100vw - 32px));background:#f6f3ec;color:#1b1f26;border-radius:22px;padding:12px 16px 14px;box-shadow:0 20px 50px #000a;z-index:15}
#offer .app{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#0e9f6e;font-size:15px}
#offer .app span{color:#1b1f26;font-weight:600;font-family:var(--f-disp);font-size:26px;letter-spacing:1px}
#offer .k{font-size:20px;font-weight:600;margin:2px 0 6px}
#offer .r{font-size:17px;line-height:1.5}#offer .r .w:hover{background:#0001}
#offer .r em{font-style:normal;color:#6b7280;font-size:14px;display:inline-block;width:86px}
#offer .row2{margin-top:10px}#offer .btn{flex:1;background:#e5e7eb;color:#1b1f26;border:0}#offer .btn.p{background:#0e9f6e;color:#fff}
#pop{position:fixed;z-index:40;background:#0b1520f5;border:1px solid #ffffff44;border-radius:14px;padding:8px 12px;min-width:150px;max-width:260px;box-shadow:0 10px 30px #000a;color:var(--text)}
#pop b{display:block;font-size:20px}#pop span{display:block;color:var(--gold);font-size:16px;margin:1px 0 6px}
#pop .row{display:flex;gap:6px}#pop .btn{padding:3px 12px;font-size:14px}
#toast{left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:44px;letter-spacing:2px;color:#fff;text-shadow:0 3px 0 #0008,0 0 18px #ff4f8b;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#toast small{display:block;text-align:center;font-family:var(--f-th);font-size:17px;letter-spacing:0;color:var(--gold);text-shadow:0 2px 4px #000}
/* on foot */
#stick{left:calc(26px + var(--sl));bottom:calc(26px + var(--sb));width:130px;height:130px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff30;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ffffff40;border:2px solid #ffffff70}
#actB{right:calc(22px + var(--sr));bottom:calc(24px + var(--sb));width:84px;height:84px;border-radius:50%;padding:0;font-size:17px;font-weight:600;background:linear-gradient(135deg,var(--teal),#2b8fd6);color:#04161c;border:0}
#actB.car{bottom:calc(196px + var(--sb));width:64px;height:64px;font-size:14px}
/* driving */
#wheel{left:calc(16px + var(--sl));bottom:calc(14px + var(--sb));width:170px;height:170px;touch-action:none;cursor:grab}
#wheel svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px #000a)}
#gears{left:calc(196px + var(--sl));bottom:calc(16px + var(--sb));display:grid;gap:5px;background:#0b1520c0;border:1px solid var(--line);border-radius:14px;padding:6px}
#gears.man{grid-template-columns:repeat(3,40px)}#gears.aut{grid-template-columns:40px}
#gears button{height:36px;border-radius:9px;background:#ffffff14;font-family:var(--f-disp);font-size:22px;line-height:36px}
#gears button.on{background:var(--gold);color:#1d1408}
#gears .gap{height:10px;grid-column:1/-1;border-top:2px solid #ffffff22;margin-top:4px}
#pedals{right:calc(18px + var(--sr));bottom:calc(14px + var(--sb));display:flex;gap:12px;align-items:flex-end}
.ped{width:74px;border-radius:12px;background:linear-gradient(180deg,#3a4049,#22262d);border:2px solid #ffffff30;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:15px;font-weight:600;
  background-image:repeating-linear-gradient(0deg,#ffffff10 0 6px,transparent 6px 14px),linear-gradient(180deg,#3a4049,#22262d)}
#brk{height:110px}#gas{width:62px;height:150px}
.ped.on{border-color:var(--gold);transform:scale(.96) translateY(3px)}
#hbB{right:calc(170px + var(--sr));bottom:calc(14px + var(--sb));padding:6px 10px;font-size:13px;border-radius:10px}
#hbB.on{background:#ff5d5d;color:#fff}
#dash{left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);background:#0b1520d0;border:1px solid var(--line);border-radius:16px;padding:4px 14px 8px;text-align:center;min-width:170px}
#spd{font-family:var(--f-disp);font-size:40px;line-height:1}#spd small{font-size:16px;color:var(--dim);margin-left:4px}
#gearTxt{font-family:var(--f-disp);font-size:30px;color:var(--gold);margin-left:10px}
#rpm{height:8px;border-radius:4px;background:#ffffff1a;overflow:hidden;margin-top:3px}#rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fd0c9,#ffcc4d 70%,#ff4f4f)}
#startB{margin-top:6px;padding:4px 14px;font-size:14px}
.scr{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(14px + var(--st)) calc(16px + var(--sr)) calc(14px + var(--sb)) calc(16px + var(--sl));background:#060b12aa}
.scr.solid{background:#070d15ee}
.logo{font-family:var(--f-disp);font-size:clamp(64px,13vw,120px);line-height:.85;letter-spacing:6px;background:linear-gradient(180deg,#ffd27f,#ff8a3d 45%,#ff4f8b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #ff4f8b66)}
.mbtns{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:10px;width:min(520px,100%)}
.mbtns .btn{padding:12px 10px;font-size:18px}
h2{margin:0;font-weight:600;font-size:24px}
.sub{color:var(--dim);font-size:15px;margin-top:-6px}
.list{width:min(760px,100%);max-height:calc(100dvh - 120px);overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;touch-action:pan-y;padding:2px}
.ch{grid-column:1/-1;font-size:15px;color:var(--gold);margin-top:6px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left}
.mc b{display:block;font-size:17px}.mc span{display:block;font-size:13px;color:var(--dim)}.mc em{font-style:normal;color:var(--gold);font-size:14px}
.mc[disabled]{opacity:.35}
.big{font-family:var(--f-disp);font-size:clamp(48px,9vw,78px);letter-spacing:3px;line-height:1;color:#fff;text-shadow:0 0 24px #ff4f8b}
.big.bad{text-shadow:0 0 24px #ff3b3b}
.rstars{font-size:38px;color:var(--gold);letter-spacing:6px}.rstars i{font-style:normal;opacity:.2}.rstars i.on{opacity:1}
.cash{font-family:var(--f-disp);font-size:34px;color:var(--green)}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
.chip span{color:var(--gold);margin-left:6px}
.row2{display:flex;gap:10px}
.notes{width:min(620px,100%);max-height:calc(100dvh - 140px);overflow:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.note{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.note b{font-size:18px}.note span{flex:1;color:var(--gold)}
.note button{font-size:18px;padding:2px 8px}
.set{display:flex;flex-direction:column;gap:10px;width:min(440px,100%)}
.set .r{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.seg{display:flex;gap:4px}.seg button{padding:4px 12px;border-radius:999px;border:1px solid var(--line)}.seg button.on{background:var(--sun);color:#1d0c12;border-color:transparent}
#mapC{border-radius:16px;box-shadow:0 10px 40px #000c;max-width:100%}
#load{font-size:16px;color:var(--dim)}
.rotate{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#070d15;text-align:center;padding:24px}
.rotate b{font-size:22px}.rotate div{font-size:60px;animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:flex}}
@media (max-height:430px){#objEn{font-size:19px}#tEn{font-size:21px}#mini{width:92px;height:92px}#sub{top:calc(96px + var(--st))}
  #wheel{width:140px;height:140px}#gears{left:calc(164px + var(--sl))}#gears.man{grid-template-columns:repeat(3,34px)}#gears.aut{grid-template-columns:34px}#gears button{height:30px;line-height:30px;font-size:19px}
  #brk{height:90px}#gas{height:124px}.ped{width:62px}#gas{width:54px}#actB.car{bottom:calc(150px + var(--sb))}#hbB{right:calc(148px + var(--sr))}
  #spd{font-size:32px}#dash{min-width:140px}.logo{font-size:64px}.mbtns .btn{padding:9px 8px;font-size:16px}}
</style>

</head>

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const WORDS=/*WORDS*/{};
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const hyp=Math.hypot;
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255);return'#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1);}

function lookup(w){
  const k=w.toLowerCase().replace(/’/g,"'");
  const hit=t=>SLANG[t]||NAMES[t]||LEARN.get(t)||BASIC[t]||DICT.get(t);
  let r=hit(k);if(r)return r;
  const tries=[k.replace(/'s$/,''),k.replace(/s$/,''),k.replace(/es$/,''),k.replace(/ies$/,'y'),k.replace(/ed$/,''),k.replace(/d$/,''),k.replace(/ing$/,''),k.replace(/ing$/,'e'),k.replace(/ly$/,''),k.replace(/(.)\1(ed|ing)$/,'$1'),k.replace(/er$/,'')];
  for(const t of tries)if(t&&t!==k&&(r=hit(t)))return r;
  return null;
}
function wordsHTML(en){
  return en.split(/(\s+)/).map(tok=>{
    if(!tok.trim())return tok;
    const core=tok.replace(/^[^A-Za-z']+|[^A-Za-z'-]+$/g,'');
    if(!core)return esc(tok);
    return `<span class="w" data-w="${esc(core)}">${esc(tok)}</span>`;
  }).join('');
}

    if(p.side==='e'){p.ex=b.x1+RH/2;p.ey=cy;p.sx=b.x1-9;p.sy=cy;}

const onSand=(x,y)=>x<-RH||y<-RH||x>N*B+RH||y>N*B+RH;
function pushOut(x,y,r){
  let dx=0,dy=0;const bi=Math.floor(x/B),bj=Math.floor(y/B);
  for(let j=bj-1;j<=bj+1;j++)for(let i=bi-1;i<=bi+1;i++){
    if(i<0||j<0||i>=N||j>=N)continue;
    for(const q of blocks[j*N+i].rects){
      const nx=clamp(x,q.x0,q.x1),ny=clamp(y,q.y0,q.y1),ex=x-nx,ey=y-ny,d2=ex*ex+ey*ey;
      if(d2>=r*r)continue;
      if(d2>1e-6){const d=Math.sqrt(d2),p=r-d;dx+=ex/d*p;dy+=ey/d*p;}
      else{const l=x-q.x0,rr=q.x1-x,t=y-q.y0,bb=q.y1-y,m=Math.min(l,rr,t,bb);if(m===l)dx-=l+r;else if(m===rr)dx+=rr+r;else if(m===t)dy-=t+r;else dy+=bb+r;}
    }
  }
  if(x-r<L0)dx+=L0-(x-r);if(x+r>L1)dx-=x+r-L1;if(y-r<L0)dy+=L0-(y-r);if(y+r>L1)dy-=y+r-L1;
  return [dx,dy];
}

const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});

scene.fog=new THREE.Fog(FOG,450,1650);
const camera=new THREE.PerspectiveCamera(62,W/VH,1,2000);
const hemi=new THREE.HemisphereLight(0xfff0e0,0x6d6290,1.35);scene.add(hemi);

sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-480,right:480,top:480,bottom:-480,near:10,far:1800});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);
const SUN_OFF=new THREE.Vector3(-380,620,300);
function applyQuality(){
  renderer.setPixelRatio(Math.min(S.hq?2:1,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=!!S.hq;sun.castShadow=!!S.hq;
  scene.traverse(o=>{if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.needsUpdate=true);}});
}

addEventListener('resize',resize);
const frustum=new THREE.Frustum(),_m4=new THREE.Matrix4(),_v=new THREE.Vector3();

function canvasTex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);}
function skyTex(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#4f6db8');gr.addColorStop(.45,'#c98bb0');gr.addColorStop(.75,'#f6a873');gr.addColorStop(1,'#'+FOG.getHexString());g.fillStyle=gr;g.fillRect(0,0,4,256);return canvasTex(c);}
scene.background=skyTex();

/* ground: the whole map painted once into one texture */
function paintBlock(g,b){
  g.fillStyle='#cfc7b8';g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
  g.strokeStyle='#ffffff66';g.lineWidth=2;g.strokeRect(b.x0+1,b.y0+1,b.x1-b.x0-2,b.y1-b.y0-2);
  const i0=b.x0+20,j0=b.y0+20,w=b.x1-b.x0-40,h=b.y1-b.y0-40;
  if(b.kind==='city'){g.fillStyle='#9bb27c';g.fillRect(i0,j0,w,h);}
  else if(b.kind==='park'){g.fillStyle='#74b45c';g.fillRect(i0,j0,w,h);g.fillStyle='#e2d2a4';g.fillRect(i0+w/2-10,j0,20,h);g.fillRect(i0,j0+h/2-10,w,20);g.fillStyle='#5ec8e6';g.beginPath();g.arc(i0+w/2,j0+h/2,34,0,7);g.fill();}
  else if(b.kind==='lot'){g.fillStyle='#55585f';g.fillRect(i0,j0,w,h);g.fillStyle='#ffffffaa';for(let x=i0+10;x<i0+w;x+=46){g.fillRect(x,j0+10,3,70);g.fillRect(x,j0+h-80,3,70);}}
  else if(b.kind==='airport'){g.fillStyle='#7d838b';g.fillRect(i0,j0,w,h);g.fillStyle='#4a4e55';g.fillRect(i0,j0+120,w,60);g.fillStyle='#fff';for(let x=i0+10;x<i0+w;x+=40)g.fillRect(x,j0+148,22,4);}
  else if(b.kind==='docks'){g.fillStyle='#9a9ea5';g.fillRect(i0,j0,w,h);}
  else{g.fillStyle='#e3dccd';g.fillRect(i0,j0,w,h);}
  if(b.strip){const s=b.strip;g.fillStyle='#5a5d64';g.fillRect(s.x0,s.y0,s.x1-s.x0,s.y1-s.y0);g.fillStyle='#ffffff88';
    if(s.x1-s.x0>s.y1-s.y0)for(let x=s.x0+8;x<s.x1;x+=42)g.fillRect(x,s.y0+6,3,s.y1-s.y0-12);else for(let y=s.y0+8;y<s.y1;y+=42)g.fillRect(s.x0+6,y,s.x1-s.x0-12,3);}
}
function makeGround(){
  const max=Math.min(4096,renderer.capabilities.maxTextureSize),c=document.createElement('canvas');c.width=c.height=max;
  const g=c.getContext('2d'),s=max/(L1-L0);g.setTransform(s,0,0,s,-L0*s,-L0*s);
  g.fillStyle='#2a8fa8';g.fillRect(L0,L0,L1-L0,L1-L0);
  g.fillStyle='#bfe7ee';rr(g,L0+4,L0+4,L1-L0-8,L1-L0-8,120);g.fill();
  g.fillStyle='#ecd59f';rr(g,L0+18,L0+18,L1-L0-36,L1-L0-36,110);g.fill();
  g.fillStyle='#41444b';g.fillRect(-RH,-RH,N*B+R2,N*B+R2);
  // asphalt noise
  for(let n=0;n<9000;n++){g.fillStyle=Math.random()<.5?'#ffffff08':'#00000010';g.fillRect(rand(-RH,N*B+RH),rand(-RH,N*B+RH),rand(2,6),rand(2,6));}
  g.strokeStyle='#e8c547';g.lineWidth=3;g.setLineDash([26,22]);g.beginPath();
  for(let i=0;i<=N;i++){const c0=i*B;g.moveTo(c0,-RH);g.lineTo(c0,N*B+RH);g.moveTo(-RH,c0);g.lineTo(N*B+RH,c0);}
  g.stroke();g.setLineDash([]);
  // white edge lines
  g.strokeStyle='#ffffff55';g.lineWidth=2;g.beginPath();

function aiCar(c,dt){
  const ai=c.ai;
  if(c.stun>0){c.stun-=dt;c.vx*=Math.exp(-3*dt);c.vy*=Math.exp(-3*dt);c.v=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);return;}
  if(ai.mode==='parked'||ai.mode==='hold'){c.v=0;c.vx*=Math.exp(-6*dt);c.vy*=Math.exp(-6*dt);return;}
  const dp=hyp(c.x-px(),c.y-py());
  let tx,ty,direct=false;
  if(ai.mode==='chase'&&mode==='play'&&dp<380){tx=px();ty=py();direct=true;ai.wasDirect=true;}
  else{
    if(ai.wasDirect){ai.wasDirect=false;const i=clamp(Math.round(c.x/B),0,N),j=clamp(Math.round(c.y/B),0,N);setRoute(c,Math.sign(i*B-c.x)|0,Math.sign(j*B-c.y)|0,i,j);if(!ai.dx&&!ai.dy)ai.dx=1;}
    if(ai.mode==='final'){tx=ai.fx;ty=ai.fy;}else{tx=ai.ti*B-ai.dy*LO;ty=ai.tj*B+ai.dx*LO;}
  }
  const dx=tx-c.x,dy=ty-c.y,d=hyp(dx,dy);
  if(!direct&&d<30){if(ai.mode==='final'){ai.mode='parked';return;}arrive(c);return;}
  const da=angDiff(Math.atan2(dy,dx),c.a);c.a+=clamp(da,-3.2*dt,3.2*dt);
  let tv=ai.cruise*(Math.abs(da)>.6?.5:1);
  if(ai.mode==='final')tv=Math.min(tv,d*1.4+20);
  if(!direct){if(blockedAhead(c)){c.bt+=dt;if(c.bt<2.5)tv=0;else if(c.bt>3.5)c.bt=0;}else c.bt=0;}
  c.v+=clamp(tv-c.v,-700*dt,320*dt);c.vx=Math.cos(c.a)*c.v;c.vy=Math.sin(c.a)*c.v;
}

/* ---------- driving: engine, gears, steering ---------- */
const U=15.5,GR={R:-3.3,N:0,P:0,1:3.4,2:2.05,3:1.42,4:1.06,5:.84},FD=4.3,RW=.31,MASS=1150,IDLE=850,RED=6400,WB=2.6;
const MAN=['R','N','1','2','3','4','5'],AUT=['P','R','N','D'];
const drv={sw:0,gas:0,brk:0,hb:false,gear:'N',ag:1,on:true,rpm:IDLE,stallT:0,shiftT:0,gasHeld:false,brkHeld:false,hintT:0,vf:0};
const torque=r=>1.25*(r<1000?95:r<4200?95+(r-1000)/3200*70:165-(r-4200)/2200*40);
const ratio=()=>S.gear==='man'?GR[drv.gear]:drv.gear==='D'?GR[drv.ag]:GR[drv.gear];
function fwdSpeed(c){return (c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a))/U;}
function playerCar(c,dt){
  const ca=Math.cos(c.a),sa=Math.sin(c.a);
  let vf=(c.vx*ca+c.vy*sa)/U,vl=(-c.vx*sa+c.vy*ca)/U;
  drv.gas=approach(drv.gas,(K.ArrowUp||K.w||drv.gasHeld)?1:0,dt*4);
  drv.brk=approach(drv.brk,(K.ArrowDown||K.s||drv.brkHeld)?1:0,dt*6);
  const hb=!!(K[' ']||drv.hb),kl=K.ArrowLeft||K.a,kr=K.ArrowRight||K.d;
  if((kl||kr)&&!(kl&&kr))drv.sw=clamp(drv.sw+(kr?1:-1)*330*dt,-450,450);
  else if(wheelT.id==null){const back=(80+Math.abs(vf)*16)*dt;drv.sw-=Math.sign(drv.sw)*Math.min(Math.abs(drv.sw),back);}
  const r=ratio();let F=0;
  const eng=Math.abs(vf/RW*9.549*r*FD);
  if(!drv.on)drv.rpm=approach(drv.rpm,0,dt*3000);
  else if(r===0){drv.rpm=approach(drv.rpm,IDLE+drv.gas*(RED-IDLE),dt*(drv.gas?6000:3500));if(drv.rpm>=RED)drv.rpm=RED-200*Math.random();}
  else{
    const slip=IDLE+drv.gas*1600,target=eng<slip?slip*.55+eng*.45:eng;
    drv.rpm=approach(drv.rpm,Math.min(target,RED+400),dt*9000);
    const T=drv.rpm>=RED?0:torque(drv.rpm)*drv.gas;
    F=T*r*FD*.85/RW;
    if(drv.gas<.05&&Math.abs(vf)>.3)F-=Math.sign(vf)*Math.min(Math.abs(vf)*300,eng/RED*Math.abs(r)*240);
    if(S.gear==='man'&&+drv.gear>=3&&eng<520&&drv.gas>.3){drv.stallT+=dt;if(drv.stallT>.9)stall();}else drv.stallT=0;
    if(S.gear==='auto'&&drv.gear==='D'){drv.shiftT-=dt;if(drv.shiftT<=0){const up=2300+drv.gas*3300;if(drv.rpm>up&&drv.ag<5){drv.ag++;drv.shiftT=.5;}else if(drv.rpm<1300&&drv.ag>1){drv.ag--;drv.shiftT=.5;}}}
  }
  if(drv.gas>.5&&Math.abs(vf)<.5&&mode==='play'){drv.hintT-=dt;if(drv.hintT<=0){drv.hintT=4;if(!drv.on)toast('ENGINE OFF','กดสตาร์ท');else if(r===0)toast('NEUTRAL','เข้าเกียร์ก่อน');}}
  vf+=(F-.42*vf*Math.abs(vf))/MASS*dt;
  let dec=drv.brk*8.5+(hb?4:0)+.15;
  if(S.gear==='auto'&&drv.gear==='P')dec+=20;
  vf=approach(vf,0,dec*dt);
  if(onSand(c.x,c.y))vf*=Math.exp(-.9*dt);
  // steering (bicycle model, grip limit)
  const delta=drv.sw/450*.6,yawD=vf*Math.tan(delta)/WB;
  const lim=(hb?6:9.5)/Math.max(Math.abs(vf),.5);
  let yaw=clamp(yawD,-lim,lim);
  if(hb&&Math.abs(vf)>4)yaw=clamp(yawD*1.7,-2.6,2.6);
  vl+=(yawD-yaw)*Math.abs(vf)*.12*dt*(hb?3:1);
  vl*=Math.exp(-(hb?1.4:11)*dt);
  c.a+=yaw*dt;
  const c2=Math.cos(c.a),s2=Math.sin(c.a);
  c.vx=(c2*vf-s2*vl)*U;c.vy=(s2*vf+c2*vl)*U;c.v=vf*U;drv.vf=vf;
  c.spin+=vf*U/7*dt;
}
function stall(){drv.on=false;drv.stallT=0;toast('STALLED','เครื่องดับ');thud(150);updDash(true);}
function startEngine(){if(!P.car)return;drv.on=true;drv.rpm=1200;beep(90,.4,'sawtooth',.06);updDash(true);}
function shift(g){
  if(!P.car)return;audio();const vf=drv.vf;
  if((g==='R'&&vf>1.5)||(g==='P'&&Math.abs(vf)>1)||(g!=='R'&&g!=='N'&&g!=='P'&&vf<-1.5)){beep(110,.15,'square',.06);return;}
  if(S.gear==='man'&&GR[g]>0&&Math.abs(vf/RW*9.549*GR[g]*FD)>RED+600){beep(110,.15,'square',.06);toast('TOO FAST','รอบสูงไป');return;}
  drv.gear=g;if(g==='D'){drv.ag=1;while(drv.ag<5&&Math.abs(vf/RW*9.549*GR[drv.ag]*FD)>3500)drv.ag++;}
  beep(160,.05,'square',.05);renderGears();updDash(true);
}
function shiftStep(d){const L=S.gear==='man'?MAN:AUT;const i=L.indexOf(drv.gear);const n=L[clamp(i+d,0,L.length-1)];if(n!==drv.gear)shift(n);}
function renderGears(){

}
$('#gears').addEventListener('pointerdown',e=>{const t=e.target.closest('[data-g]');if(t){shift(t.dataset.g);e.preventDefault();}});
let dashT=0;
function updDash(force){

  $('#spd').firstChild.nodeValue=Math.round(Math.abs(drv.vf)*3.6);

function carWorld(c){
  const fx=Math.cos(c.a)*18,fy=Math.sin(c.a)*18;let tx=0,ty=0;
  for(const s of[1,-1]){const [dx,dy]=pushOut(c.x+fx*s,c.y+fy*s,16);tx+=dx;ty+=dy;}
  if(!tx&&!ty)return;
  c.x+=tx;c.y+=ty;const l=hyp(tx,ty),nx=tx/l,ny=ty/l,vn=c.vx*nx+c.vy*ny;
  if(vn<0){c.vx-=nx*vn*1.3;c.vy-=ny*vn*1.3;if(c.ai)c.v*=.5;if(-vn>120&&c===P.car)crash(-vn);}
}
function crash(v){thud(v);cam.shake=Math.min(10,v/45);if(v>140&&M&&M.pass&&M.crashCd<=0){M.crash++;M.crashCd=2.5;const l=pick(COMPLAIN);say(M.pass,l[0],l[1]);}}
function carCars(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j];if(Math.abs(a.x-b.x)>90||Math.abs(a.y-b.y)>90)continue;
    const ax=Math.cos(a.a)*18,ay=Math.sin(a.a)*18,bx=Math.cos(b.a)*18,by=Math.sin(b.a)*18;
    for(const sa of[1,-1])for(const sb of[1,-1]){
      const x1=a.x+ax*sa,y1=a.y+ay*sa,x2=b.x+bx*sb,y2=b.y+by*sb,dx=x2-x1,dy=y2-y1,d=hyp(dx,dy);
      if(d>=32||d<1e-3)continue;
      const nx=dx/d,ny=dy/d,p=(32-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rv<0){const J=-rv*.55;a.vx-=nx*J;a.vy-=ny*J;b.vx+=nx*J;b.vy+=ny*J;
        if(-rv>80)for(const c of[a,b])if(c.ai&&c.ai.mode!=='hold'&&c.ai.mode!=='parked')c.stun=c.police?.35:.8;
        if((a===P.car||b===P.car)&&-rv>110){crash(-rv);const o=a===P.car?b:a;if(o.police&&wanted===0)setWanted(1);}}
    }
  }
}
/* ---------- pedestrians ---------- */
function perim(b){const x0=b.x0+9,y0=b.y0+9,x1=b.x1-9,y1=b.y1-9;return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,L:2*(x1-x0+y1-y0)};}
function perimPos(b,t){const p=perim(b);t=((t%p.L)+p.L)%p.L;if(t<p.w)return[p.x0+t,p.y0];t-=p.w;if(t<p.h)return[p.x1,p.y0+t];t-=p.h;if(t<p.w)return[p.x1-t,p.y1];t-=p.w;return[p.x0,p.y1-t];}
function perimT(b,x,y){const p=perim(b);const c=[[Math.abs(y-p.y0),clamp(x,p.x0,p.x1)-p.x0],[Math.abs(x-p.x1),p.w+clamp(y,p.y0,p.y1)-p.y0],[Math.abs(y-p.y1),p.w+p.h+p.x1-clamp(x,p.x0,p.x1)],[Math.abs(x-p.x0),2*p.w+p.h+p.y1-clamp(y,p.y0,p.y1)]];c.sort((a,b)=>a[0]-b[0]);return c[0][1];}
const SHIRT=['#e74c3c','#3498db','#f1c40f','#9b59b6','#1abc9c','#ecf0f1','#e67e22','#34495e','#ff7ab0','#2ecc71'];
const SKIN=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'];
function blockAt(x,y){return blocks[clamp(Math.floor(y/B),0,N-1)*N+clamp(Math.floor(x/B),0,N-1)];}
function mkPed(b,t,o={}){const [x,y]=perimPos(b,t);const p={b,t,x,y,a:0,dir:Math.random()<.5?1:-1,spd:rand(28,46),st:'walk',tm:0,vx:0,vy:0,shirt:pick(SHIRT),skin:pick(SKIN),ph:Math.random()*9,...o};peds.push(p);return p;}
function spawnPed(){
  const f=focus(),b=blockAt(f.x+((Math.random()*7|0)-3)*B,f.y+((Math.random()*7|0)-3)*B);
  const t=Math.random()*perim(b).L,[x,y]=perimPos(b,t),d=hyp(x-f.x,y-f.y);
  if(d>1100||(onScreen(x,y)&&d<900))return;mkPed(b,t);
}
function updPed(p,dt){
  if(p.npc){p.a=Math.atan2(py()-p.y,px()-p.x);if(p.board){const dx=px()-p.x,dy=py()-p.y,d=hyp(dx,dy);if(d>8){p.x+=dx/d*120*dt;p.y+=dy/d*120*dt;p.ph+=dt*8;}}return;}
  if(p.st==='walk'){p.t+=p.dir*p.spd*dt;const [x,y]=perimPos(p.b,p.t);p.a=Math.atan2(y-p.y,x-p.x);p.x=x;p.y=y;p.ph+=dt*p.spd*.15;return;}
  p.tm-=dt;
  if(p.st==='down'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-4*dt);p.vy*=Math.exp(-4*dt);if(p.tm<=0){p.st='flee';p.tm=2.5;}}
  else if(p.st==='flee'){
    let dx=p.x-px(),dy=p.y-py();if(p.home){dx=p.home.x-p.x;dy=p.home.y-p.y;}const d=hyp(dx,dy)||1;
    p.a=Math.atan2(dy,dx);p.x+=dx/d*110*dt;p.y+=dy/d*110*dt;p.ph+=dt*12;
    if(p.tm<=0){p.home=null;p.b=blockAt(p.x,p.y);p.t=perimT(p.b,p.x,p.y);p.st='walk';}
  }
  const [ox,oy]=pushOut(p.x,p.y,7);p.x+=ox;p.y+=oy;
}
function carHitsPeds(){
  for(const c of cars){const sp=hyp(c.vx,c.vy);if(sp<50)continue;
    for(const p of peds){if(p.npc||p.st==='down')continue;const rx=p.x-c.x,ry=p.y-c.y;if(Math.abs(rx)>45||Math.abs(ry)>45)continue;
      const ca=Math.cos(c.a),sa=Math.sin(c.a),f=rx*ca+ry*sa,l=-rx*sa+ry*ca;
      if(Math.abs(f)<42&&Math.abs(l)<24){p.st='down';p.tm=2;p.vx=c.vx*.8+(l>0?-sa:sa)*80;p.vy=c.vy*.8+(l>0?ca:-ca)*80;
        floatText(p.x,p.y,pick(['Hey!','Ow!','Watch out!']));beep(300,.08,'square',.05);
        if(c===P.car){if(M&&M.pass&&M.crashCd<=0){M.crash++;M.crashCd=2.5;say(M.pass,'Oh no! Be careful!','แย่แล้ว! ระวังหน่อย!');}if(!M&&!JOB&&wanted===0)setWanted(1);}}}}
}

/* ---------- player ---------- */
function nearCar(){let best=null,bd=75;for(const c of cars){if(c.police)continue;const d=hyp(c.x-P.x,c.y-P.y);if(d<bd){bd=d;best=c;}}return best;}
function enterCar(c){

function leaveCar(force){

  P.mode='foot';P.x=c.x+Math.sin(c.a)*34;P.y=c.y-Math.cos(c.a)*34;
  const [ox,oy]=pushOut(P.x,P.y,10);P.x+=ox;P.y+=oy;P.a=c.a;camYaw=c.a;
  c.vx=c.vy=0;c.v=0;c.ai={mode:'parked'};c.parked=true;if(c.cockpit)c.cockpit.visible=false;c.bodyMesh.visible=true;P.car=null;P.vx=P.vy=0;

function footUpdate(dt){
  let f=0,r=0;
  if(K.ArrowUp||K.w)f+=1;if(K.ArrowDown||K.s)f-=1;if(K.ArrowLeft||K.a)r-=1;if(K.ArrowRight||K.d)r+=1;
  if(stick.on&&stick.m>.15){f=-Math.sin(stick.ang)*stick.m;r=Math.cos(stick.ang)*stick.m;}
  const m=hyp(f,r);if(m>1){f/=m;r/=m;}
  const cy=Math.cos(camYaw),sy=Math.sin(camYaw);
  const mx=cy*f-sy*r,my=sy*f+cy*r;
  P.vx=mx*190;P.vy=my*190;P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(m>.05){P.a=Math.atan2(my,mx);P.walk+=dt*m*10;if(f>.3)camYaw+=angDiff(P.a,camYaw)*Math.min(1,dt*2.5);}

  for(const c of cars){const dx=P.x-c.x,dy=P.y-c.y,ca=Math.cos(c.a),sa=Math.sin(c.a),fo=dx*ca+dy*sa,l=-dx*sa+dy*ca;
    if(Math.abs(fo)<44&&Math.abs(l)<26){const pf=44-Math.abs(fo),pl=26-Math.abs(l);if(pl<pf){const s=Math.sign(l)||1;P.x+=-sa*pl*s;P.y+=ca*pl*s;}else{const s=Math.sign(fo)||1;P.x+=ca*pf*s;P.y+=sa*pf*s;}}}
}

/* ---------- ride app jobs ---------- */
const RIDERS=[['Anna','#ff7ab0'],['Tom','#4aa3ff'],['Lisa','#ffb347'],['Ben','#7bd389'],['Sara','#c39bff'],['Jack','#ff6b6b'],['Emma','#ffd166'],['Noah','#5fe0d6'],['Mike','#9aa5b1'],['Kate','#f78fb3']];
const JOBCOL=Object.fromEntries(RIDERS);
const FOOD={pizza:['pizza','พิซซ่า','pizza'],market:['groceries','ของชำ','box'],bar:['drinks','เครื่องดื่ม','bag'],mall:['package','พัสดุ','box'],gas:['snacks','ขนม','bag']};
const placeEn=k=>k==='garage'?"Ray's Garage":'the '+PLACES[k].en;
const placeTh=k=>PLACES[k].th;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const STOPS=Object.keys(PLACES).filter(k=>k!=='garage');
function makeJob(){
  const kind=Math.random()<.6?'ride':'food',[name]=pick(RIDERS);let from,to;
  do{from=kind==='food'?pick(Object.keys(FOOD)):pick(STOPS);to=pick(STOPS);}while(to===from||hyp(PLACES[from].ex-PLACES[to].ex,PLACES[from].ey-PLACES[to].ey)<700);
  const d=hyp(PLACES[from].ex-PLACES[to].ex,PLACES[from].ey-PLACES[to].ey)+hyp(px()-PLACES[from].ex,py()-PLACES[from].ey)*.4;
  return{kind,name,from,to,pay:Math.round(6+d/110),item:FOOD[from],d};
}
function jobDef(j){
  const steps=j.kind==='ride'?[
    {t:'pick',who:j.name,at:j.from,en:`Pick up ${j.name} at ${placeEn(j.from)}.`,th:`ไปรับ${j.name}ที่${placeTh(j.from)}`},
    {t:'go',at:j.to,drop:1,en:`Take ${j.name} to ${placeEn(j.to)}.`,th:`พา${j.name}ไป${placeTh(j.to)}`}]:[
    {t:'load',at:j.from,item:j.item,en:`Pick up the ${j.item[0]} at ${placeEn(j.from)}.`,th:`ไปรับ${j.item[1]}ที่${placeTh(j.from)}`},
    {t:'give',who:j.name,at:j.to,en:`Deliver the ${j.item[0]} to ${j.name} at ${placeEn(j.to)}.`,th:`ส่ง${j.item[1]}ให้${j.name}ที่${placeTh(j.to)}`}];
  return{id:'job',job:j,ch:0,steps,learn:[]};
}
let offer=null;
function offerJob(){
  if(!JOB||M)return;offer=makeJob();const j=offer;
  $('#oPay').textContent='$'+j.pay;
  const row=(k,v)=>`<div><em>${k}</em>${wordsHTML(v)}</div>`;
  if(j.kind==='ride'){$('#oKind').innerHTML=wordsHTML('Ride request');$('#oBody').innerHTML=row('Pick up:',j.name)+row('At:',placeEn(j.from))+row('Drop off:',placeEn(j.to));}
  else{$('#oKind').innerHTML=wordsHTML('Food delivery');$('#oBody').innerHTML=row('Order:',cap(j.item[0]))+row('From:',placeEn(j.from))+row('Deliver to:',j.name+', '+placeEn(j.to));}
  $('#offer').hidden=false;beep(1300,.08);setTimeout(()=>beep(1600,.1),120);
  speak(j.kind==='ride'?`New ride. Pick up ${j.name} at ${placeEn(j.from)}.`:`New order. ${cap(j.item[0])} from ${placeEn(j.from)}.`);
}
$('#oTake').onclick=()=>{if(!offer)return;$('#offer').hidden=true;const j=offer;offer=null;
  M={def:jobDef(j),i:-1,usedTr:false,usedGps:false,crash:0,crashCd:0,fast:0,fastT:0,chatT:rand(9,14),t0:tick};next();};
$('#oSkip').onclick=()=>{$('#offer').hidden=true;offer=null;setTimeout(offerJob,1500);};
function finishJob(){
  const j=M.def.job,late=(tick-M.t0)>j.d/100+40;
  const st=clamp(5-Math.min(2,M.crash)-(M.fast>=2?1:0)-(M.usedGps?1:0)-(late?1:0),1,5);
  const tip=st===5?4:st===4?2:0,cash=j.pay+tip;
  S.money+=cash;S.jobs=(S.jobs||0)+1;S.rsum=(S.rsum||0)+st;save();updMoney();
  toast('+$'+cash,'★'.repeat(st)+'☆'.repeat(5-st));beep(523,.12);setTimeout(()=>beep(784,.2),140);
  M=null;showObj();setTimeout(()=>{if(JOB&&!M)offerJob();},4500);
}

/* ---------- mission engine ---------- */
function resetWorld(){setCars([]);setPeds([]);for(const it of items)dropObj(it);items=[];for(const f of floats)scene.remove(f.s);floats=[];hideSub();
  wanted=0;lostT=0;bustT=0;renderStars();P.mode='foot';P.car=null;const g=PLACES.garage;P.x=g.sx;P.y=g.sy+2;P.a=Math.PI/2;camYaw=-Math.PI/2;$('#offer').hidden=true;offer=null;}
function startMission(id){
  const def=MISSIONS.find(m=>m.id===id);JOB=null;resetWorld();
  M={def,i:-1,usedTr:false,usedGps:false,crash:0,crashCd:0,fast:0,fastT:0,chatT:999};
  enterPlay();next();
}
function startFree(){M=null;JOB=null;resetWorld();enterPlay();spawnParked(P.x,P.y,[pick(CNAMES),pick(CNAMES)]);showObj();}
function startJobs(){
  M=null;resetWorld();JOB={on:true};enterPlay();
  const [c]=spawnParked(P.x,P.y,['white']);enterCar(c);showObj();setTimeout(offerJob,1800);
}
function next(){
  if(!M)return;
  M.i++;const st=M.def.steps[M.i];M.st=st;M.gps=false;M.wait=0;M.lost=0;M.cool=0;
  $('#objTh').hidden=true;
  if(!st){if(M.def.job)finishJob();else finishMission();return;}
  if(st.t==='talk'){showObj();openTalk(st.lines,next);return;}
  if(st.t==='car'){
    if(st.col==='any'&&P.mode==='car'){next();return;}
    const ref=st.at?PLACES[st.at]:{ex:P.x,ey:P.y};
    let cols;if(st.col==='any')cols=[pick(CNAMES),pick(CNAMES)];else{const o=CNAMES.filter(c=>c!==st.col).sort(()=>Math.random()-.5).slice(0,3);cols=[o[0],st.col,o[1],o[2]];}
    const cs=spawnParked(ref.ex,ref.ey,cols);M.target=cs.find(c=>c.cname===st.col)||cs[0];
  }
  if(st.t==='out'&&P.mode==='foot'){next();return;}
  if(st.t==='grab'){const p=PLACES[st.at],it={x:p.sx+(p.side==='e'||p.side==='w'?0:50),y:p.sy+(p.side==='e'||p.side==='w'?50:0),kind:st.item};buildItem(it);items.push(it);}
  if(st.t==='pick'||st.t==='give'){const p=PLACES[st.at],b=p.blk||blockAt(p.ex-200,p.ey);const sx=p.blk?p.sx:p.ex+40,sy=p.blk?p.sy:p.ey;
    M.npc=mkPed(b,0,{npc:st.who,shirt:WHO[st.who]||JOBCOL[st.who]||'#fff'});M.npc.x=sx;M.npc.y=sy;}
  if(st.t==='follow'){
    const sp=curbSpots(px(),py()).sort((a,b)=>hyp(b.x-px(),b.y-py())-hyp(a.x-px(),a.y-py()))[0];
    const c=mkCar(sp.x,sp.y,sp.a,st.col,{keep:true});c.ai={mode:'hold',cruise:190};aiFromPose(c);
    const p=PLACES[st.to];c.ai.di=clamp(Math.round(p.ex/B),0,N);c.ai.dj=clamp(Math.round(p.ey/B),0,N);c.ai.fx=p.ex;c.ai.fy=p.ey;M.follow=c;
  }
  if(st.t==='cops')setWanted(st.n);
  showObj();
}
function stepTarget(){
  const st=M&&M.st;if(!st)return null;
  if(st.t==='go'||st.t==='wait'||st.t==='load'){const p=PLACES[st.at];return{x:p.ex,y:p.ey};}
  if(st.t==='car'&&st.col!=='any'&&M.target)return M.target;
  if(st.t==='grab')return items[0]||null;
  if(st.t==='pick'||st.t==='give')return M.npc;
  if(st.t==='follow')return M.follow;
  return null;
}
const SLOW=54,STOPV=140;
function missionTick(dt){
  const st=M&&M.st;if(!st||TK)return;
  M.cool-=dt;M.crashCd-=dt;
  const x=px(),y=py(),sp=pspeed();
  // passenger chat and speed comments
  if(M.pass&&M.def.job){
    M.chatT-=dt;if(M.chatT<=0&&!SUB){M.chatT=rand(14,22);if(Math.random()<.5){const q=pick(ASKS);say(M.pass,q[0][0],q[0][1],q[1]);}else{const l=pick(CHAT);say(M.pass,l[0],l[1]);}}
    if(Math.abs(drv.vf)*3.6>75){M.fastT+=dt;if(M.fastT>2.5){M.fastT=-6;M.fast++;say(M.pass,'Slow down, please!','ช้าลงหน่อยค่ะ');}}else M.fastT=Math.max(0,M.fastT-dt);
  }
  if(st.t==='go'||st.t==='load'){
    const p=PLACES[st.at],inZ=hyp(x-p.ex,y-p.ey)<p.rad;
    if(inZ&&sp<(st.t==='load'||st.drop?SLOW:STOPV)){
      if(st.drop&&M.pass){const q=mkPed(p.blk||blockAt(p.ex-200,p.ey),0,{st:'flee',tm:2.2,shirt:WHO[M.pass]||JOBCOL[M.pass]});q.x=x;q.y=y;q.home={x:p.sx,y:p.sy};
        if(M.def.job)say(M.pass,pick(['Thanks! Have a nice day.','Thank you. See you!','Perfect. Thanks a lot!']),'ขอบคุณนะ');else floatText(x,y,'Bye!');M.pass=null;}
      if(st.t==='load')toast('ORDER READY','รับของแล้ว');
      beep(660,.1);beep(990,.15);next();return;
    }
    if(inZ&&M.cool<=0){toast('STOP HERE','จอดตรงนี้');M.cool=4;}
    if(!inZ&&sp<70&&M.cool<=0)for(const q of Object.values(PLACES))if(q!==p&&q.key!=='garage'&&hyp(x-q.ex,y-q.ey)<q.rad){toast('WRONG PLACE','ผิดที่');M.cool=4;break;}
  }else if(st.t==='car'){
    if(P.mode==='car'){if(st.col==='any'||P.car.cname===st.col){next();return;}if(M.cool<=0){toast('WRONG CAR','ผิดคัน');M.cool=4;}}
  }else if(st.t==='out'){if(P.mode==='foot')next();}
  else if(st.t==='grab'){
    const it=items[0];if(!it){next();return;}
    const d=hyp(x-it.x,y-it.y);
    if(P.mode==='foot'&&d<34){items.shift();dropObj(it);beep(880,.1);next();return;}
    if(P.mode==='car'&&d<90&&M.cool<=0){toast('GET OUT OF THE CAR','ลงจากรถก่อน');M.cool=4;}
  }else if(st.t==='pick'||st.t==='give'){
    const n=M.npc,d=hyp(x-n.x,y-n.y);
    if(P.mode==='car'&&d<130&&sp<SLOW){n.board=true;
      if(d<34){setPeds(peds.filter(p=>p!==n));M.npc=null;beep(700,.1);
        if(st.t==='pick'){M.pass=n.npc;if(M.def.job){const j=M.def.job;say(j.name,`Hi! ${cap(placeEn(j.to))}, please.`,`หวัดดี ไป${placeTh(j.to)}นะ`);}}
        else{floatText(x,y,'Thank you!');say(st.who,pick(['Thanks! Keep the change.','Thank you so much!','Great, thanks!']),'ขอบคุณมาก');}
        next();}}
    else{n.board=false;if(d<130&&P.mode==='car'&&M.cool<=0){toast('STOP HERE','จอดตรงนี้');M.cool=4;}if(P.mode==='foot'&&d<70&&M.cool<=0&&st.t==='pick'){toast('GET IN A CAR','ขึ้นรถก่อน');M.cool=4;}}
  }else if(st.t==='wait'){
    const p=PLACES[st.at];if(hyp(x-p.ex,y-p.ey)<p.rad+20&&sp<60)M.wait+=dt;
    $('#objEn').innerHTML=wordsHTML(st.en)+` <b style="color:var(--gold)">${Math.max(0,Math.ceil(st.s-M.wait))}</b>`;
    if(M.wait>=st.s)next();
  }else if(st.t==='follow'){
    const c=M.follow,d=hyp(x-c.x,y-c.y);
    if(c.ai.mode==='hold'&&P.mode==='car'&&d<520)c.ai.mode='route';
    if(c.ai.mode!=='hold'){if(d>850)M.lost+=dt;else M.lost=0;if(M.lost>5){failMission('LOST HIM','คลาดแล้ว');return;}}
    if(c.ai.mode==='parked'&&d<420)next();
  }else if(st.t==='cops'){if(wanted===0)next();}
}
function finishMission(){
  const st=M.usedGps?1:M.usedTr?2:3,def=M.def,cash=100+def.ch*50+st*25;
  S.done[def.id]=Math.max(S.done[def.id]||0,st);S.money+=cash;save();updMoney();
  $('#dStars').innerHTML=[1,2,3].map(i=>`<i class="${i<=st?'on':''}">★</i>`).join('');
  $('#dCash').textContent='+$'+cash;
  $('#dWords').innerHTML=def.learn.map(([en,th])=>`<button class="chip" data-say="${esc(en)}">🔊 ${esc(en)}<span>${esc(th)}</span></button>`).join('');
  const idx=MISSIONS.indexOf(def);$('#dNext').hidden=idx>=MISSIONS.length-1;$('#dNext').dataset.id=MISSIONS[idx+1]?MISSIONS[idx+1].id:'';
  M.over=true;paused=true;showScr('done');beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);
}
function failMission(t,th){M.over=true;paused=true;$('#fTitle').textContent=t;$('#fTh').textContent=th;showScr('fail');beep(200,.4,'sawtooth',.06);}

  else{TK.cur={opts:it.ask};$('#tWho').textContent='You';$('#tWho').style.color='#fff';$('#tEn').innerHTML='';$('#tNext').hidden=true;
    $('#tOpts').innerHTML=it.ask.map((o,i)=>`<button class="btn" data-opt="${i}">${esc(o[0])}<small hidden>${esc(o[1])}</small></button>`).join('');}

$('#mlist').onclick=e=>{const b=e.target.closest('[data-id]');if(b&&!b.disabled&&ready){audio();startMission(b.dataset.id);}};
$('#nlist').onclick=e=>{const s=e.target.closest('[data-say]'),d=e.target.closest('[data-del]');if(s)speak(s.dataset.say);if(d){delete S.notes[d.dataset.del];save();renderNotes();}};
$('#dWords').onclick=e=>{const s=e.target.closest('[data-say]');if(s)speak(s.dataset.say);};
$('#segRate').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.rate=+b.dataset.v;save();renderSet();speak('Hello! Welcome to Sun Bay.');};
$('#segSnd').onclick=e=>{const b=e.target.closest('button');if(!b)return;audio();S.snd=+b.dataset.v;save();renderSet();};
$('#segGear').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.gear=b.dataset.v;save();renderSet();};
$('#segHq').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.hq=+b.dataset.v;save();renderSet();applyQuality();};
$('#dMenu').onclick=toMenu;$('#fMenu').onclick=toMenu;$('#pMenu').onclick=toMenu;
$('#dNext').onclick=()=>startMission($('#dNext').dataset.id);
$('#fRetry').onclick=()=>startMission(M.def.id);
$('#pRetry').onclick=()=>{if(JOB)startJobs();else if(M)startMission(M.def.id);else startFree();};
$('#pGo').onclick=()=>{paused=false;showScr(null);};
$('#pauseB').onclick=()=>{if(mode!=='play'||(M&&M.over))return;paused=true;showScr('pause');if('speechSynthesis' in window)speechSynthesis.cancel();};
$('#mini').onclick=()=>{if(mode!=='play'||(M&&M.over))return;paused=true;drawBigMap();showScr('mapS');};
$('#mapX').onclick=()=>{paused=false;showScr(null);};
$('#actB').onclick=act;
$('#camB').onclick=()=>{camMode=camMode?0:1;};
$('#startB').onclick=startEngine;

/* ---------- input ---------- */
const K={};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(e.repeat&&'eqfcr'.includes(k))return;K[k]=true;audio();
  if(k==='f')act();
  if(k==='c'&&mode==='play')camMode=camMode?0:1;
  if(P.car&&k==='e')shiftStep(1);if(P.car&&k==='q')shiftStep(-1);
  if(P.car&&k==='r'&&!drv.on)startEngine();
  if(P.car&&/^[1-5]$/.test(k)&&S.gear==='man')shift(k);
  if(P.car&&k==='n')shift('N');
  if((k==='Enter'||k===' ')&&TK&&TK.cur&&TK.cur.en){showLine();e.preventDefault();}
  if(k==='m'&&mode==='play')$('#mini').onclick();
  if(k==='Escape'&&mode==='play'&&!paused)$('#pauseB').onclick();
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;K[k]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false;});
const stick={on:false,id:null,x0:0,y0:0,ang:0,m:0},SR=55;
cv.addEventListener('pointerdown',e=>{audio();if(e.pointerType==='mouse'||mode!=='play'||stick.on||P.mode==='car')return;if(e.clientX<W*.55){stick.on=true;stick.id=e.pointerId;stick.x0=e.clientX;stick.y0=e.clientY;stick.m=0;placeStick();}});
addEventListener('pointermove',e=>{
  if(wheelT.id===e.pointerId){const a=wheelAng(e);drv.sw=clamp(drv.sw+angDiff(a,wheelT.last)*180/Math.PI,-450,450);wheelT.last=a;}
  if(!stick.on||e.pointerId!==stick.id)return;const dx=e.clientX-stick.x0,dy=e.clientY-stick.y0;stick.ang=Math.atan2(dy,dx);stick.m=clamp(hyp(dx,dy)/SR,0,1);placeStick();});
const endPtr=e=>{if(e.pointerId===stick.id){stick.on=false;stick.id=null;stick.m=0;placeStick();}if(e.pointerId===wheelT.id)wheelT.id=null;};
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
function placeStick(){const el=$('#stick'),k=el.firstElementChild;
  if(stick.on){el.style.left=(stick.x0-el.offsetWidth/2)+'px';el.style.top=(stick.y0-el.offsetHeight/2)+'px';el.style.bottom='auto';k.style.transform=`translate(${Math.cos(stick.ang)*stick.m*SR}px,${Math.sin(stick.ang)*stick.m*SR}px)`;}
  else{el.style.left='';el.style.top='';el.style.bottom='';k.style.transform='';}}
// steering wheel
const wheelT={id:null,last:0};
function wheelAng(e){const r=$('#wheel').getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));}
$('#wheel').addEventListener('pointerdown',e=>{audio();wheelT.id=e.pointerId;wheelT.last=wheelAng(e);e.preventDefault();});
// pedals
function holdBtn(el,on,off){el.addEventListener('pointerdown',e=>{audio();el.setPointerCapture&&el.setPointerCapture(e.pointerId);el.classList.add('on');on();e.preventDefault();});
  for(const ev of['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{el.classList.remove('on');off();});}
holdBtn($('#gas'),()=>drv.gasHeld=true,()=>drv.gasHeld=false);
holdBtn($('#brk'),()=>drv.brkHeld=true,()=>drv.brkHeld=false);
holdBtn($('#hbB'),()=>drv.hb=true,()=>drv.hb=false);
function updControls(){
  const play=mode==='play'&&!TK&&!paused,inCar=play&&P.mode==='car',foot=play&&P.mode==='foot';
  $('#stick').hidden=!foot;for(const id of['#wheel','#gears','#pedals','#hbB','#dash'])$(id).hidden=!inCar;
  const a=$('#actB');a.classList.toggle('car',inCar);
  if(inCar){a.textContent='ลงรถ';a.hidden=false;}else if(foot){a.textContent='ขึ้นรถ';a.hidden=!nearCar();}else a.hidden=true;
}

/* ---------- toast ---------- */
let toastT=0;
function toast(t,th){const el=$('#toast');el.innerHTML=esc(t)+(th?`<small>${esc(th)}</small>`:'');el.classList.add('on');toastT=2.2;}

/* ---------- update ---------- */
function update(dt){
  tick+=dt;
  const f=focus();
  if(cars.filter(c=>!c.police&&!c.keep).length<16&&Math.random()<dt*4)spawnTraffic(false);
  if(peds.length<26&&Math.random()<dt*6)spawnPed();
  setCars(cars.filter(c=>c===P.car||(c.keep&&!c.police)||hyp(c.x-f.x,c.y-f.y)<(c.police&&wanted?2600:1500)||(M&&(c===M.follow||c===M.target))));
  setPeds(peds.filter(p=>p.npc||hyp(p.x-f.x,p.y-f.y)<1300));
  if(mode==='play'){if(P.mode==='car')playerCar(P.car,dt);else footUpdate(dt);}
  for(const c of cars)if(c.ai)aiCar(c,dt);
  for(const c of cars){if(c.parked&&c!==P.car){c.vx*=Math.exp(-4*dt);c.vy*=Math.exp(-4*dt);}c.x+=c.vx*dt;c.y+=c.vy*dt;}
  carCars();for(const c of cars)carWorld(c);
  for(const p of peds)updPed(p,dt);
  carHitsPeds();
  if(mode==='play'){policeTick(dt);missionTick(dt);}
  if(SUB){SUB.t-=dt;if(SUB.t<=0)hideSub();}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').classList.remove('on');}
  if((tick*10|0)%3===0)updControls();
  if(P.car)updDash();
}

/* ---------- render sync ---------- */
const cam={shake:0};
const _a=new THREE.Vector3(),_b=new THREE.Vector3();
function sync(dt){
  for(const c of cars){if(!c.obj)buildCar(c,c===P.car);c.obj.position.set(c.x,0,c.y);c.obj.rotation.y=-c.a;
    if(c.police){const on=(tick*6|0)%2;c.lr.material=on?redM:offM;c.lb.material=on?offM:blueM;}
    if(c.wheels){const st=c===P.car?-drv.sw/450*.6:0;for(const w of c.wheels){w.sp.rotation.z=-c.spin;if(w.front)w.piv.rotation.y=st;}}
    if(c.swMesh&&c===P.car)c.swMesh.rotation.z=-drv.sw*Math.PI/180;}
  const showMe=mode==='play'&&P.mode==='foot';
  if(showMe&&!me.obj)buildPed(me,true);if(me.obj){me.obj.visible=showMe;me.x=P.x;me.y=P.y;me.a=P.a;me.ph=P.walk;me.st=hyp(P.vx,P.vy)>5?'flee':'stand';}
  for(const p of [...peds,me]){if(!p.obj){if(p===me)continue;buildPed(p);}
    p.obj.position.set(p.x,0,p.y);p.obj.rotation.set(0,-p.a,0);
    if(p.st==='down'){p.obj.rotation.x=Math.PI/2;p.obj.position.y=4;}
    const moving=p.st==='walk'||p.st==='flee'||p.board,s=moving?Math.sin(p.ph*(p===me?1:1))*.6:0;
    p.legs[0].rotation.z=s;p.legs[1].rotation.z=-s;}
  for(const it of items)if(it.obj){it.obj.children[0].position.y=8+Math.sin(tick*4)*2;it.obj.children[0].rotation.y+=dt;}
  for(const f of floats){f.life-=dt;f.s.position.y+=25*dt;f.s.material.opacity=clamp(f.life,0,1);if(f.life<=0)scene.remove(f.s);}floats=floats.filter(f=>f.life>0);
  // targets
  const st=M&&M.st,tgt=M&&M.gps?stepTarget():null;
  beam.visible=!!tgt;if(tgt)beam.position.set(tgt.x,300,tgt.y);
  const zone=st&&(st.t==='go'||st.t==='load'||st.t==='wait')&&M.gps?PLACES[st.at]:null;
  zoneRing.visible=!!zone;if(zone){zoneRing.position.set(zone.ex,1,zone.ey);zoneRing.scale.setScalar(zone.rad/80);}
  arrow.visible=!!(tgt&&mode==='play');
  if(arrow.visible){arrow.position.set(px(),P.mode==='car'?(camMode?40:52):48,py());arrow.rotation.y=-Math.atan2(tgt.y-py(),tgt.x-px());arrow.scale.setScalar(camMode&&P.car?.45:1);if(camMode&&P.car){const a=P.car.a;arrow.position.x+=Math.cos(a)*30;arrow.position.z+=Math.sin(a)*30;}}
}
function camUpdate(dt){
  if(mode!=='play'){menuT+=dt*.06;const cx=N*B/2+Math.cos(menuT)*700,cy=N*B/2+Math.sin(menuT*1.3)*600;
    camera.position.set(cx+Math.cos(menuT*2)*320,180,cy+Math.sin(menuT*2)*320);camera.lookAt(cx,0,cy);setFov(55);}
  else if(P.mode==='car'){
    const c=P.car,ca=Math.cos(c.a),sa=Math.sin(c.a);
    c.cockpit.visible=camMode===1;c.bodyMesh.visible=camMode!==1;
    if(camMode===1){c.obj.updateMatrixWorld();camera.position.copy(c.obj.localToWorld(_a.set(-4,27,-8)));camera.lookAt(c.obj.localToWorld(_b.set(80,19,-8)));setFov(72);}
    else{const sp=Math.abs(drv.vf);const back=120+sp*1.2,up=50+sp*.4;
      _a.set(c.x-ca*back,up,c.y-sa*back);const k=1-Math.exp(-6*dt);
      if(camera.position.distanceTo(_a)>600)camera.position.copy(_a);else camera.position.lerp(_a,k);
      camera.lookAt(c.x+ca*40,16,c.y+sa*40);setFov(60+Math.min(14,sp*.35));}
  }else{
    _a.set(P.x-Math.cos(camYaw)*95,58,P.y-Math.sin(camYaw)*95);const [ox,oy]=pushOut(_a.x,_a.z,6);_a.x+=ox;_a.z+=oy;
    if(camera.position.distanceTo(_a)>600)camera.position.copy(_a);else camera.position.lerp(_a,1-Math.exp(-6*dt));
    camera.lookAt(P.x+Math.cos(camYaw)*30,22,P.y+Math.sin(camYaw)*30);setFov(62);
  }
  if(cam.shake>.05){camera.position.x+=(Math.random()-.5)*cam.shake;camera.position.y+=(Math.random()-.5)*cam.shake*.5;}
  cam.shake*=Math.exp(-8*dt);
  const fx=mode==='play'?px():camera.position.x,fz=mode==='play'?py():camera.position.z;
  sun.target.position.set(fx,0,fz);sun.position.set(fx+SUN_OFF.x,SUN_OFF.y,fz+SUN_OFF.z);
  camera.updateMatrixWorld();_m4.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);frustum.setFromProjectionMatrix(_m4);
}
function setFov(f){if(Math.abs(camera.fov-f)>.2){camera.fov+=(f-camera.fov)*.1;camera.updateProjectionMatrix();}}

/* ---------- maps ---------- */
const mini=$('#mini'),mctx=mini.getContext('2d');
function drawMap(g,size,big){
  const s=size/(L1-L0),T=v=>(v-L0)*s;
  g.fillStyle='#1f7f9c';g.fillRect(0,0,size,size);
  g.fillStyle='#ecd59f';g.fillRect(T(L0),T(L0),(L1-L0)*s,(L1-L0)*s);
  g.fillStyle='#41444b';g.fillRect(T(-RH),T(-RH),(N*B+R2)*s,(N*B+R2)*s);
  for(const b of blocks){g.fillStyle=b.kind==='park'?'#74b45c':b.place?shade(PLACES[b.place].col||'#9a9ea5',-.1):'#b9b1a2';g.fillRect(T(b.x0),T(b.y0),(b.x1-b.x0)*s,(b.y1-b.y0)*s);}
  g.textAlign='center';g.textBaseline='middle';
  for(const p of Object.values(PLACES)){const x=T(p.blk?(p.blk.x0+p.blk.x1)/2:p.ex+60),y=T(p.blk?(p.blk.y0+p.blk.y1)/2:p.ey);
    g.font=`${big?22:Math.max(9,size/14)}px sans-serif`;g.fillText(p.ic,x,y-(big?8:0));
    if(big){g.font='600 13px Kanit,sans-serif';g.lineWidth=3;g.strokeStyle='#000b';g.strokeText(p.en,x,y+16);g.fillStyle='#fff';g.fillText(p.en,x,y+16);}}
  for(const c of cars)if(c.police){g.fillStyle=(tick*4|0)%2?'#ff3b3b':'#3b7bff';g.beginPath();g.arc(T(c.x),T(c.y),big?5:3,0,7);g.fill();}
  const t=M&&M.gps?stepTarget():null;
  if(t){g.fillStyle='#ffcc4d';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.arc(T(t.x),T(t.y),big?9:5,0,7);g.fill();g.stroke();}
  const a=P.mode==='car'?P.car.a:P.a;g.save();g.translate(T(px()),T(py()));g.rotate(a);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;
  const r=big?12:7;g.beginPath();g.moveTo(r,0);g.lineTo(-r*.7,-r*.65);g.lineTo(-r*.3,0);g.lineTo(-r*.7,r*.65);g.closePath();g.stroke();g.fill();g.restore();
}
function drawMini(){
  const size=mini.clientWidth||116,d=Math.min(2,window.devicePixelRatio||1);if(mini.width!==size*d)mini.width=mini.height=size*d;
  mctx.setTransform(d,0,0,d,0,0);mctx.save();mctx.beginPath();mctx.arc(size/2,size/2,size/2,0,7);mctx.clip();
  const big=size*(L1-L0)/1500,s=big/(L1-L0);
  // rotate with heading so "up" is forward
  const a=P.mode==='car'?P.car.a:camYaw;
  mctx.translate(size/2,size/2);mctx.rotate(-a-Math.PI/2);mctx.translate(-(px()-L0)*s,-(py()-L0)*s);drawMap(mctx,big,false);mctx.restore();
}
function drawBigMap(){const c=$('#mapC'),size=Math.min(VH-90,W-40)|0,d=Math.min(2,window.devicePixelRatio||1);c.style.width=c.style.height=size+'px';c.width=c.height=size*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);drawMap(g,size,true);}

/* ---------- loop ---------- */
let last=performance.now(),mt=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&!TK)update(dt);else tick+=dt;
  camUpdate(dt);sync(dt);renderer.render(scene,camera);
  if(P.car)$('#wheelSvg').style.transform=`rotate(${drv.sw}deg)`;
  if(mode==='play'&&(mt+=dt)>.1){mt=0;drawMini();}
  if(eng){const on=S.snd&&mode==='play'&&P.car&&!paused&&drv.on;eng.o.frequency.value=22+drv.rpm/60*2*.55;eng.g.gain.value=on?.03+drv.gas*.035:0;}
  requestAnimationFrame(frame);
}
async function boot(){
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  resize();applyQuality();makeGround();makeCity();
  for(let i=0;i<14;i++)spawnTraffic(false);
  ready=true;$('#load').hidden=true;requestAnimationFrame(frame);
}
boot();
window.__game={startMission,startJobs,PLACES,P,drv,get M(){return M},lookup,MISSIONS,get cars(){return cars},get items(){return items},get wanted(){return wanted},get TK(){return TK},enterCar,leaveCar,stepTarget,showLine,shift,offerJob,get camMode(){return camMode},set camMode(v){camMode=v}};
</script>
