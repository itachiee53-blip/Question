<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07100c">
<title>Dead Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;600;800&display=swap">
<style>
:root{
  --bg:#07100c;--panel:#0f1a15e6;--line:#ffffff1f;--text:#e9e6dc;--dim:#e9e6dc99;
  --toxic:#a6e05a;--blood:#d8402f;--amber:#f2b33d;--steel:#8fa3a0;
  --f-th:"Kanit",system-ui,sans-serif;--f-disp:"Bebas Neue","Kanit",sans-serif;
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-th);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--toxic);outline-offset:2px}
button[disabled]{cursor:not-allowed;opacity:.4}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* film look */
.fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.rotate{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#070b09;color:#e8efe4;text-align:center;padding:24px}
.rotate svg{width:88px;height:88px;color:var(--toxic);animation:tilt 2.2s ease-in-out infinite}.rotate b{font-size:22px}.rotate small{font-size:14px;color:var(--dim)}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:flex}}
.fpsc{position:fixed;left:calc(8px + var(--safe-l,0px));bottom:calc(6px + var(--safe-b,0px));z-index:40;font:12px/1 monospace;color:#a6e05a;background:#000a;padding:3px 6px;border-radius:4px;pointer-events:none}
.vig{background:radial-gradient(ellipse at 50% 55%,transparent 45%,#000a 100%)}
.grain{opacity:.07;mix-blend-mode:overlay;background-size:180px 180px}
.hurt{background:radial-gradient(ellipse at 50% 50%,transparent 40%,#c0201099 100%);opacity:0;transition:opacity .25s}
.hurt.on{opacity:1;transition:none}
.bolt{background:#dfe8ff;opacity:0}.bolt.on{animation:bolt .45s}
@keyframes bolt{0%{opacity:.75}15%{opacity:.1}25%{opacity:.55}100%{opacity:0}}
.slow{background:radial-gradient(ellipse at 50% 50%,transparent 35%,#2a6aa088 100%);mix-blend-mode:screen;animation:beat .9s infinite}
.danger{background:radial-gradient(ellipse at 50% 50%,transparent 50%,#a0100c66 100%);animation:beat 1s infinite}
@keyframes beat{50%{opacity:.35}}

/* zombie word tags */
#tags{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px 6px;border-radius:8px;background:#0b120fcc;border:1px solid #ffffff22;box-shadow:0 6px 18px #0008;white-space:nowrap;will-change:transform}
.tag .th{font-size:20px;font-weight:600;line-height:1.1;color:#fff}
.tag .en{display:flex;gap:2px;font-family:var(--f-disp);font-size:20px;letter-spacing:1px;line-height:1}
.tag .en i{font-style:normal;min-width:11px;text-align:center;color:#ffffff55;border-bottom:2px solid #ffffff44}
.tag .en i.on{color:var(--toxic);border-color:var(--toxic)}
.tag .en i.sp{border:0;min-width:8px}
.tag .pips{display:flex;gap:4px}.tag .pips b{width:7px;height:7px;border-radius:50%;background:var(--blood)}.tag .pips b.off{background:#fff3}
.tag.tgt{background:#1a2a12ee;border-color:var(--toxic);box-shadow:0 0 0 2px #a6e05a55,0 8px 24px #000a}
.tag.tgt::after{content:"";position:absolute;bottom:-9px;left:50%;width:12px;height:12px;background:inherit;border-right:1px solid var(--toxic);border-bottom:1px solid var(--toxic);transform:translateX(-50%) rotate(45deg)}
.tag.near{border-color:var(--blood)}
.tag.dead{opacity:0;transition:opacity .3s}
.tag .kind{font-size:11px;font-weight:600;letter-spacing:.5px;padding:0 6px;border-radius:4px;line-height:16px}
.tag.gold{border-color:#f2b33d;background:#2a2108ee}.tag.gold .kind{background:#f2b33d;color:#2a1a00}
.tag.bloat{border-color:#8fe05a}.tag.bloat .kind{background:#6fd04a;color:#0f2a05}
.tag.beast{border-color:#ff9a3a}.tag.beast .kind{background:#ff9a3a;color:#2a1000}
.tag.armor{border-color:#9fb3c8}.tag.armor .kind{background:#9fb3c8;color:#111}
.tag.scream{border-color:#ff6a5a}.tag.scream .kind{background:#e2463d;color:#fff}
.ptag{position:absolute;left:0;top:0;z-index:1;pointer-events:auto;cursor:pointer;padding:4px 10px;border-radius:999px;font-family:var(--f-th);font-size:14px;color:#fff;background:#d8402fdd;border:1px solid #ffb09a;box-shadow:0 0 0 0 #d8402f88;animation:ping 1.4s infinite}
.ptag.barrel{width:30px;height:30px;padding:0;display:grid;place-items:center;background:#d8402fb0;opacity:.85}.ptag.barrel svg{width:16px;height:16px}
.ptag.med{background:#2f8f4fdd;border-color:#a6e05a}
.ptag b{font-weight:600}
@keyframes ping{70%{box-shadow:0 0 0 12px #d8402f00}}
.tag.hit{animation:tagHit .18s}
@keyframes tagHit{40%{transform:var(--tf) scale(1.08)}}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:flex-start;gap:12px;padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));pointer-events:none}
.hud>*{pointer-events:auto}
.iconbtn{width:42px;height:42px;border-radius:10px;background:#0b120fb3;border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.hinfo{display:flex;flex-direction:column;line-height:1.15}
.hinfo b{font-family:var(--f-disp);font-size:24px;font-weight:400;letter-spacing:1px}
.hinfo small{font-size:13px;color:var(--dim)}
.wall{flex:1;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.wall .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.wall .bar{height:12px;border-radius:6px;background:#0008;border:1px solid var(--line);overflow:hidden}
.wall .bar i.sh{background:linear-gradient(90deg,#5ab0ff,#bfe3ff);box-shadow:0 0 10px #5ab0ff}
.wall .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c9381f,#f2b33d 55%,#a6e05a);transition:width .2s}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{font-family:var(--f-disp);font-size:28px;line-height:1;letter-spacing:1px}
.combo{font-family:var(--f-disp);font-size:22px;color:var(--amber);line-height:1}
.combo.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.bossbar{position:fixed;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:5px 14px;border-radius:999px;background:#2a0808cc;border:1px solid #d8402f88;pointer-events:none}
.bossbar b{font-size:14px;color:#ffb8a8;font-weight:600}.bossbar span{display:flex;gap:4px}.bossbar i{width:18px;height:6px;border-radius:3px;background:var(--blood)}.bossbar i.off{background:#ffffff22}
.opbar{position:fixed;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:5px 14px;border-radius:999px;background:#0b1a10cc;border:1px solid #a6e05a66;pointer-events:none;font-family:var(--f-th);white-space:nowrap}
.opbar b{font-size:14px;color:#cdeea0;font-weight:600}.opbar small{font-size:13px;color:#e8efe4}.opp{width:clamp(80px,22vw,200px);height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden}.opp i{display:block;height:100%;width:0;background:#a6e05a;transition:width .3s}
.opbar.stop{border-color:#d8402f}.opbar.stop small{color:#ff9a8a}.opbar.stop .opp i{background:#d8a02f}
.ptag.surv{background:#2f7a3add;border-color:#a6e05a;animation:none;pointer-events:none}.ptag.surv.danger{background:#d8402fee;border-color:#ffb09a;animation:ping 1s infinite}.ptag.surv.lost{background:#333c;border-color:#666}
.chip.op{border-color:var(--amber);color:var(--amber)}
.nt.op b{color:var(--amber)}.nt{position:relative}.nt .nw{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--amber);color:#1a1405;font-family:var(--f-th)}
.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:9;text-align:center;pointer-events:none}
.banner b{display:block;font-family:var(--f-disp);font-size:clamp(44px,9vw,88px);font-weight:400;letter-spacing:3px;line-height:.9;color:#fff;text-shadow:0 4px 30px #000}
.banner small{font-size:18px;color:var(--dim)}
.banner.show{animation:ban 2.2s forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-40%) scale(1.1)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.float{position:fixed;z-index:9;pointer-events:none;font-family:var(--f-disp);font-size:26px;letter-spacing:1px;transform:translate(-50%,-50%);animation:fl 1s forwards;text-shadow:0 2px 8px #000}
@keyframes fl{to{transform:translate(-50%,-160%);opacity:0}}

/* bottom: items + letter pad */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:flex-end;gap:10px;padding:10px calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l));background:linear-gradient(transparent,#000c 45%)}
.items{display:flex;gap:8px;flex:none}
.item{position:relative;width:50px;height:50px;border-radius:12px;background:#0b120fd9;border:1px solid var(--line);display:grid;place-items:center}
.item svg{width:26px;height:26px}
.item b{position:absolute;right:-5px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--amber);color:#111;font-size:13px;font-weight:600;display:grid;place-items:center}
.item.ammo{width:auto;min-width:84px;padding:0 8px 0 4px;flex-direction:row;gap:4px;font-family:var(--f-disp);font-size:20px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.item.ammo img{width:40px;height:40px;object-fit:contain;margin:-4px 0}
.item.ammo i{position:absolute;left:6px;right:6px;bottom:5px;height:3px;border-radius:2px;background:var(--amber);width:auto;max-width:calc(100% - 12px)}
.item.ammo.low span{color:var(--blood)}.item.ammo.rl span{color:var(--dim)}.item.ammo.rl i{background:#5ab0ff}
.item.ammo.nope{animation:shake .3s}
.item.knife{--cd:0;background:conic-gradient(#0008 calc(var(--cd)*360deg),transparent 0),#0b120fd9}
.item.knife.ready{border-color:#ffffff66}
.slashfx{background:linear-gradient(160deg,transparent 46%,#ffffffcc 49%,#ffffff 50%,#ffffffcc 51%,transparent 54%);opacity:0;transform:translateX(-40%)}
.slashfx.on{animation:slashA .28s ease-out}
.slashfx.chop{background:linear-gradient(90deg,transparent 46%,#ffffffcc 49%,#fff 50%,#ffffffcc 51%,transparent 54%)}.slashfx.chop.on{animation:chopA .25s ease-out}
@keyframes chopA{0%{opacity:.9;transform:translateY(-40%)}100%{opacity:0;transform:translateY(40%)}}
.slashfx.sweep{background:linear-gradient(180deg,transparent 47%,#d8c0ffcc 49%,#fff 50%,#d8c0ffcc 51%,transparent 53%)}
@keyframes slashA{0%{opacity:.9;transform:translateX(-40%)}100%{opacity:0;transform:translateX(40%)}}
.pad{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g,8px);min-height:50px;align-content:flex-end}
.key{width:var(--k,52px);height:var(--k,52px);border-radius:10px;background:linear-gradient(#2a3530,#1a2320);border:1px solid #ffffff2a;border-bottom:4px solid #0a0f0d;font-family:var(--f-disp);font-size:calc(var(--k,52px)*.56);letter-spacing:0;display:grid;place-items:center;color:#f2efe6;text-transform:uppercase;transition:transform .05s}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.used{visibility:hidden}
.pad.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pad.jam .key{filter:grayscale(1) brightness(.6)}
.pad.choice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:900px;margin:0 auto}
.opt{position:relative;min-height:54px;padding:6px 10px;border-radius:12px;background:linear-gradient(#26322c,#18211d);border:1px solid #ffffff2a;border-bottom:4px solid #0a0f0d;font-family:var(--f-disp);font-size:clamp(20px,2.6vw,28px);letter-spacing:1px;line-height:1.05;color:#f2efe6;overflow-wrap:anywhere}
.opt small{position:absolute;left:7px;top:4px;font-family:var(--f-th);font-size:11px;color:#fff6;letter-spacing:0}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt[disabled]{opacity:.25;text-decoration:line-through}
.seg{display:inline-flex;margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:3px;background:#0006}
.seg button{padding:6px 16px;border-radius:999px;font-size:15px;color:var(--dim)}
.seg button small{margin-left:6px;font-size:12px;opacity:.7}
.seg button[aria-pressed="true"]{background:var(--toxic);color:#10170c;font-weight:600}
@media (max-width:560px){.pad.choice{grid-template-columns:1fr 1fr}.opt{min-height:46px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:999px;font-size:13px;background:#ffffff12;border:1px solid var(--line)}
.chip.warn{background:#d8402f22;border-color:#d8402f88;color:#ffb8a8}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.perk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:#ffffff0a;text-align:center;transition:transform .12s,background .12s}
.perk:hover{background:#a6e05a18;transform:translateY(-3px)}
.perk .ic{width:52px;height:52px;border-radius:50%;background:#0006;display:grid;place-items:center}.perk .ic svg{width:28px;height:28px;color:var(--toxic)}
.perk b{font-size:17px}.perk small{font-size:13px;color:var(--dim);line-height:1.35}
.rank{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.rank b{font-size:16px;color:var(--amber)}
.rbar{flex:1;min-width:90px;max-width:220px;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;display:block}.rbar i{display:block;height:100%;background:var(--toxic)}
.rank small{font-size:12px;color:var(--dim)}
.mbtn.hot{border-color:#f2b33d88;box-shadow:0 0 0 2px #f2b33d33}
.dlist{display:flex;flex-direction:column;gap:8px}
.dq{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#ffffff08}
.dq .tx{flex:1;display:flex;flex-direction:column;gap:5px}.dq .tx b{font-weight:400;font-size:16px}.dq .tx small{font-size:12px;color:var(--dim)}.dq .rbar{max-width:none;flex:none;width:100%}
.dq.claimed{opacity:.5}
.adrrow{display:flex;align-items:center;gap:6px;margin-top:1px}.adrl{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:#8ec8ff;white-space:nowrap}.adrl svg{width:11px;height:11px}.adrrow small{font-size:11px;color:var(--dim);min-width:26px;text-align:right}.adrrow.full .adrl,.adrrow.full small{color:#a6e05a}
.adrbar{flex:1;height:5px;border-radius:3px;background:#ffffff1a;overflow:hidden}.adrbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ab0ff,#a6e05a);transition:width .2s}
@media (max-width:560px){.perks{grid-template-columns:1fr}}
@media (orientation:landscape) and (max-height:520px){.perk{padding:10px 8px}.perk .ic{width:40px;height:40px}.rank{margin-top:6px}}
.cut{position:fixed;inset:0;z-index:30}
.cut .lb{position:absolute;left:0;right:0;height:13vh;background:#000;transition:transform .5s}.cut .lb.t{top:0}.cut .lb.b{bottom:0}
.cut.in .lb.t{transform:translateY(-100%)}.cut.in .lb.b{transform:translateY(100%)}
.csub{position:absolute;left:50%;bottom:calc(13vh + 14px);transform:translateX(-50%);width:min(760px,92vw);padding:12px 18px;border-radius:12px;background:#000b;border:1px solid var(--line);font-size:18px;line-height:1.5;min-height:72px}
.csub b{display:block;font-size:14px;color:var(--toxic);font-weight:600}.csub b:empty{display:none}
.csub small{position:absolute;right:12px;bottom:6px;font-size:11px;color:#fff6}
.cname{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-disp);font-size:clamp(48px,10vw,96px);letter-spacing:4px;color:#ff6a4a;text-shadow:0 6px 30px #000;opacity:0;transform:scale(1.2);transition:opacity .4s,transform .6s}
.cname.on{opacity:1;transform:scale(1)}.cname small{display:block;font-family:var(--f-th);font-size:16px;letter-spacing:0;color:#fffb}
.cskip{position:absolute;right:calc(14px + var(--safe-r));top:calc(13vh + 10px);padding:6px 14px;border-radius:999px;background:#000a;border:1px solid var(--line);font-size:14px;color:#fffc}
.mg{width:min(760px,100%);align-items:center;text-align:center}
.mg h2{margin:0;font-family:var(--f-disp);font-size:40px;letter-spacing:2px;font-weight:400}
.mgbar{width:100%;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden}.mgbar i{display:block;height:100%;background:var(--amber);transition:width .1s linear}
.mgcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;width:100%}
.mg{max-height:100%;overflow:auto}
@media (orientation:landscape) and (max-height:520px){.mg h2{font-size:30px}.mgb{min-height:38px;padding:6px 10px}.mgcols{gap:6px 16px}.mgbig{font-size:34px}.mgrow .btn{padding:10px}}
.mgb{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#ffffff0d;font-size:18px;min-height:46px}
.mgb.en{font-family:var(--f-disp);font-size:24px;letter-spacing:1px}
.mgb.sel{border-color:var(--amber);background:#f2b33d22}.mgb.ok{border-color:var(--toxic);background:#a6e05a22;opacity:.5;pointer-events:none}.mgb.bad{animation:shake .3s;border-color:var(--blood)}
.mgslots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:52px}
.mgslots i{width:40px;height:48px;border-bottom:3px solid #fff5;font-family:var(--f-disp);font-size:32px;font-style:normal;display:grid;place-items:center}
.mgkeys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mgkeys .key{--k:50px}
.mgbig{font-family:var(--f-disp);font-size:clamp(34px,7vw,56px);letter-spacing:2px;line-height:1.1}
.mgbig small{display:block;font-family:var(--f-th);font-size:22px;letter-spacing:0;color:var(--dim)}
.mgrow{display:flex;gap:12px;justify-content:center;width:100%}.mgrow .btn{flex:1;max-width:220px;font-size:22px;padding:14px}
.mgcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
@media (max-width:560px){.mgcards{grid-template-columns:1fr}}
.jamtag{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:9;font-family:var(--f-disp);font-size:30px;letter-spacing:2px;color:var(--blood);text-shadow:0 2px 10px #000;pointer-events:none}

/* menus */
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));background:linear-gradient(90deg,#000c,#0006 60%,#0003)}
.scr.solid{background:#000b}
.card{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 60px #000c;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:in .25s}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.card>*{flex-shrink:0}.card>.scroll{flex-shrink:1}
.it .ic img{width:100%;height:100%;object-fit:contain}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:34px;letter-spacing:2px;line-height:1}
.top .sp{flex:1}

const PER_NIGHT=10;
// each zone splits its word list into nights of 10 words, keeping topics together
for(const k of ORDER){
  const nights=[];
  for(const [unit,ws] of (WORDS[k]||[])){
    for(let i=0;i<ws.length;i+=PER_NIGHT){
      const chunk=ws.slice(i,i+PER_NIGHT).map(([en,th])=>({en,th}));
      if(chunk.length<5&&nights.length&&nights[nights.length-1].unit===unit)nights[nights.length-1].words.push(...chunk);
      else nights.push({unit,words:chunk});
    }
  }
  ZONES[k].nights=nights;
  ZONES[k].words=nights.flatMap(n=>n.words);
}

  for(let i=list.length-1;i>=0;i--){const o=list[i],u=o.userData;
    if(!lightAttached(o)){u.off=(u.off||0)+1;if(u.off>90)list.splice(i,1);continue;}u.off=0;
    if(o.intensity<=0)continue;o.getWorldPosition(u.wp||(u.wp=new THREE.Vector3()));const d=u.wp.distanceTo(_lf),r=o.distance||20;
    if(d>r+40)continue;c.push([o.intensity/(1+d*d/(r*r)),o]);}

    l.color.copy(o.color);l.intensity=o.intensity;l.distance=o.distance;l.decay=o.decay;l.position.copy(o.userData.wp);

// the kit models store positions as compressed integers; moving them into world space needs real floats
function floatAttr(a){if(a.array instanceof Float32Array&&!a.normalized&&!a.isInterleavedBufferAttribute)return a.clone();
  const s=a.itemSize,f=new Float32Array(a.count*s),get=[a.getX,a.getY,a.getZ,a.getW];
  for(let i=0;i<a.count;i++)for(let k=0;k<s;k++)f[i*s+k]=get[k].call(a,i);return new THREE.BufferAttribute(f,s);}
function mergeStatic(root){
  root.updateMatrixWorld(true);const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(),groups=new Map();
  const add=(o,g,material)=>{const key=material.uuid+'|'+(g.index?1:0)+'|'+Object.keys(g.attributes).sort().map(n=>n+g.attributes[n].itemSize).join(',');
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push({o,g,material});};
  root.traverse(o=>{if(!o.isMesh||o.isSkinnedMesh||o.isInstancedMesh||!o.visible)return;
    for(let q=o;q&&q!==root;q=q.parent)if(q.userData.keep)return;
    if(Array.isArray(o.material)){const ng=o.geometry.index?o.geometry.toNonIndexed():o.geometry;if(!ng.groups.length)return;
      for(const gr of ng.groups){const sub=new THREE.BufferGeometry();for(const n of Object.keys(ng.attributes)){const a=floatAttr(ng.attributes[n]),s=a.itemSize;sub.setAttribute(n,new THREE.BufferAttribute(a.array.slice(gr.start*s,(gr.start+gr.count)*s),s));}

    const g=o.geometry;if(g.morphAttributes&&Object.keys(g.morphAttributes).length)return;
    add(o,g,o.material);});
  const m4=new THREE.Matrix4();

  const pending=new Map();for(const list of groups.values())for(const it of list)pending.set(it.o,(pending.get(it.o)||0)+1);
  const done=new Map();
  for(const list of groups.values()){if(list.length<2&&!Array.isArray(list[0].o.material))continue;
    const geos=list.map(({o,g})=>{const c=g.clone();for(const n of Object.keys(c.attributes))c.setAttribute(n,floatAttr(c.attributes[n]));c.applyMatrix4(m4.multiplyMatrices(inv,o.matrixWorld));return c;});
    let merged=null;try{merged=mergeGeometries(geos,false);}catch(e){}

    root.add(new THREE.Mesh(merged,list[0].material));
    for(const {o} of list){const n=(done.get(o)||0)+1;done.set(o,n);if(n===pending.get(o))o.parent&&o.parent.remove(o);}}
}

function takeWord(short=false){

  const ok=w=>!onScreen.has(w.en)&&(!short||w.en.replace(/[^a-z]/gi,'').length<=6);
  // new words come first and repeat; older words from earlier nights mix in as review
  let src=G.old.length&&Math.random()<.28?G.old:G.fresh;
  let c=src.filter(ok);if(!c.length)c=G.fresh.filter(ok);if(!c.length)c=[...G.fresh,...G.old].filter(w=>!onScreen.has(w.en));if(!c.length)c=G.fresh;
  // least-used first so every new word appears
  c.sort((a,b)=>(G.used.get(a.en)||0)-(G.used.get(b.en)||0));

}

  const prev=state;state='cut';$('#hud').hidden=true;$('#dock').hidden=true;tagsEl.style.visibility='hidden';if(gunObj)gunObj.visible=false;
  const el=$('#cut');el.hidden=false;el.classList.add('in');void el.offsetWidth;el.classList.remove('in');
  CUT={cam,t:0,i:-1,lines,then,prev,typing:null};
  const cn=$('#cName');cn.classList.remove('on');cn.innerHTML=name?esc(name)+(sub?`<small>${esc(sub)}</small>`:''):'';if(name)setTimeout(()=>cn.classList.add('on'),400);
  $('#cSub').style.display=lines.length?'':'none';
  nextLine();
  if(!lines.length)CUT.auto=setTimeout(endCut,(cam?cam.dur:2.5)*1000+600);
}
function nextLine(){
  if(!CUT)return;clearInterval(CUT.typing);
  const L=CUT.lines;if(CUT.i>=0&&CUT.shown<L[CUT.i].txt.length){CUT.shown=L[CUT.i].txt.length;$('#cTxt').textContent=L[CUT.i].txt;return;}
  CUT.i++;if(CUT.i>=L.length){if(L.length)endCut();return;}
  const ln=L[CUT.i];$('#cWho').textContent=ln.who||'';$('#cTxt').textContent='';CUT.shown=0;SFX.radio();
  CUT.typing=setInterval(()=>{if(!CUT)return;CUT.shown++;$('#cTxt').textContent=ln.txt.slice(0,CUT.shown);if(CUT.shown>=ln.txt.length)clearInterval(CUT.typing);},28);
}
function endCut(){
  if(!CUT)return;const c=CUT;CUT=null;clearInterval(c.typing);clearTimeout(c.auto);
  const el=$('#cut');el.classList.add('in');setTimeout(()=>{el.hidden=true;},450);$('#cName').classList.remove('on');
  tagsEl.style.visibility='';if(gunObj)gunObj.visible=true;
  if(G&&!G.ended){state='play';$('#hud').hidden=false;$('#dock').hidden=false;last=performance.now();}
  c.then&&c.then();
}
$('#cut').addEventListener('pointerdown',e=>{if(e.target.id==='cSkip')return;nextLine();});
$('#cSkip').addEventListener('click',()=>{if(CUT){CUT.lines=[];endCut();}});

/* ---------------- mini games between waves ---------------- */
// two words clash when they share any Thai meaning ('การแข่งขัน, ไม้ขีดไฟ' vs 'การแข่งขัน, เชื้อชาติ')
const MEAN=th=>th.split(', ');
const clash=(a,b)=>a.en===b.en||MEAN(a.th).some(m=>MEAN(b.th).includes(m));
function mgPool(n){const ws=shuffle([...G.fresh,...G.old.slice(0,10)]);const out=[];for(const w of ws){if(out.some(o=>clash(o,w)))continue;out.push(w);if(out.length>=n)break;}return out;}
function mgTimer(sec,onEnd){const t0=performance.now();const iv=setInterval(()=>{const k=1-(performance.now()-t0)/1000/sec;const bar=$('#mgT');if(bar)bar.style.width=Math.max(0,k*100)+'%';if(k<=0){clearInterval(iv);onEnd();}},100);return ()=>clearInterval(iv);}
function mgReward(ok,total,title){
  const good=ok/total>=.75;let rew='';
  G.bonusCoins+=ok*4;
  if(good){const pk=pick(PERKS.filter(p=>!p.ok||p.ok()));pk.f();rew=`<br>ได้รางวัล: <b style="color:var(--toxic)">${pk.n}</b>`;SFX.win();}else SFX.perk();
  show(`<div class="card res mg"><h2>${title}</h2><div class="mgbig">${ok}/${total}<small>ถูก · +${ok*4} เหรียญ${rew}</small></div><button class="btn main" type="button" id="mgGo">สู้ต่อ</button></div>`,'solid');
  $('#mgGo').onclick=()=>{scr.hidden=true;state='play';last=performance.now();hud();nextWave();};
}
function mgMark(w,ok){if(ok)G.hit.add(w.en);else G.miss.add(w.en);}
// 1) match wires: connect English to Thai
function mgMatch(){
  const ws=mgPool(4);const th=shuffle(ws);let sel=null,ok=0,done=0;
  show(`<div class="card res mg"><h2>ต่อสายวิทยุ</h2><div class="zinfo">จับคู่คำอังกฤษกับความหมาย ก่อนหมดเวลา</div><div class="mgbar"><i id="mgT"></i></div>
    <div class="mgcols">${ws.map((w,i)=>`<button class="mgb en" type="button" data-l="${i}">${esc(w.en)}</button><button class="mgb" type="button" data-r="${ws.indexOf(th[i])}">${esc(th[i].th)}</button>`).join('')}</div></div>`,'solid');
  const stop=mgTimer(22,()=>finish());
  const finish=()=>{stop();ws.forEach(w=>{if(!G.hit.has(w.en))mgMark(w,false);});mgReward(ok,ws.length,'ต่อสายวิทยุ');};
  scr.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{scr.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l;SFX.ui();speak(ws[sel].en);});
  scr.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(sel==null)return;const r=+b.dataset.r,L=scr.querySelector(`[data-l="${sel}"]`);
    if(r===sel){L.classList.add('ok');b.classList.add('ok');ok++;done++;mgMark(ws[r],true);SFX.coin();}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');mgMark(ws[sel],false);SFX.jam();done+=0;}
    L.classList.remove('sel');sel=null;if(ok===ws.length)finish();});
}
// 2) code lock: spell the word from scrambled letters
function mgCode(){
  const ws=mgPool(6).filter(w=>/^[a-z]{3,8}$/i.test(w.en)).slice(0,3);if(ws.length<2)return mgTrue();
  let k=0,ok=0,cur='',over=false;
  const stop=mgTimer(30,()=>{over=true;mgReward(ok,ws.length,'ปลดล็อกลังเสบียง');});
  const draw=()=>{if(over)return;const w=ws[k],en=w.en.toLowerCase();
    show(`<div class="card res mg"><h2>ปลดล็อกลังเสบียง</h2><div class="zinfo">รหัสที่ ${k+1}/${ws.length} · สะกดคำที่แปลว่า</div><div class="mgbar"><i id="mgT"></i></div>
      <div class="mgbig">${esc(w.th)}</div><div class="mgslots">${[...en].map((c,i)=>`<i>${i<cur.length?cur[i].toUpperCase():''}</i>`).join('')}</div>
      <div class="mgkeys">${shuffle([...en]).map((c,i)=>`<button class="key" type="button" data-c="${c}" data-i="${i}">${c}</button>`).join('')}</div></div>`,'solid');
    scr.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;
      if(en[cur.length]===c){cur+=c;b.classList.add('used');SFX.key();scr.querySelectorAll('.mgslots i')[cur.length-1].textContent=c.toUpperCase();
        if(cur===en){ok++;mgMark(w,true);SFX.coin();speak(w.en);next();}}
      else{SFX.jam();mgMark(w,false);const s2=scr.querySelector('.mgslots');s2.classList.remove('bad');s2.style.animation='none';void s2.offsetWidth;s2.style.animation='shake .3s';}});};
  const next=()=>{k++;cur='';if(k>=ws.length){over=true;stop();setTimeout(()=>mgReward(ok,ws.length,'ปลดล็อกลังเสบียง'),400);}else setTimeout(draw,350);};
  draw();
}
// 3) true or false rush
function mgTrue(){
  const ws=mgPool(10);let ok=0,n=0,cur=null,truth=false,over=false;
  const stop=mgTimer(18,()=>{over=true;mgReward(ok,Math.max(n,1),'ตรวจสอบเสบียง');});
  const draw=()=>{if(over)return;const w=ws[n%ws.length];truth=Math.random()<.5;const others=ws.filter(o=>!clash(o,w));if(!others.length)truth=true;const shown=truth?w:pick(others);cur=w;
    show(`<div class="card res mg"><h2>ตรวจสอบเสบียง</h2><div class="zinfo">ป้ายตรงกันไหม ตอบให้ได้มากที่สุด · ถูก ${ok}</div><div class="mgbar"><i id="mgT"></i></div>
      <div class="mgbig">${esc(w.en)}<small>= ${esc(shown.th)} ?</small></div>
      <div class="mgrow"><button class="btn main" type="button" id="mgY">ถูก</button><button class="btn red" type="button" id="mgN">ผิด</button></div></div>`,'solid');
    const ans=a=>{n++;if(a===truth){ok++;mgMark(cur,true);SFX.coin();}else{mgMark(cur,false);SFX.jam();}draw();};
    $('#mgY').onclick=()=>ans(true);$('#mgN').onclick=()=>ans(false);};
  draw();
}
// 4) listen and pick: hear the English word, choose its meaning
function mgListen(){
  if(!('speechSynthesis' in window))return mgMatch();
  const ws=mgPool(8);let k=0,ok=0;const R=5;
  const draw=()=>{const w=ws[k],opts=shuffle([w,...shuffle(ws.filter(x=>x!==w)).slice(0,2)]);
    show(`<div class="card res mg"><h2>ดักฟังวิทยุ</h2><div class="zinfo">ฟังคำที่ได้ยิน แล้วเลือกความหมาย · ${k+1}/${R}</div>
      <button class="btn" type="button" id="mgSay">${SV.say.replace('<svg','<svg style="width:20px;height:20px"')}ฟังอีกครั้ง</button>
      <div class="mgcards">${opts.map((o,i)=>`<button class="mgb" type="button" data-o="${i}">${esc(o.th)}</button>`).join('')}</div></div>`,'solid');
    const sayIt=()=>{const o=P.opts.voice;P.opts.voice=true;speak(w.en);P.opts.voice=o;};setTimeout(sayIt,250);$('#mgSay').onclick=sayIt;
    scr.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;scr.querySelectorAll('[data-o]').forEach(x=>x.dataset.done=1);const right=opts[+b.dataset.o]===w;b.classList.add(right?'ok':'bad');if(right){ok++;SFX.coin();}else SFX.jam();mgMark(w,right);
      setTimeout(()=>{k++;if(k>=R)mgReward(ok,R,'ดักฟังวิทยุ');else draw();},right?350:700);});};

/* ---------------- adrenaline: a streak of right answers slows time ---------------- */
const ADR_NEED=8;
function adrenaline(){G.slow=6;G.adr=0;banner('ADRENALINE','ซอมบี้ช้าลง 6 วินาที');SFX.adr();quest('adr');$('#slowfx').hidden=false;}

/* ---------------- ammo ---------------- */
function startReload(){
  if(!G||G.reloadT>0||G.ammo>=G.mag)return;const g=GUNS[P.gun];
  if(G.op==='ammo'&&G.pool<=0){if(G.ammo<=0&&G.t-(G.ammoTip??-9)>4){G.ammoTip=G.t;toast('กระสุนหมด! ปัดหน้าจอใช้อาวุธระยะประชิด หรือแตะลังกระสุน');}return;}
  G.reloadT=g.reload;sample(g.rs,.9,{offset:g.rs==='reload_shotgun'?0:.35,dur:g.reload+.2})||SFX.jam();
  if(gunObj)gunObj.userData.dip=1;hud();
}
function canShoot(){
  if(G.op==='ammo'&&G.ammo<=0&&G.pool<=0){SFX.click();startReload();return false;}
  if(G.ammo<=0&&G.reloadT<=0)startReload();
  if(G.reloadT>0){SFX.click();const t=$('#ammoBtn');t.classList.remove('nope');void t.offsetWidth;t.classList.add('nope');return false;}
  return true;
}

/* ---------------- targeting & shooting ---------------- */
function nearest(){let b=null;for(const z of live())if(!b||z.z>b.z)b=z;return b;}
function setTarget(z){if(target===z)return;target=z;if(z&&G&&z.tgtAt==null)z.tgtAt=G.t;for(const o of zombies)o.tag&&o.tag.classList.toggle('tgt',o===z);renderPad();}
function autoFirst(z){const i=needIdx(z);if(i<curWord(z).en.length)z.p=i+1;skipNon(z);}
function skipNon(z){const w=curWord(z).en.toLowerCase();while(z.p<w.length&&!isL(w[z.p]))z.p++;}
function press(ch,fromKey){
  if(state!=='play'||!G)return;
  if(G.t<jamUntil){SFX.jam();return;}
  if(!canShoot())return;
  if(!target||target.dead)setTarget(nearest());
  const z=target;if(!z)return;
  const w=curWord(z).en.toLowerCase(),i=needIdx(z);
  if(w[i]===ch){
    if(blockedBySurvivor(z))return;
    z.p=i+1;skipNon(z);consumeKey(ch);shoot(z,1);
    if(z.p>=w.length)wordDone(z);else{renderTag(z);bumpTag(z);}
  }else wrong(z,ch);
}
function consumeKey(ch){const k=[...$('#pad').querySelectorAll('.key:not(.used)')].find(b=>b.dataset.k===ch);if(k)k.classList.add('used');}
function wrong(z){
  G.mash=G.t-G.lastWrong<3?G.mash+1:1;G.lastWrong=G.t;
  const m=Math.min(G.mash,4),dur=[0,.6,1,1.5,2][m]*(1-.2*P.up.oil);
  jamUntil=G.t+dur;if(G.op==='ammo'&&G.ammo>0){G.ammo--;floatAt0('-1 นัด');}G.combo=0;G.adr=Math.max(0,G.adr-2);G.wrongs++;G.miss.add(curWord(z).en);z.miss=true;
  G.score=Math.max(0,G.score-5*m);
  SFX.jam();try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  const pad=$('#pad');pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake','jam');
  $('#jamTag').hidden=false;$('#jamTag').textContent=m>=3?'อย่ากดมั่ว!':'ปืนติด!';
  hud();
}
function wordDone(z){
  const w=curWord(z);G.hit.add(w.en);
  G.combo++;G.best=Math.max(G.best,G.combo);quest('words');quest('combo',G.combo);G.xp+=2;
  if(G.slow<=0){G.adr++;if(G.adr>=ADR_NEED)adrenaline();}
  let pts=10+w.en.length*2+Math.min(G.combo,20);
  // answering quickly after taking aim counts as a headshot
  const took=G.t-(z.tgtAt??G.t),fast=GUNS[P.gun].head||took<=(CHOICE()?2.2:1+.45*w.en.replace(/[^a-z]/gi,'').length);z.tgtAt=G.t;
  if(fast&&!z.T.boss){pts*=2;G.heads++;G.bonusCoins+=2;quest('head');setTimeout(()=>{SFX.head();floatAt(z,'HEADSHOT','#ff6a5a');},G.pendingImpact*1000);}
  G.score+=pts;floatAt(z,'+'+pts,'#a6e05a');
  speak(w.en);
  if(z.wi<z.words.length-1){if(z.T.lavaBoss){const x=z.obj.position.x,zz=z.obj.position.z;lavaPatch(x,zz);SFX.roar();for(const o of live())if(o!==z&&Math.hypot(o.obj.position.x-x,o.obj.position.z-zz)<4)o.rage=4;}if(z.gear)dropGear(z);z.wi++;z.p=0;z.opts=null;if(GUNS[P.gun].auto1&&!CHOICE())autoFirst(z);renderTag(z);bumpTag(z);z.obj.position.z-=.8;play(z,'HitReact',false,.05);z.hitT=.5;renderPad();hud();return;}
  kill(z,true);
}
function kill(z,byWord){
  z.dead=true;G.kills++;quest('kills');G.xp+=1;
  if(z.twin&&!z.twin.dead){z.twin.rage=999;floatAt(z.twin,'โกรธจัด!','#ff6a5a');SFX.roar();}
  z.dieT=0;z.dieDelay=byWord?G.pendingImpact:0;if(z.dieDelay<=0)play(z,'Death',false,.1);
  if(z.T.loot&&byWord!==null){G.bonusCoins+=z.T.loot;setTimeout(()=>{SFX.coin();floatAt(z,'+'+z.T.loot+' เหรียญ','#f2b33d');},z.dieDelay*1000);}
  if(z.T.puddle){const x=z.obj.position.x,zz=z.obj.position.z;setTimeout(()=>{if(G&&!G.ended)puddle(x,zz);},z.dieDelay*1000+300);}
  if(z.T.boom)setTimeout(()=>{if(G&&!G.ended)bloat(z,false);},z.dieDelay*1000+150);
  z.tag&&z.tag.classList.add('dead');

function stepFx(dt){
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;const k=Math.max(0,f.life/f.max);
    if(f.kind==='bullet'){f.t+=dt;const k2=Math.min(1,f.t/f.dur);f.o.position.lerpVectors(f.from,f.to,k2);
      const tail=f.from.clone().lerp(f.to,Math.max(0,k2-3/Math.max(1,f.from.distanceTo(f.to)))),len=Math.max(.01,tail.distanceTo(f.o.position));
      f.trail.position.lerpVectors(tail,f.o.position,.5);f.trail.lookAt(f.o.position);f.trail.scale.set(f.trail.userData.w,f.trail.userData.w,len);
      if(k2>=1&&!f.done){f.done=true;f.o.visible=false;f.onHit&&f.onHit();}f.trail.material.opacity=k2>=1?.75*k:.75;
      if(f.life<=0){scene.remove(f.o);scene.remove(f.trail);f.trail.material.dispose();f.o.children.forEach(c=>c.material.dispose());fx.splice(i,1);}continue;}
    if(f.kind==='thrown'){f.t+=dt;const k2=Math.min(1,f.t/f.dur);f.o.position.lerpVectors(f.from,f.to,k2);if(f.spin)f.o.rotateX(-dt*22);
      if(k2>=1&&!f.done){f.done=true;f.onHit&&f.onHit();}if(f.life<=0){scene.remove(f.o);fx.splice(i,1);}continue;}
    if(f.kind==='ring'){const k3=1-f.life/f.max;f.o.scale.setScalar(1+k3*6);f.o.material.opacity=.8*(1-k3);if(f.life<=0){scene.remove(f.o);f.o.geometry.dispose();f.o.material.dispose();fx.splice(i,1);}continue;}
    if(f.kind==='puddle'){f.o.material.opacity=.55*Math.min(1,f.life);if(f.life<=0){scene.remove(f.o);const k=PUDDLES.indexOf(f.pd);if(k>=0)PUDDLES.splice(k,1);fx.splice(i,1);}continue;}
    if(f.kind==='debris'){f.v.y-=9.8*dt;f.o.position.addScaledVector(f.v,dt);f.o.rotation.x+=f.spin*dt;if(f.life<.4)f.o.scale.multiplyScalar(.9);if(f.life<=0){scene.remove(f.o);fx.splice(i,1);}continue;}
    if(f.kind==='casing'){f.v.y-=9.8*dt;f.o.position.addScaledVector(f.v,dt);f.o.rotation.x+=f.spin*dt;f.o.rotation.z+=f.spin*.7*dt;if(f.life<=0){scene.remove(f.o);fx.splice(i,1);}continue;}
    if(f.kind==='drop'){f.v.y-=9*dt;f.o.position.addScaledVector(f.v,dt);f.o.material.opacity=k;}
    else if(f.kind==='smoke'){f.o.position.addScaledVector(f.v,dt);f.o.scale.multiplyScalar(1+dt*.8);f.o.material.opacity=k*.8;}
    else if(f.kind==='boom'){f.o.scale.setScalar(5+(1-k)*6);f.o.material.opacity=k;}
    else if(f.kind==='light'){f.o.intensity=200*k;}
    else if(f.o.material)f.o.material.opacity=k;
    if(f.life<=0){scene.remove(f.o);f.o.geometry&&f.o.geometry.dispose();fx.splice(i,1);}}
}

// four answers for the targeted zombie, made once per word so switching targets back and forth keeps them stable
function choicesFor(z){
  if(z.opts&&z.opts.word===curWord(z).en)return z.opts.list;
  const w=curWord(z),pool=[...G.fresh,...G.old,...ZONES[G.k].words].filter(o=>!clash(o,w));
  const L=w.en.length,near=pool.filter(o=>Math.abs(o.en.length-L)<=3),src=near.length>=6?near:pool;
  const picks=[];const seen=new Set([w.en]);
  for(const o of shuffle(src)){if(seen.has(o.en))continue;seen.add(o.en);picks.push(o);if(picks.length===3)break;}
  const list=shuffle([{en:w.en,ok:true},...picks.map(o=>({en:o.en,ok:false}))]);
  if(GUNS[P.gun].auto1){const c=list.find(c=>!c.ok);if(c)c.gone=true;}
  z.opts={word:w.en,list};return list;
}
function pickChoice(i){
  if(state!=='play'||!G)return;
  if(G.t<jamUntil){SFX.jam();return;}
  if(!target||target.dead)setTarget(nearest());const z=target;if(!z)return;
  const c=choicesFor(z)[i];if(!c||c.gone)return;

  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  const hit=ray.intersectObjects(props.map(p=>p.obj),true)[0];if(!hit)return;

let lastDraw=0,hzN=0,hzT=0,dispHz=0;
function frame(now){
  requestAnimationFrame(frame);
  hzN++;if(now-hzT>=1000){if(hzT)dispHz=Math.round(hzN*1000/(now-hzT));hzN=0;hzT=now;}
  const cap=P.opts.fpsCap||60;if(now-lastDraw<1000/cap*.92)return;lastDraw=now;
  const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;clock+=dt;perfSample(raw);
  const playing=state==='play';
  if(playing){G.t+=dt;step(dt);}
  // zombies animate in every state except pause
  if(state!=='paused'){
    for(const z of [...zombies]){
      z.mixer.update(dt*(z.menu?.6:z.dead?1:TS));
      stepGear(z);
      if(z.menu){walk(z,z.speed*dt);if(z.obj.position.z>-9){z.obj.position.z=-32;z.obj.position.x=freeX(z.obj.position.x,-32);}continue;}
      if(z.dead){if(z.dieDelay>0){z.dieDelay-=dt;if(z.dieDelay<=0)play(z,'Death',false,.1);continue;}z.dieT+=dt;
        if(z.T.vehicle&&!z.wreck){z.wreck=1;explosion(z.obj.position.x,z.obj.position.z);SFX.boom();shake=1;PLACE_TO=scene;fire(z.obj.position.x,1.6,z.obj.position.z,1.4);}
        if(!z.clips.Death&&z.model){z.mixer.timeScale=0;z.model.rotation.x=Math.max(-1.5,z.model.rotation.x-dt*5);}if(z.dieT>1.8)z.obj.position.y-=dt*.6;if(z.dieT>3.2)removeZombie(z);}
    }
    stepFx(dt);stepAllies(dt);stepAtmosphere(dt);
    for(const w of SWEEP){w.ph+=dt*.6;w.l.target.position.set(Math.sin(w.ph)*6,0,w.z-10-Math.cos(w.ph*.7)*8);}
    for(const f of FIRES){f.ph+=dt*9;const k=.75+Math.sin(f.ph)*.12+Math.sin(f.ph*2.3)*.08;f.l.intensity=f.base*k;f.g.children.forEach((c,i)=>{if(c.isSprite)c.material.rotation=Math.sin(f.ph*.5+i)*.15;});}
    if(state==='play')for(const pr of [...props]){if(pr.ttl!=null){pr.ttl-=dt;if(pr.ttl<=0){removeProp(pr);continue;}}pr.obj.rotation.y+=pr.kind==='med'?dt*1.5:0;}
  }
  // camera: idle sway, recoil, shake
  recoil=Math.max(0,recoil-dt*9);shake=Math.max(0,shake-dt*2.2);
  const sway=Math.sin(clock*.7)*.03;
  if(CUT&&CUT.cam){const c=CUT.cam;CUT.t+=dt;let k=Math.min(1,CUT.t/c.dur);k=k*k*(3-2*k);camera.position.lerpVectors(c.p0,c.p1,k);camera.position.x+=(Math.random()-.5)*shake*.2;camera.lookAt(c.l0.clone().lerp(c.l1,k));}
  else{
  camera.position.set(CAM.x+sway+(Math.random()-.5)*shake*.25,CAM.y+Math.sin(clock*1.3)*.015+(Math.random()-.5)*shake*.25,CAM.z);
  const look=target&&!target.dead&&playing?chest(target):new THREE.Vector3(0,1.1,-20);
  const aim=new THREE.Vector3(0,1.05,-20).lerp(look,.15);
  camera.lookAt(state==='deco'&&!decoPlayView?DECO_LOOK:aim);}
  if(gunObj){const dip=Math.max(G&&G.reloadT>0?Math.sin(Math.min(1,G.reloadT/GUNS[P.gun].reload)*Math.PI):0,mAnim?Math.sin(Math.min(1,mAnim.t/mAnim.W.dur)*Math.PI):0);gunObj.position.set(.34,-.21-dip*.3+Math.sin(clock*2)*.004,-.62+recoil*.07);gunObj.rotation.x=recoil*.22-dip*.6;gunObj.rotation.z=dip*.5;}
  stepKnife(dt);
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*120);
  // flashlight follows the target
  const ft=target&&!target.dead?chest(target):new THREE.Vector3(Math.sin(clock*.3)*2,.6,-14);
  flash.target.position.lerp(ft,Math.min(1,dt*6));flash.position.set(camera.position.x+.3,camera.position.y-.15,camera.position.z);
  updateLights();
  renderer.render(scene,camera);
  if(state==='deco')decoMarkers();
  // word tags follow heads
  if(playing||state==='end'||state==='paused'){
    const W=innerWidth,H=innerHeight,items=[];
    for(const z of zombies){if(!z.tag)continue;
      proj.set(z.obj.position.x,(z.T.tagH||z.T.h)+.35+z.obj.position.y,z.obj.position.z).project(camera);
      const d=camera.position.distanceTo(z.obj.position),s=clamp(8/d,.78,1.15);
      if(!z.tw||z.tagDirty!==z.tag.textContent){z.tw=z.tag.offsetWidth;z.th=z.tag.offsetHeight;z.tagDirty=z.tag.textContent;}
      items.push({z,d,s,x:(proj.x*.5+.5)*W,y:(-proj.y*.5+.5)*H,w:z.tw*s,h:z.th*s,hide:proj.z>1});
    }
    // nearest tags keep their place; farther ones that would overlap are lifted above them
    items.sort((a,b)=>a.d-b.d);
    const placed=[];
    for(const it of items){
      if(it.hide||it.z.dead){continue;}
      for(let k=0;k<8;k++){const hit=placed.find(o=>Math.abs(o.x-it.x)<(o.w+it.w)/2+4&&it.y>o.y-o.h-4&&it.y-it.h<o.y+4);if(!hit)break;it.y=hit.y-hit.h-6;}
      placed.push(it);
    }
    survTags(W,H);
    for(const pr of props){proj.set(pr.x,pr.kind==='barrel'?.55:1,pr.z).project(camera);
      pr.el.style.transform=`translate(${((proj.x*.5+.5)*W).toFixed(1)}px,${((-proj.y*.5+.5)*H).toFixed(1)}px) translate(-50%,${pr.kind==='barrel'?'-50%':'-100%'})`;pr.el.style.display=proj.z>1?'none':'';}
    for(const it of items){const z=it.z;
      const tf=`translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px) translate(-50%,-100%) scale(${it.s.toFixed(3)})`;
      z.tag.style.transform=tf;z.tag.style.setProperty('--tf',tf);z.tag.style.zIndex=1000-Math.round(it.d*10);
      z.tag.style.display=it.hide?'none':'';
      z.tag.classList.toggle('near',z.obj.position.z>STOP_Z-4&&!z.dead);
    }
  }
}
function step(dt){
  if(!$('#jamTag').hidden&&G.t>=jamUntil){$('#jamTag').hidden=true;$('#pad').classList.remove('jam');renderPad();}
  stepOps(dt);
  // spawning
  if(G.queue.length){G.spawnT-=dt;if(G.spawnT<=0&&live().length<8){spawn(G.queue.shift());G.spawnT=G.W[G.wave].gap*rnd(.75,1.2);}}
  else if(!live().length&&!G.ended&&!G.opDone&&!SURV.some(s=>!s.dead)){G.waveGap=(G.waveGap||2.2)-dt;if(G.waveGap<=0){G.waveGap=0;const last=G.mode!=='survival'&&G.wave>=G.W.length-1;if(!last&&G.mode==='night'&&G.wave===0)miniGame();else if(!last&&G.mode!=='review')perkPick();else nextWave();}}
  if(G.reloadT>0){G.reloadT-=dt;if(G.reloadT<=0){G.reloadT=0;if(G.op==='ammo'){const t=Math.min(G.mag-G.ammo,G.pool);G.ammo+=t;G.pool-=t;}else G.ammo=G.mag;hud();}}
  if(G.knifeT>0)G.knifeT-=dt;
  if(G.slow>0){G.slow-=dt;if(G.slow<=0)$('#slowfx').hidden=true;}
  if(G.shieldT>0&&live().length)G.shieldT-=dt;
  TS=(G.slow>0?.45:1)*G.slowMul;
  // zombies walk, separate, attack
  const L=live();
  for(const z of L){
    z.hitT-=dt;z.groanT-=dt;
    if(z.groanT<=0){z.groanT=rnd(4,9);const d=-z.obj.position.z;SFX.groan(clamp(.22-d*.004,.03,.2),z.T.boss||z.type==='brute');}
    const p=z.obj.position;
    if(!z.at){
      if(z.frozen>0){z.frozen-=dt;if(z.frozen<=0)unfreeze(z);z.x=p.x;z.z=p.z;continue;}
      if(z.hitT<=0&&!(z.T.artillery&&p.z>=-17)){if(z.T.anim&&z.clips[z.T.anim]&&z.act!==z.mixer.clipAction(z.clips[z.T.anim]))play(z,z.T.anim,true);walk(z,z.speed*dt*TS*(z.rage>0?1.6:1)*(z.slowT>0?.55:1));}
      if(z.rage>0)z.rage-=dt;
      if(z.T.leap){z.leapCD=(z.leapCD??rnd(2,4))-dt;if(z.leapT>0){z.leapT-=dt;walk(z,6.5*dt*TS);z.obj.position.y=Math.sin(Math.max(0,z.leapT)/.6*Math.PI)*1.1;if(z.leapT<=0){z.obj.position.y=0;play(z,z.T.anim,true);}}
        else if(z.leapCD<=0&&p.z<STOP_Z-6){z.leapCD=rnd(3,4.5);z.leapT=.6;play(z,z.T.jumpAnim||'Jump',false,.05);SFX.whoosh();if(z.T.boss){SFX.roar();shake=Math.max(shake,.4);}}}
      if(z.T.ghost){z.ghT=(z.ghT??rnd(2,4))-dt;const hid=z.ghT<0;if(z.ghT<-1.6)z.ghT=rnd(2.5,4);const op=hid?.08:.6;z.obj.traverse(m=>{if(m.isMesh&&m.material)m.material.opacity+= (op-m.material.opacity)*Math.min(1,dt*8);});if(z.tag)z.tag.style.opacity=hid?.35:'';}
      if(z.slowT>0)z.slowT-=dt;
      for(const pd of PUDDLES)if(Math.hypot(p.x-pd.x,p.z-pd.z)<1.3&&!z.T.boss){z.slowT=.3;}
      if(z.emberSpr)z.emberSpr.material.opacity=.55+Math.sin(clock*9+z.born)*.25;
      if(z.T.charge){z.chargeCD-=dt;if(z.charging>0){z.charging-=dt;walk(z,z.speed*dt*TS*2.6);}else if(z.chargeCD<=0&&p.z<-9){z.chargeCD=rnd(6,9);z.charging=1.3;SFX.roar();shake=Math.max(shake,.5);floatAt(z,'พุ่งชน!','#ff6a5a');}}
      if(z.T.spawner){z.spawnCD-=dt;if(z.spawnCD<=0&&live().length<9){z.spawnCD=6;SFX.groan(.3,true);floatAt(z,'ออกลูก!','#c8a0ff');for(const d of [-1.3,1.3])spawnAt(Math.random()<.5?'crawler':'runner',clamp(p.x+d,-3.4,3.4),p.z+.5);}}
      if(z.T.artillery){if(p.z>=-17){p.z=Math.min(p.z,-17);z.fireCD=(z.fireCD??2.5)-dt*TS;if(z.fireCD<=0){z.fireCD=5;tankShot(z);}}}
      if(z.T.vehicle){z.engT-=dt;if(z.engT<=0){z.engT=1;SFX.engine();}}
      if(z.T.scream&&p.z>-28){z.screamT-=dt;if(z.screamT<=0){z.screamT=9;SFX.scream();floatAt(z,'กรีดร้อง!','#ff6a5a');for(const o of L)if(o!==z)o.rage=5;}}
      if(z.T.loot&&p.z>=STOP_Z-1.2){floatAt(z,'หนีไปแล้ว','#f2b33d');z.dead=true;removeZombie(z);continue;}
      for(const o of L)if(o!==z){const dx=p.x-o.obj.position.x,dz=p.z-o.obj.position.z;if(Math.abs(dz)<1.2&&Math.abs(dx)<.9){const nx=p.x+Math.sign(dx||rnd(-1,1))*dt*.8;if(!blocked(nx,p.z))p.x=nx;}}
      p.x=clamp(p.x,-3.6,3.6);
      if(p.z>=STOP_Z-(z.T.boss?.8:0)){p.z=STOP_Z-(z.T.boss?.8:0);if(z.T.boom){z.dead=true;G.miss.add(curWord(z).en);bloat(z,true);removeZombie(z);continue;}z.at=true;play(z,z.T.atk||(z.clips.Punch?'Punch':'Idle_Attack'),true);}
    }else{
      if(z.frozen>0){z.frozen-=dt;if(z.frozen<=0)unfreeze(z);continue;}
      if(z.stunT>0){z.stunT-=dt;z.x=p.x;z.z=p.z;continue;}
      z.atkT-=dt*TS;if(G.shieldT<=0)G.wall-=z.T.dps*dt*TS;
      if(z.atkT<=0){z.atkT=.9;SFX.thud();shake=Math.max(shake,.25);const h=$('#hurt');h.classList.add('on');setTimeout(()=>h.classList.remove('on'),90);z.miss=true;G.miss.add(curWord(z).en);}
    }
    z.x=p.x;z.z=p.z;
  }
  if(G.wall<=0&&!G.ended){G.wall=0;hud();for(const z of L)play(z,'Idle',true);endNight(false);}
  if(target&&target.dead)setTarget(nearest());
  if(!target&&L.length)setTarget(nearest());
  if(Math.random()<dt*4||G.reloadT>0)hud();
}

resize();
requestAnimationFrame(frame);
loadModels().then(()=>{
  buildWorld();try{makeThumbs();}catch(e){}equipGun();equipKnife();if(gunObj)gunObj.visible=false;
  $('#loading').hidden=true;home();
  window.__dw={get G(){return G;},zombies,press,live,get target(){return target;},P,get OBST(){return OBST;},blocked,setZone,setScene,setAtmosphere,equipSkin,perkPick,startNight,endNight,brief,renderer,scene,pickChoice,choicesFor,get SURV(){return SURV;},equipKnife,MELEE,MINIS,miniGame,get CUT(){return CUT;}};
});
