<title>Notebook Monsters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: a page of a Thai exercise book. Left margin = HUD. Canvas = the page. Desk strip = four sticky-note answers.
   Menus are single sheets of paper that always fit the screen; long lists scroll inside the sheet. */
:root{
  --paper:#fbfaf3; --rule:#b9cbe6; --margin:#e57373; --desk:#5b4636;
  --ink:#22305c; --red:#d8342c; --ok:#1f8a4c; --side:#22305c; --gold:#e0a400;
  --hl-y:#fff04d; --hl-p:#ff9fd0; --hl-g:#9cf08f; --hl-b:#8fd6ff;
  --tape:#efe3b4;
  --f-th:"Itim",system-ui,sans-serif;
  --f-en:"Patrick Hand","Itim",system-ui,sans-serif;
  --f-mark:"Permanent Marker","Itim",system-ui,sans-serif;
  --hand:255px 18px 225px 18px/18px 225px 18px 255px;
  --mx:56px;
  color-scheme:light;
}
html,body{height:100%;background:var(--desk);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:var(--f-th);-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:none;border:0;padding:0}
button:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
button[disabled]{cursor:not-allowed}

.game{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.side{position:absolute;left:env(safe-area-inset-left,0px);top:0;bottom:0;width:var(--mx);display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;pointer-events:none;color:var(--side)}
.pause{pointer-events:auto;width:40px;height:36px;border:2.5px solid var(--ink);border-radius:var(--hand);background:var(--paper);color:var(--ink);font-family:var(--f-en);font-size:20px;line-height:1}
.pg{font-family:var(--f-th);font-size:13px;line-height:1.1;text-align:center}
.pg b{display:grid;place-items:center;width:40px;height:40px;margin:2px auto 0;border:2.5px solid var(--red);border-radius:50%;font-family:var(--f-en);font-size:18px;font-weight:400;color:var(--red);transform:rotate(-6deg);background:#fff8}
.pg.turn b{animation:stamp .5s}
.hearts{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;line-height:1;color:var(--red);text-shadow:0 1px 0 #fff8}
.hearts span.drop{animation:drop .7s forwards}
@keyframes drop{30%{transform:scale(1.5) rotate(-10deg)}100%{transform:translateY(40px) rotate(40deg);opacity:0}}
.shield{font-family:var(--f-en);font-size:15px;color:#2f7fd1;text-align:center;line-height:1.1;background:#fff9;border-radius:6px;padding:0 3px}
.shield:empty{display:none}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.tape{background:var(--tape);color:var(--ink);padding:2px 14px 3px;font-family:var(--f-en);font-size:26px;line-height:1.2;clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,3% 96%,0 50%);transform:rotate(-1.5deg);min-width:70px;text-align:right}
.combo{font-family:var(--f-en);font-size:26px;color:var(--red);transform:rotate(4deg);background:#fff9;border-radius:8px;padding:0 6px}
.combo.bump{animation:bump .25s}
.myskills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.myskills i{position:relative;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;font-style:normal;background:#fff}
.myskills i svg{width:18px;height:18px}
.myskills i b{position:absolute;right:-5px;bottom:-5px;font-family:var(--f-en);font-weight:400;font-size:12px;background:var(--ink);color:#fff;border-radius:8px;min-width:14px;line-height:14px;text-align:center}
@keyframes bump{50%{transform:scale(1.3) rotate(-4deg)}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.eraser{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:80px;height:44px;border-radius:10px 10px 12px 12px;background:linear-gradient(90deg,#ff8fa7 0 55%,#3c6fd1 55% 100%);border:2.5px solid var(--ink);transform:rotate(-8deg);box-shadow:3px 4px 0 #0003;transition:transform .1s}
.eraser:active{transform:rotate(-8deg) scale(.92)}
.eraser b{position:absolute;left:-10px;top:-12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-en);font-size:17px;font-weight:400;transform:rotate(8deg)}
.eraser[disabled]{filter:grayscale(1);opacity:.5}
.eraser.ready{animation:nudge 1.4s infinite}
@keyframes nudge{0%,80%,100%{transform:rotate(-8deg)}85%{transform:rotate(-14deg) scale(1.06)}90%{transform:rotate(-2deg) scale(1.06)}95%{transform:rotate(-12deg)}}
.shav{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:64px;width:74px;height:8px;border:2px solid var(--ink);border-radius:var(--hand);overflow:hidden;background:#fff}
.shav i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#e8b26a 0 6px,#c98a3d 6px 9px);transition:width .25s}
.typed{position:absolute;left:50%;bottom:32%;transform:translateX(-50%) rotate(-2deg);font-family:var(--f-en);font-size:34px;color:var(--ink);background:linear-gradient(transparent 55%,var(--hl-y) 55% 90%,transparent 90%);padding:0 6px;pointer-events:none}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:10px;padding:6px 16px;font-size:17px;animation:fade .2s}
.flip{position:absolute;inset:0;pointer-events:none;background:var(--flipbg,var(--paper));transform-origin:left center;box-shadow:-20px 0 40px #0004;opacity:0}
.flip.go{animation:flip .8s cubic-bezier(.5,0,.75,0) forwards}
@keyframes flip{0%{opacity:1;transform:perspective(1800px) rotateY(0)}100%{opacity:1;transform:perspective(1800px) rotateY(-95deg)}}

.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--desk);box-shadow:inset 0 8px 10px -6px #0006}
.note{--c:var(--hl-y);--r:-1.6deg;position:relative;min-height:60px;background:var(--c);transform:rotate(var(--r));box-shadow:2px 5px 0 #0003,inset 0 -10px 14px -12px #0003;font-family:var(--f-en);font-size:clamp(20px,2.8vw,30px);line-height:1.05;padding:6px;overflow-wrap:anywhere;transition:transform .08s;color:var(--ink)}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:46%;height:16px;transform:translateX(-50%) rotate(2deg);background:#f4ecc9cc}
.note:nth-child(2){--c:var(--hl-p);--r:1.2deg} .note:nth-child(3){--c:var(--hl-g);--r:-.8deg} .note:nth-child(4){--c:var(--hl-b);--r:1.8deg}
.note.long{font-size:clamp(15px,2vw,21px)}
.unit{width:100%;margin:10px 0 6px;font-weight:400;font-size:18px;text-align:left;border-bottom:2px dashed #0002;padding-bottom:2px}
.unit.ok::after{content:" ✓";color:var(--ok)}
.note .k{position:absolute;left:7px;bottom:3px;font-size:13px;opacity:.45}
.note .tick{position:absolute;right:6px;top:2px;font-family:var(--f-mark);color:var(--ok);font-size:26px;opacity:0}
.note:active{transform:rotate(var(--r)) translateY(3px) scale(.96);box-shadow:1px 2px 0 #0003}
.note.new{animation:stick .32s ease-out}
@keyframes stick{from{transform:rotate(calc(var(--r) - 10deg)) translateY(-18px) scale(.9);opacity:0}}
.note.ok .tick{animation:tick .5s}
.note.ok{animation:yes .35s}
@keyframes tick{0%{opacity:0;transform:scale(2)}30%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes yes{40%{transform:rotate(var(--r)) translateY(-6px) scale(1.04)}}
.note.bad .w{text-decoration:line-through 3px var(--red)}
.note.bad{animation:nope .35s}
@keyframes nope{25%{transform:rotate(var(--r)) translateX(-7px)}75%{transform:rotate(var(--r)) translateX(7px)}}
.note.hint{animation:wig .6s infinite}
@keyframes wig{50%{transform:rotate(calc(var(--r) + 3deg)) scale(1.05)}}
.note.match{outline:3px solid var(--ink);outline-offset:2px}
.bar.lock .note{filter:saturate(.25) brightness(.95)}
@media (max-width:560px) and (orientation:portrait){.bar{grid-template-columns:1fr 1fr;gap:12px 10px}.note{min-height:52px}}
@media (orientation:landscape) and (max-height:480px){.note{min-height:40px;font-size:21px;padding:3px 6px}.bar{padding-top:9px;gap:10px}.hearts{font-size:18px}.pg b{width:34px;height:34px;font-size:16px}.side{gap:5px}.tape{font-size:22px}}

/* menus: one sheet that always fits the screen */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:#3b2d22cc;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;background:#fbfaf3;background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px 42px,transparent 42px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);padding:18px 16px 16px 54px;box-shadow:0 10px 0 -4px #e9e4d2,0 12px 30px #0006;transform:rotate(-.5deg);animation:slide .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes slide{from{transform:translateY(60px) rotate(-4deg);opacity:0}}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:80px;height:24px;background:#f1e6bccc;z-index:1}
.sheet::before{left:26px;transform:rotate(-8deg)} .sheet::after{right:26px;transform:rotate(7deg)}
.holes{position:absolute;left:12px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly}
.holes i{width:14px;height:14px;border-radius:50%;background:#3b2d22;box-shadow:inset 0 2px 3px #0008}
.panel{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--ink);min-height:0;overflow:auto}
.panel>*{animation:rise .4s backwards;flex-shrink:0}
.panel>*:nth-child(2){animation-delay:.05s}.panel>*:nth-child(3){animation-delay:.1s}.panel>*:nth-child(4){animation-delay:.15s}.panel>*:nth-child(5){animation-delay:.2s}.panel>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.scroll{overflow:auto;min-height:0;flex-shrink:1!important;width:100%;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;gap:10px;width:100%}
.topbar h2{flex:1;margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(24px,5vw,36px);text-align:left;transform:rotate(-1deg)}
.back{width:42px;height:38px;border:2.5px solid var(--ink);border-radius:var(--hand);background:#fff;font-size:20px}
.coins{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-en);font-size:24px;background:#fff6cc;border:2.5px solid var(--gold);border-radius:999px;padding:0 12px 0 4px}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e0a400 70%);border:2px solid #9c6f00;position:relative;flex:none}
.coin::after{content:"";position:absolute;inset:5px 8px;border-left:2px solid #9c6f00}
.title{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(34px,8vw,64px);line-height:.95;transform:rotate(-2deg)}
.title span{display:inline-block;background:linear-gradient(transparent 50%,var(--hl-y) 50% 88%,transparent 88%);padding:0 8px;animation:wob 3s ease-in-out infinite}
.title small{display:block;font-family:var(--f-th);font-size:.36em;color:var(--red);margin-top:4px}
@keyframes wob{50%{transform:rotate(1.5deg)}}
.cast{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:clamp(36px,8vh,58px)}
.cast img{height:100%;animation:hop 1.2s ease-in-out infinite}
.cast img:nth-child(2){animation-delay:.15s}.cast img:nth-child(3){animation-delay:.3s}.cast img:nth-child(4){animation-delay:.45s}.cast img:nth-child(5){animation-delay:.6s}.cast img:nth-child(6){animation-delay:.75s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.mbtn{display:flex;align-items:center;gap:12px;font-size:24px;padding:8px 18px;border:3px solid var(--ink);border-radius:var(--hand);background:#fff;box-shadow:3px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;text-align:left}
.mbtn:active{transform:translate(3px,4px);box-shadow:none}
.mbtn.main{background:var(--hl-y);font-size:30px;justify-content:center}
.mbtn svg{width:32px;height:32px;flex:none}
.mbtn small{margin-left:auto;font-size:16px;color:#0008}
.toggles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:17px}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk i{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:var(--hand);display:grid;place-items:center;font-style:normal;font-family:var(--f-mark);color:var(--red);font-size:18px;line-height:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{--c:#4f9d69;padding:4px 14px;border-radius:8px 8px 0 0;background:var(--c);color:#fff;font-size:18px;opacity:.55;border-bottom:4px solid transparent}
.tab[aria-pressed="true"]{opacity:1;border-bottom-color:var(--ink);transform:translateY(-2px)}
.tab small{font-family:var(--f-en);font-size:15px;opacity:.9}
.bookinfo{font-size:16px;color:#0009}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 8px;width:100%}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px}
.dot b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-family:var(--f-en);font-weight:400;font-size:26px;box-shadow:2px 3px 0 #0003;transition:transform .12s}
.dot:hover b{transform:scale(1.08) rotate(-4deg)}
.dot.boss b{border-color:var(--red);color:var(--red);width:62px;height:62px}
.dot.done b{background:#e7f8ea}
.dot.next b{background:var(--hl-y);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.dot.lock b{border-style:dashed;color:#0004;background:#f3f1ea;box-shadow:none}
.dot .st{font-size:14px;letter-spacing:1px;color:var(--gold);height:16px}
.dot .st .no{color:#0002}
.endless{display:flex;align-items:center;gap:10px;font-size:19px;padding:6px 16px;border:3px dashed var(--ink);border-radius:var(--hand);background:#fff}
.endless[disabled]{opacity:.45}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;width:100%;text-align:left}
@media (min-width:640px){.wgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wi{display:flex;gap:8px;align-items:baseline;border-bottom:1.5px dashed #0002;padding:3px 2px;min-width:0;text-align:left}
.wi b{font-family:var(--f-en);font-weight:400;font-size:21px}
.wi span{font-size:16px;color:#0009;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi i{font-style:normal;margin-left:auto;font-family:var(--f-mark);font-size:15px;color:var(--ok)}
.wi.weak i{color:var(--red)}
.wi.unk b{color:#0005}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;width:100%}
.item{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;box-shadow:3px 3px 0 #0002}
.item .ic{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff6cc;border:2px solid #0002}
.item .ic svg{width:34px;height:34px}
.item .tx{flex:1;min-width:0;line-height:1.25}
.item .tx b{display:block;font-size:18px;font-weight:400}
.item .tx small{font-size:14px;color:#0009}
.item .lvp{display:flex;gap:3px;margin-top:2px}
.item .lvp i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.item .lvp i.on{background:var(--ink)}
.buy{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-en);font-size:19px;padding:2px 10px;border:2.5px solid var(--gold);border-radius:999px;background:#fff6cc;white-space:nowrap}
.buy[disabled]{opacity:.45}
.buy.own{border-color:var(--ok);background:#e7f8ea;font-family:var(--f-th);font-size:15px}
.buy.use{border-color:var(--ink);background:var(--ink);color:#fff;font-family:var(--f-th);font-size:15px}
.big{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(28px,6vw,46px);line-height:1.05;transform:rotate(-1.5deg)}
.big.red{color:var(--red);border:4px solid var(--red);border-radius:var(--hand);padding:2px 18px;animation:stampB .5s cubic-bezier(.3,1.6,.5,1) backwards}
.big.green{color:var(--ok);border:4px solid var(--ok);border-radius:var(--hand);padding:2px 18px;animation:stampB .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes stampB{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.stars{font-size:clamp(38px,8vw,56px);letter-spacing:6px;line-height:1;color:var(--gold)}
.stars span{display:inline-block;animation:starpop .45s cubic-bezier(.3,1.8,.5,1) backwards}
.stars span:nth-child(2){animation-delay:.18s}.stars span:nth-child(3){animation-delay:.36s}
.stars span.no{color:#0002}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.btn{font-family:var(--f-th);font-size:20px;padding:7px 22px;border:3px solid var(--ink);border-radius:var(--hand);background:var(--hl-y);box-shadow:3px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;color:var(--ink)}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn.plain{background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:16px}
.stats b{display:block;font-family:var(--f-en);font-weight:400;font-size:28px;line-height:1}
.gain{font-family:var(--f-en);font-size:30px;color:#9c6f00;display:inline-flex;align-items:center;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.card{--b:#e2463d;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 8px;background:#fff;border:3px solid var(--b);border-radius:14px;box-shadow:4px 5px 0 #0002;transition:transform .15s;animation:popin .45s cubic-bezier(.3,1.7,.5,1) backwards;color:var(--ink)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
@keyframes popin{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.card:hover{transform:rotate(-2deg) translateY(-4px)}
.card.peel{animation:peel .35s ease-in forwards}
@keyframes peel{to{transform:translateY(-60px) rotate(25deg) scale(1.15);opacity:0}}
.card .br{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;font-size:13px;border-radius:999px;padding:0 10px;white-space:nowrap}
.card .disc{width:64px;height:64px;border-radius:50%;background:var(--bg,#fff);border:4px solid #fff;box-shadow:0 0 0 3px var(--b);display:grid;place-items:center;margin-top:6px}
.card .disc svg{width:38px;height:38px}
.card .n{font-size:19px}
.card .lv{display:flex;gap:4px}
.card .lv i{width:11px;height:11px;border-radius:50%;border:2px solid var(--b)}
.card .lv i.on{background:var(--b)}
.card .lv i.nx{background:var(--b);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.25}}
.card .d{font-size:15px;color:#444;min-height:2.6em;line-height:1.3}
.newrec{font-family:var(--f-mark);color:var(--red);border:3px solid var(--red);border-radius:var(--hand);padding:2px 12px;transform:rotate(-6deg);font-size:18px}

let ac=null,nb=null,master=null;
function audio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}ac.resume();}catch(e){ac=null;}}
function nz(d,v,type,f,q=1,at=0,f2){
  if(!ac||!OPT.sfx)return;const t=ac.currentTime+at,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nb;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(master);s.start(t,Math.random()*.3);s.stop(t+d+.02);
}
function tn(f,d,type='sine',v=.08,f2=0,at=0){if(!ac||!OPT.sfx)return;note(f,d,type,v,f2,ac.currentTime+at);}
function note(f,d,type,v,f2,t){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);
}

function fire(slot){

  const tg=live().filter(e=>cur(e).en===w.en).sort((a,b)=>b.y-a.y);

function crumbs(x,y,n,s=1){for(let i=0;i<n;i++){const a=rnd(-Math.PI,0)+rnd(-.5,.5),v=rnd(80,320)*SC*s;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.5,1),max:1,w:rnd(3,8)*SC,h:rnd(2,4)*SC,rot:rnd(0,6),vr:rnd(-8,8),c:pick(['#ff8fa7','#f3a8b7','#9a9a9a','#c4b49a','#e8b26a'])});}}
function baseHit(e){
  e.dying=-1;const w=cur(e);
  if(G.shield>0){G.shield--;SFX.shield();G.floats.push({x:W/2,y:hitY()-40*SC,text:'กันได้!',c:'def',life:1.1,size:26,font:FONT_TH});if(lvl('cover')>=2)G.freezeT=Math.max(G.freezeT,.8);}

function useEraser(){

/* ---------- update ---------- */
function update(dt){
  if(!G)return;
  if(hitstop>0){hitstop-=dt;return;}
  G.t+=dt;seed=Math.floor(G.t*8)%3;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  G.recoil=Math.max(0,G.recoil-dt*6);G.fortHit=Math.max(0,G.fortHit-dt);
  G.freezeT=Math.max(0,G.freezeT-dt);G.boltT=Math.max(0,G.boltT-dt);
  if(state==='play'){
    if(G.spawnLeft>0||G.bossPending){
      G.spawnT-=dt;
      if(G.spawnT<=0&&live().length<Math.min(2+Math.floor(G.diff/2),6)){
        if(G.bossPending){spawn(true);G.bossPending=false;}else{spawn(false);G.spawnLeft--;}
        G.spawnT=Math.max(1.1,3-G.diff*.12)*(.8+G.rs()*.4);
      }
    }else if(!G.enemies.length&&!G.sweep){
      state='between';
      if(G.mode==='stage'&&G.wave>=PAGES)setTimeout(()=>runEnd(true),850);
      else setTimeout(showPick,850);
    }
    const hy=hitY(),sm=speedMul();
    for(const e of G.enemies){
      if(e.dying)continue;
      e.y+=e.vy*sm*dt;if(sm>0)e.x=e.bx+Math.sin(G.t*1.2+e.ph)*10*SC;
      if(e.y+e.r*.8>=hy)baseHit(e);
    }
    G.barT-=dt;if(G.barT<=0){G.barT=.35;refreshBar();}
    music();
  }
  for(const e of G.enemies){e.flash=Math.max(0,e.flash-dt);if(e.dying>0){e.dying-=dt;if(e.dying<=0){e.dying=-1;crumbs(e.x,e.y,e.boss?60:24,e.boss?1.6:1);SFX.pop();}}}
  G.enemies=G.enemies.filter(e=>e.dying!==-1);
  if(G.sweep){
    G.sweep.x+=W*1.5*dt;
    for(const e of G.enemies){if(!e.dying&&e.x<G.sweep.x&&!G.sweep.done.has(e.id)){G.sweep.done.add(e.id);
      if(e.boss&&e.idx<e.words.length-1){e.idx++;e.flash=.3;}else{e.dying=.2;G.score+=2;}}}
    if(G.sweep.x>W+150*SC){G.sweep=null;G.slots=[null,null,null,null];refreshBar();}
  }
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy+=520*SC*dt;p.rot+=p.vr*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0&&p.y<H+20);
  G.strokes.forEach(s=>s.life-=dt);G.strokes=G.strokes.filter(s=>s.life>0);
  G.floats.forEach(f=>{f.life-=dt;f.y-=22*dt;});G.floats=G.floats.filter(f=>f.life>0);
}

/* ---------- draw ---------- */
const col=c=>{const th=theme();return c==='text'?th.text:c==='good'?th.good:c==='bad'?th.bad:c==='def'?'#2f7fd1':c;};
function draw(now){
  cx.setTransform(DPR,0,0,DPR,0,0);
  const th=theme();

  cx.save();cx.translate(sx,sy);
  const hy=hitY();

  drawFort(t);

    const near=live().sort((a,b)=>b.y-a.y)[0];
    for(const e of [...G.enemies].sort((a,b)=>a.y-b.y))drawMonster(e,e===near,t);
    const p=pen(),dark=th.deco==='board'||th.deco==='blue';
    for(const s of G.strokes){cx.globalAlpha=s.life/.22;
      for(let k=0;k<2;k++){let c=s.red?'#e2463d':p.c==='rainbow'?`hsl(${(t*400+k*120)%360} 85% 55%)`:(p.id==='yellow'&&dark?'#f6f2e4':p.c);
        cx.strokeStyle=c;cx.lineWidth=((p.w||4)-k*2)*SC;cx.lineCap='round';cx.beginPath();const n=7;for(let i=0;i<=n;i++){const q=i/n;cx.lineTo(s.x1+(s.x2-s.x1)*q+(i%n?(hh(s.id+i+k)-.5)*10:0),s.y1+(s.y2-s.y1)*q+(i%n?(hh(s.id+i*2+k)-.5)*10:0));}cx.stroke();}
      cx.globalAlpha=1;}
    for(const q of G.parts){cx.globalAlpha=clamp(q.life/q.max*1.5,0,1);cx.save();cx.translate(q.x,q.y);cx.rotate(q.rot);cx.fillStyle=q.c;
      if(q.star){cx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*.8;cx.lineTo(Math.cos(a)*q.w,Math.sin(a)*q.w);}cx.fill();}else cx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cx.restore();}
    cx.globalAlpha=1;
    if(G.boltT>0){cx.strokeStyle='#ffd23f';cx.lineWidth=2.5;for(const e of live()){cx.beginPath();let x=e.x-e.r,y=e.y-e.r*.2;cx.moveTo(x,y);for(let i=0;i<6;i++){x+=e.r/3;y+=(i%2?-1:1)*8*SC*(.5+Math.random());cx.lineTo(x,y);}cx.stroke();}}
    if(G.sweep)drawSweep();
    if(near&&TUT<3&&state==='play')drawHint(near);
    for(const f of G.floats)drawFloat(f);
    if(G.banner)drawBanner(G.banner);
  }
  cx.restore();
  if(G&&G.freezeT>0){cx.fillStyle=`rgba(150,210,255,${Math.min(.18,G.freezeT*.15)})`;cx.fillRect(0,0,W,H);}
}
function sprite(key,x,y,w,h,flash,red,blue){
  const im=IMG[key];if(!im)return false;
  cx.drawImage(im,x,y,w,h);
  if(blue>0&&SIL[key+'b']){cx.globalAlpha=blue;cx.drawImage(SIL[key+'b'],x,y,w,h);cx.globalAlpha=1;}
  if(red>0&&SIL[key+'r']){cx.globalAlpha=red;cx.drawImage(SIL[key+'r'],x,y,w,h);cx.globalAlpha=1;}
  if(flash>0&&SIL[key+'w']){cx.globalAlpha=Math.min(1,flash*5);cx.drawImage(SIL[key+'w'],x,y,w,h);cx.globalAlpha=1;}
  return true;
}
function drawMonster(e,isNear,t){
  const th=theme(),hy=hitY(),danger=e.y>hy-150*SC&&!e.dying;
  const key=e.boss?'boss':'m'+e.kind,im=IMG[key];
  const frozen=G.freezeT>0;
  let h=e.boss?e.bh:e.r*2,w=e.boss?e.bw:(im?h*im.width/im.height:h*.8);
  const appear=clamp((t-e.born)/.45,0,1);
  const tt=frozen?0:t;
  const step=Math.sin(tt*9+e.ph);
  const sy=1+.05*step,sxs=1-.04*step,rot=(e.boss?.025:.08)*Math.sin(tt*4.5+e.ph);
  const dk=e.dying>0?1-e.dying/.35:0;

  cx.fillStyle='rgba(0,0,0,.1)';cx.beginPath();cx.ellipse(e.x,e.y+h/2+2,w*.36*(1-dk),5*SC,0,0,7);cx.fill();
  cx.save();cx.translate(e.x+jit,e.y+h/2);cx.rotate(rot+dk*1.4);
  const pop=appear<1?1+Math.sin(appear*Math.PI)*.15:1;
  cx.scale(sxs*pop*(1-dk*.7),sy*pop*(1-dk*.7));

  const pulse=danger&&isNear?.18+.14*Math.sin(t*10):0;
  if(!sprite(key,-w/2,-h,w,h,e.flash,pulse,frozen?.45:0)){cx.fillStyle='#ff9fd0';cx.beginPath();cx.arc(0,-h/2,h/2,0,7);cx.fill();}
  if(e.dying>0){cx.strokeStyle=PENCIL;cx.lineWidth=3.5*SC;cx.lineCap='round';cx.beginPath();const n=Math.floor(dk*14);for(let i=0;i<=n;i++){cx.lineTo(-w/2+i/14*w+(hh(e.id+i)-.5)*6,-h/2+(i%2?-h*.38:h*.38)+(hh(e.id*2+i)-.5)*8);}cx.stroke();}
  cx.restore();

  cx.save();cx.translate(lx+tw/2,ly+lh/2);cx.rotate(sw);cx.scale(appear,appear);
  cx.strokeStyle=th.deco==='board'||th.deco==='blue'?'#ffffff66':'#22305c66';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,lh/2);cx.lineTo(e.x-(lx+tw/2),lh/2+8*SC);cx.stroke();
  cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(-tw/2+3,-lh/2+4,tw,lh);
  cx.fillStyle=danger&&isNear?'#fff1ee':'#fffbe0';cx.fillRect(-tw/2,-lh/2,tw,lh);
  cx.fillStyle='#efe3b4cc';cx.save();cx.rotate(.08);cx.fillRect(-tw*.18,-lh/2-7*SC,tw*.36,13*SC);cx.restore();
  cx.textBaseline='middle';cx.textAlign='center';cx.fillStyle='#22305c';cx.fillText(wd.th,0,2);

  cx.restore();
}
function drawFort(t){

function drawSweep(){

function drawHint(e){

function drawFloat(f){

function drawBanner(b){

      <button class="mbtn" type="button" id="goWords">${NAV.words}สมุดคำศัพท์<small>${learned}/${total}</small></button>
    </div>
    <div class="toggles"><button class="chk" type="button" id="tSfx"><i>${OPT.sfx?'✓':''}</i>เสียง</button><button class="chk" type="button" id="tMus"><i>${OPT.music?'✓':''}</i>เพลง</button><button class="chk" type="button" id="tVoice"><i>${OPT.voice?'✓':''}</i>อ่านคำ</button></div>`);
  $('#goPlay').onclick=()=>{SFX.tap();map(curBook);};
  $('#goShop').onclick=()=>{SFX.tap();shop('up');};
  $('#goWords').onclick=()=>{SFX.tap();words(curBook);};
  const tg=(id,key)=>{$(id).onclick=e=>{audio();OPT[key]=!OPT[key];e.currentTarget.querySelector('i').textContent=OPT[key]?'✓':'';store.set('nm-opt',OPT);};};
  tg('#tSfx','sfx');tg('#tMus','music');tg('#tVoice','voice');
}
const bookTabs=(sel,attr)=>`<div class="tabs">${BOOK_ORDER.map(k=>`<button class="tab" type="button" ${attr}="${k}" style="--c:${BOOKS[k].c}" aria-pressed="${k===sel}">${BOOKS[k].name} <small>${BOOKS[k].lvl.split(' ')[0]}</small></button>`).join('')}</div>`;
function map(k){
  state='menu';curBook=k;store.set('nm-curbook',k);
  const B=BOOKS[k],pr=P.prog[k],n=B.stages.length;
  const next=pr.filter(Boolean).length;
  let lastU=-1,dots='';
  B.info.forEach((inf,i)=>{
    if(inf.unit!==lastU){if(lastU>=0)dots+='</div>';lastU=inf.unit;const done=B.info.filter(x=>x.unit===inf.unit).every((x,j,arr)=>pr[B.info.indexOf(x)]);dots+=`<h3 class="unit ${done?'ok':''}">${esc(inf.uname)}</h3><div class="dots">`;}
    const st=pr[i]||0,open=i<=next,boss=i===n-1;
    dots+=`<button class="dot ${st?'done':''} ${i===next&&open?'next':''} ${open?'':'lock'} ${boss?'boss':''}" type="button" data-s="${i}" ${open?'':'disabled'}><b>${boss?'B':i+1}</b><span class="st">${st?'★'.repeat(st)+`<span class="no">${'★'.repeat(3-st)}</span>`:''}</span></button>`;});
  if(lastU>=0)dots+='</div>';
  const best=P.endless[k]||0;
  show(`<div class="topbar"><button class="back" type="button" id="back" aria-label="กลับ">←</button><h2>เลือกด่าน</h2>${coinsTag()}</div>
    ${bookTabs(k,'data-b')}
    <div class="bookinfo">${B.lvl} · ★ ${bookStars(k)}/${n*3} · เก็บคำ ${learnedIn(k)}/${B.words.length}</div>
    <div class="scroll" id="mapScroll">${dots}</div>
    <button class="endless" type="button" id="endless" ${bookDone(k)?'':'disabled'}>∞ โหมดไม่รู้จบ ${bookDone(k)?(best?'· สถิติ '+fmt(best):''):'· ผ่านครบทุกด่านก่อน'}</button>`);
  $('#back').onclick=home;
  panel.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{SFX.tap();map(b.dataset.b);});
  panel.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{SFX.tap();preStage(k,+b.dataset.s);});
  $('#endless').onclick=()=>start('endless',k,0);
  const nx=panel.querySelector('.dot.next');if(nx)nx.scrollIntoView({block:'center'});
}
function preStage(k,i){
  const ws=BOOKS[k].stages[i],last=i===BOOKS[k].stages.length-1;
  show(`<div class="topbar"><button class="back" type="button" id="back" aria-label="กลับ">←</button><h2>ด่าน ${i+1}${last?' · บอสใหญ่':''}</h2></div>
    <div class="bookinfo">${esc(BOOKS[k].info[i].uname)}${BOOKS[k].info[i].parts>1?' '+BOOKS[k].info[i].part+'/'+BOOKS[k].info[i].parts:''} · ${ws.length} คำ · แตะเพื่อฟัง</div>
    <div class="scroll"><div class="wgrid">${ws.map(w=>`<button class="wi" type="button" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.th)}</span></button>`).join('')}</div></div>
    <button class="btn" type="button" id="go">เริ่มด่าน</button>`);
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{audio();speak(b.dataset.say,true);});
  $('#back').onclick=()=>map(k);$('#go').onclick=()=>start('stage',k,i);
}
function words(k){
  state='menu';curBook=k;
  const B=BOOKS[k],L=LEARNED,Wk=new Set(B.words.filter(w=>WEAK.has(w.en)).map(w=>w.en));
  show(`<div class="topbar"><button class="back" type="button" id="back" aria-label="กลับ">←</button><h2>สมุดคำศัพท์</h2></div>
    ${bookTabs(k,'data-b')}
    <div class="bookinfo">${B.lvl} · เก็บแล้ว ${learnedIn(k)}/${B.words.length} · ต้องทบทวน ${Wk.size}</div>
    <div class="scroll"><div class="wgrid">${B.words.map(w=>{const cls=Wk.has(w.en)?'weak':L.has(w.en)?'':'unk';return `<button class="wi ${cls}" type="button" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.th)}</span><i>${Wk.has(w.en)?'ทวน':L.has(w.en)?'✓':''}</i></button>`;}).join('')}</div></div>`);
  $('#back').onclick=home;
  panel.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>words(b.dataset.b));
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{audio();speak(b.dataset.say,true);});
}
function shop(tab){
  state='menu';
  let body='';
  if(tab==='up')body=UPGRADES.map(u=>{const L=up(u.id),maxed=L>=u.max,price=u.cost[L];
    return `<div class="item"><span class="ic">${ICON[u.id]}</span><span class="tx"><b>${u.n}</b><small>${u.d}</small><span class="lvp">${Array.from({length:u.max},(_,i)=>`<i class="${i<L?'on':''}"></i>`).join('')}</span></span>${maxed?'<span class="buy own">เต็มแล้ว</span>':`<button class="buy" type="button" data-up="${u.id}" ${P.coins<price?'disabled':''}>${COIN}${fmt(price)}</button>`}</div>`;}).join('');
  else body=PENS.map(p=>{const own=P.owned.includes(p.id),using=P.pen===p.id;
    return `<div class="item"><span class="ic">${penIcon(p)}</span><span class="tx"><b>${p.n}</b><small>${p.d}</small></span>${using?'<span class="buy use">ใช้อยู่</span>':own?`<button class="buy own" type="button" data-use="${p.id}">ใช้</button>`:`<button class="buy" type="button" data-pen="${p.id}" ${P.coins<p.cost?'disabled':''}>${COIN}${fmt(p.cost)}</button>`}</div>`;}).join('');
  show(`<div class="topbar"><button class="back" type="button" id="back" aria-label="กลับ">←</button><h2>ร้านค้า</h2>${coinsTag()}</div>
    <div class="tabs"><button class="tab" type="button" data-t="up" style="--c:#4f9d69" aria-pressed="${tab==='up'}">อัปเกรดป้อม</button><button class="tab" type="button" data-t="pen" style="--c:#c8553d" aria-pressed="${tab==='pen'}">ปากกา</button></div>
    <div class="scroll"><div class="shopgrid">${body}</div></div>`);
  $('#back').onclick=home;
  panel.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>shop(b.dataset.t));
  panel.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const u=UPGRADES.find(x=>x.id===b.dataset.up),price=u.cost[up(u.id)];if(P.coins<price)return;P.coins-=price;P.up[u.id]=up(u.id)+1;save();audio();SFX.coin();toast('อัปเกรดแล้ว');shop('up');});
  panel.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>{const p=PENS.find(x=>x.id===b.dataset.pen);if(P.coins<p.cost)return;P.coins-=p.cost;P.owned.push(p.id);P.pen=p.id;save();audio();SFX.coin();toast('ได้ '+p.n+' แล้ว');shop('pen');});
  panel.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{P.pen=b.dataset.use;save();SFX.tap();shop('pen');});
}
function start(mode,book,stage){
  audio();SFX.tap();
  if(matchMedia('(pointer:coarse)').matches){try{document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}
  hide();typed='';newRun(mode,book,stage);
}
function offerSkills(){
  const avail=Object.keys(SKILLS).filter(k=>(G.sk[k]||0)<3);
  const byB={acc:[],spd:[],def:[]};avail.forEach(k=>byB[SKILLS[k].br].push(k));
  let out=['acc','spd','def'].map(b=>byB[b].length?rpick(G.ro,byB[b]):null).filter(Boolean);
  const want=up('pick')?4:3;
  const rest=rshuffle(G.ro,avail.filter(k=>!out.includes(k)));while(out.length<want&&rest.length)out.push(rest.pop());
  return out.slice(0,want);
}
function showPick(){
  if(!G)return;state='pick';
  const opts=offerSkills();
  if(!opts.length){nextWave();return;}
  const cards=opts.map(k=>{const s=SKILLS[k],b=BR[s.br],L=G.sk[k]||0;
    return `<button class="card" type="button" data-k="${k}" style="--b:${b.c};--bg:${b.bg}"><span class="br">${b.n}</span><span class="disc">${ICON[k]}</span><span class="n">${s.n}</span><span class="lv">${[0,1,2].map(i=>`<i class="${i<L?'on':i===L?'nx':''}"></i>`).join('')}</span><span class="d">${s.d[L]}</span></button>`;}).join('');
  const brs=Object.entries(BR).map(([k,b])=>{const n=brCount(k);return `<span style="color:${b.c}">${b.n} ${'●'.repeat(Math.min(4,n))}${'○'.repeat(Math.max(0,4-n))}${n>=4?' '+BRANCH_BONUS[k]:''}</span>`;}).join(' · ');
  show(`<h2 class="big">เลือก 1 สกิล</h2><div class="scroll"><div class="cards">${cards}</div></div><div class="bookinfo">${brs}</div>`);
  panel.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    if(state!=='pick')return;state='picked';
    const k=b.dataset.k;SFX.sticker();b.classList.add('peel');
    G.sk[k]=(G.sk[k]||0)+1;
    if(k==='plaster'){const L=G.sk[k];G.maxHp=Math.min(10,G.maxHp+1);G.hp=Math.min(G.maxHp,G.hp+(L>=3?2:1));}
    skillsUI();
    setTimeout(()=>{hide();nextWave();},380);
  });
}
/* end of a stage or run: stars, coins, unlocks */
function runEnd(won){
  if(!G)return;state='over';save();
  const k=G.book,i=G.stage,mode=G.mode;
  let coins=0,head='',extra='',stars=0,bookFinished=false;
  if(mode==='stage'){
    if(won){
      const lost=G.startHp-G.hp;stars=lost===0&&G.wrong<=2?3:lost<=2?2:1;
      const prev=P.prog[k][i]||0;
      coins=10+stars*5;
      if(!prev)coins+=30;
      if(stars>prev)coins+=(stars-prev)*10;
      coins+=G.newWords*2;
      const wasDone=bookDone(k);
      P.prog[k][i]=Math.max(prev,stars);
      if(!wasDone&&bookDone(k)){bookFinished=true;coins+=150;}
      head=bookFinished?`<h2 class="big green">จบ${BOOKS[k].name}!</h2>`:`<h2 class="big green">ผ่านด่าน ${i+1}!</h2>`;
      extra=`<div class="stars">${[0,1,2].map(n=>`<span class="${n<stars?'':'no'}">★</span>`).join('')}</div>`;
      SFX.win();
    }else{coins=G.newWords*2;head=`<h2 class="big red">ป้อมแตก!</h2>`;}
  }else{
    coins=Math.floor(G.score/40)+G.newWords*2;
    const nb=G.score>(P.endless[k]||0);if(nb)P.endless[k]=G.score;
    head=`<h2 class="big red">ป้อมแตก!</h2>`;extra=`<div class="gain" style="color:var(--ink)">${fmt(G.score)} แต้ม</div>${nb?'<span class="newrec">สถิติใหม่!</span>':''}`;
  }
  P.coins+=coins;save();
  const hasNext=mode==='stage'&&won&&i+1<BOOKS[k].stages.length;
  show(`${head}${extra}
    <div class="gain">+${COIN}${fmt(coins)}</div>
    ${bookFinished?'<div class="bookinfo">ปลดล็อกโหมดไม่รู้จบแล้ว</div>':''}
    <div class="stats"><div><b>${G.learned.size}</b>คำถูก</div><div><b>${G.best}</b>คอมโบ</div>${G.newWords?`<div><b>+${G.newWords}</b>คำใหม่</div>`:''}${mode==='stage'?`<div><b>${fmt(G.score)}</b>แต้ม</div>`:`<div><b>${G.wave}</b>หน้า</div>`}</div>
    ${G.missed.length?`<div class="scroll" style="max-height:22vh"><div class="wgrid">${G.missed.map(w=>`<button class="wi weak" type="button" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.th)}</span><i>ทวน</i></button>`).join('')}</div></div>`:''}
    <div class="row">${hasNext?'<button class="btn" type="button" id="next">ด่านต่อไป</button>':''}<button class="btn ${hasNext?'plain':''}" type="button" id="again">${won?'เล่นซ้ำ':'ลองใหม่'}</button><button class="btn plain" type="button" id="toMap">แผนที่</button></div>`);
  if(coins>0)setTimeout(()=>SFX.coin(),300);
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,true));
  if(hasNext)$('#next').onclick=()=>preStage(k,i+1);
  $('#again').onclick=()=>start(mode,k,i);
  $('#toMap').onclick=()=>map(k);
}
function pause(){
  if(state!=='play')return;state='paused';
  show(`<h2 class="big">พัก</h2><div class="row"><button class="btn" type="button" id="resume">เล่นต่อ</button><button class="btn plain" type="button" id="quit">ออกจากด่าน</button></div>`);
  $('#resume').onclick=()=>{hide();state='play';last=performance.now();};
  $('#quit').onclick=()=>{const k=G?G.book:curBook;save();map(k);};
  $('#resume').focus();
}
$('#pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(e.key==='Escape'){pause();return;}
  if(/^[1-4]$/.test(e.key)&&!typed){fire(+e.key-1);return;}
  if(e.key===' '&&!typed){e.preventDefault();useEraser();return;}
  if(e.key==='Backspace'){typed=typed.slice(0,-1);e.preventDefault();return;}
  if(e.key==='Enter'){typed='';return;}
  if(/^[a-zA-Z ]$/.test(e.key)){
    typed=(typed+e.key.toLowerCase()).slice(0,20);
    const on=live().map(cur),ex=on.find(w=>w.en===typed);
    if(ex){fire(ex);typed='';return;}
    if(!on.some(w=>w.en.startsWith(typed))&&!G.slots.some(s=>s&&s.en.startsWith(typed))){SFX.bad();typed='';}
  }
});

window.__nm=()=>G;window.__P=()=>P;
fit();home();requestAnimationFrame(frame);
})();
</script>
