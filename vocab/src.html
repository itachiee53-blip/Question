<title>Notebook Monsters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: a page of a Thai exercise book. Left margin = HUD (pause, page, hearts). Canvas = the page, re-drawn per chapter. Bottom desk strip = four sticky-note answers. */
:root{
  --paper:#fbfaf3; --rule:#b9cbe6; --margin:#e57373; --desk:#5b4636;
  --ink:#22305c; --red:#d8342c; --ok:#1f8a4c; --side:#22305c;
  --hl-y:#fff04d; --hl-p:#ff9fd0; --hl-g:#9cf08f; --hl-b:#8fd6ff;
  --acc:#e2463d; --spd:#e6a700; --def:#2f7fd1;
  --tape:#efe3b4;
  --f-th:"Itim",system-ui,sans-serif;
  --f-en:"Patrick Hand","Itim",system-ui,sans-serif;
  --f-mark:"Permanent Marker","Itim",system-ui,sans-serif;
  --hand:255px 18px 225px 18px/18px 225px 18px 255px;
  --mx:56px;
  color-scheme:light;
}
html,body{height:100%;background:var(--desk);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:var(--f-th);-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:none;border:0;padding:0}
button:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
input{font:inherit}

.game{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.side{position:absolute;left:env(safe-area-inset-left,0px);top:0;bottom:0;width:var(--mx);display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;pointer-events:none;color:var(--side)}
.pause{pointer-events:auto;width:40px;height:36px;border:2.5px solid var(--ink);border-radius:var(--hand);background:var(--paper);color:var(--ink);font-family:var(--f-en);font-size:20px;line-height:1}
.pg{font-family:var(--f-en);font-size:15px;line-height:1;text-align:center}
.pg b{display:grid;place-items:center;width:38px;height:38px;margin:2px auto 0;border:2.5px solid var(--red);border-radius:50%;font-size:22px;font-weight:400;color:var(--red);transform:rotate(-6deg);background:#fff8}
.pg.turn b{animation:stamp .5s}
.hearts{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;line-height:1;color:var(--red);text-shadow:0 1px 0 #fff8}
.hearts span.drop{animation:drop .7s forwards}
@keyframes drop{30%{transform:scale(1.5) rotate(-10deg)}100%{transform:translateY(40px) rotate(40deg);opacity:0}}
.shield{font-family:var(--f-en);font-size:15px;color:var(--def);text-align:center;line-height:1.1;background:#fff9;border-radius:6px;padding:0 3px}
.shield:empty{display:none}

.tr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.tape{background:var(--tape);color:var(--ink);padding:2px 14px 3px;font-family:var(--f-en);font-size:26px;line-height:1.2;clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,3% 96%,0 50%);transform:rotate(-1.5deg);min-width:80px;text-align:right}
.target{font-family:var(--f-th);font-size:15px;background:#fff;border:2px solid var(--red);color:var(--red);border-radius:var(--hand);padding:0 10px;transform:rotate(1.5deg)}
.target.won{background:var(--ok);border-color:var(--ok);color:#fff;animation:bump .4s}
.combo{font-family:var(--f-en);font-size:26px;color:var(--red);transform:rotate(4deg);background:#fff9;border-radius:8px;padding:0 6px}
.combo.bump{animation:bump .25s}
.myskills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.myskills i{position:relative;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #0003;display:grid;place-items:center;font-style:normal;background:#fff}
.myskills i svg{width:18px;height:18px}
.myskills i b{position:absolute;right:-5px;bottom:-5px;font-family:var(--f-en);font-weight:400;font-size:12px;background:var(--ink);color:#fff;border-radius:8px;min-width:14px;line-height:14px;text-align:center}
@keyframes bump{50%{transform:scale(1.3) rotate(-4deg)}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}

.eraser{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:80px;height:44px;border-radius:10px 10px 12px 12px;background:linear-gradient(90deg,#ff8fa7 0 55%,#3c6fd1 55% 100%);border:2.5px solid var(--ink);transform:rotate(-8deg);box-shadow:3px 4px 0 #0003;transition:transform .1s}
.eraser:active{transform:rotate(-8deg) scale(.92)}
.eraser b{position:absolute;left:-10px;top:-12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-en);font-size:17px;font-weight:400;transform:rotate(8deg)}
.eraser[disabled]{filter:grayscale(1);opacity:.5}
.eraser.ready{animation:nudge 1.4s infinite}
@keyframes nudge{0%,80%,100%{transform:rotate(-8deg)}85%{transform:rotate(-14deg) scale(1.06)}90%{transform:rotate(-2deg) scale(1.06)}95%{transform:rotate(-12deg)}}
.shav{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:64px;width:74px;height:8px;border:2px solid var(--ink);border-radius:var(--hand);overflow:hidden;background:#fff}
.shav i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#e8b26a 0 6px,#c98a3d 6px 9px);transition:width .25s}
.typed{position:absolute;left:50%;bottom:32%;transform:translateX(-50%) rotate(-2deg);font-family:var(--f-en);font-size:34px;color:var(--ink);background:linear-gradient(transparent 55%,var(--hl-y) 55% 90%,transparent 90%);padding:0 6px;pointer-events:none}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:10px;padding:6px 16px;font-size:17px;animation:fade .2s}

.flip{position:absolute;inset:0;pointer-events:none;background:var(--flipbg,var(--paper));transform-origin:left center;box-shadow:-20px 0 40px #0004;opacity:0}
.flip.go{animation:flip .8s cubic-bezier(.5,0,.75,0) forwards}
@keyframes flip{0%{opacity:1;transform:perspective(1800px) rotateY(0)}100%{opacity:1;transform:perspective(1800px) rotateY(-95deg)}}

.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--desk);box-shadow:inset 0 8px 10px -6px #0006}
.note{--c:var(--hl-y);--r:-1.6deg;position:relative;min-height:60px;background:var(--c);transform:rotate(var(--r));box-shadow:2px 5px 0 #0003,inset 0 -10px 14px -12px #0003;font-family:var(--f-en);font-size:clamp(20px,2.8vw,30px);line-height:1.05;padding:6px;overflow-wrap:anywhere;transition:transform .08s;color:var(--ink)}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:46%;height:16px;transform:translateX(-50%) rotate(2deg);background:#f4ecc9cc}
.note:nth-child(2){--c:var(--hl-p);--r:1.2deg} .note:nth-child(3){--c:var(--hl-g);--r:-.8deg} .note:nth-child(4){--c:var(--hl-b);--r:1.8deg}
.note .k{position:absolute;left:7px;bottom:3px;font-size:13px;opacity:.45}
.note .tick{position:absolute;right:6px;top:2px;font-family:var(--f-mark);color:var(--ok);font-size:26px;opacity:0}
.note:active{transform:rotate(var(--r)) translateY(3px) scale(.96);box-shadow:1px 2px 0 #0003}
.note.new{animation:stick .32s ease-out}
@keyframes stick{from{transform:rotate(calc(var(--r) - 10deg)) translateY(-18px) scale(.9);opacity:0}}
.note.ok .tick{animation:tick .5s}
.note.ok{animation:yes .35s}
@keyframes tick{0%{opacity:0;transform:scale(2)}30%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes yes{40%{transform:rotate(var(--r)) translateY(-6px) scale(1.04)}}
.note.bad .w{text-decoration:line-through 3px var(--red)}
.note.bad{animation:nope .35s}
@keyframes nope{25%{transform:rotate(var(--r)) translateX(-7px)}75%{transform:rotate(var(--r)) translateX(7px)}}
.note.hint{animation:wig .6s infinite}
@keyframes wig{50%{transform:rotate(calc(var(--r) + 3deg)) scale(1.05)}}
.note.match{outline:3px solid var(--ink);outline-offset:2px}
.bar.lock .note{filter:saturate(.25) brightness(.95)}
@media (max-width:560px) and (orientation:portrait){.bar{grid-template-columns:1fr 1fr;gap:12px 10px}.note{min-height:52px}}
@media (orientation:landscape) and (max-height:480px){.note{min-height:40px;font-size:21px;padding:3px 6px}.bar{padding-top:9px;gap:10px}.hearts{font-size:18px}.pg b{width:32px;height:32px;font-size:19px}.side{gap:6px}.tape{font-size:22px}}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:#3b2d22cc;overflow:auto;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(780px,100%);margin:auto;background:#fbfaf3;background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px 48px,transparent 48px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);padding:24px 22px 22px 64px;box-shadow:0 10px 0 -4px #e9e4d2,0 12px 30px #0006;transform:rotate(-.6deg);animation:slide .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes slide{from{transform:translateY(60px) rotate(-4deg);opacity:0}}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:90px;height:26px;background:#f1e6bccc}
.sheet::before{left:30px;transform:rotate(-8deg)} .sheet::after{right:30px;transform:rotate(7deg)}
.holes{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly}
.holes i{width:16px;height:16px;border-radius:50%;background:#3b2d22;box-shadow:inset 0 2px 3px #0008}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:var(--ink)}
.panel>*{animation:rise .45s backwards}
.panel>*:nth-child(2){animation-delay:.06s}.panel>*:nth-child(3){animation-delay:.12s}.panel>*:nth-child(4){animation-delay:.18s}.panel>*:nth-child(5){animation-delay:.24s}.panel>*:nth-child(6){animation-delay:.3s}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.title{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(36px,7vw,68px);line-height:.95;transform:rotate(-2deg)}
.title span{display:inline-block;background:linear-gradient(transparent 50%,var(--hl-y) 50% 88%,transparent 88%);padding:0 8px;animation:wob 3s ease-in-out infinite}
.title small{display:block;font-family:var(--f-th);font-size:.38em;color:var(--red);margin-top:6px}
@keyframes wob{50%{transform:rotate(1.5deg)}}
.cast{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:58px}
.cast img{height:48px;animation:hop 1.2s ease-in-out infinite}
.cast img:nth-child(2){animation-delay:.15s}.cast img:nth-child(3){animation-delay:.3s}.cast img:nth-child(4){animation-delay:.45s}.cast img:nth-child(5){animation-delay:.6s}.cast img:nth-child(6){animation-delay:.75s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.duel{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--red);border-radius:var(--hand);padding:8px 14px;transform:rotate(-1deg);text-align:left;box-shadow:3px 4px 0 #d8342c55}
.duel b{font-family:var(--f-en);font-weight:400;font-size:26px;color:var(--red)}
.duel .t{line-height:1.25}
.modes{display:flex;gap:0;border:2.5px solid var(--ink);border-radius:var(--hand);overflow:hidden;background:#fff}
.modes button{padding:5px 16px;font-size:18px}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.namebox{display:flex;align-items:center;gap:8px;font-size:17px}
.namebox input{width:150px;border:0;border-bottom:2px dashed var(--ink);background:transparent;font-size:19px;padding:2px 4px;color:var(--ink);text-align:center}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
@media (max-width:560px){.books{grid-template-columns:1fr}}
.book{--c:#4f9d69;background:var(--c);border-radius:4px 10px 10px 4px;padding:14px 12px 12px 22px;box-shadow:inset 10px 0 0 #0002,4px 5px 0 #0003;text-align:left;transition:transform .15s}
.book:hover{transform:translateY(-5px) rotate(-1.5deg)}
.book:active{transform:scale(.97)}
.book:nth-child(2){--c:#3f6fb5} .book:nth-child(3){--c:#c8553d}
.lbl{background:#fff;border:2px solid #0003;border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;font-size:16px;line-height:1.35;color:var(--ink)}
.lbl .r{border-bottom:1.5px dotted #0004;display:flex;gap:6px;align-items:baseline}
.lbl .r em{font-style:normal;color:#0009;min-width:3em}
.lbl .r:first-child{font-size:20px}
.lbl b{font-family:var(--f-en);font-weight:400;font-size:19px}
.meter{height:7px;border-radius:4px;background:#0001;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.toggles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:18px}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk i{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:var(--hand);display:grid;place-items:center;font-style:normal;font-family:var(--f-mark);color:var(--red);font-size:18px;line-height:1}
.big{margin:0;font-family:var(--f-mark);font-weight:400;font-size:clamp(30px,6vw,50px);line-height:1.05;transform:rotate(-1.5deg)}
.big.red{color:var(--red);border:4px solid var(--red);border-radius:var(--hand);padding:2px 18px;animation:stampB .5s cubic-bezier(.3,1.6,.5,1) backwards}
.big.green{color:var(--ok);border:4px solid var(--ok);border-radius:var(--hand);padding:2px 18px;animation:stampB .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes stampB{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.btn{font-family:var(--f-th);font-size:21px;padding:8px 24px;border:3px solid var(--ink);border-radius:var(--hand);background:var(--hl-y);box-shadow:3px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;color:var(--ink)}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--ink)}
.btn.plain{background:#fff}
.btn.red{background:var(--red);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.score-big{font-family:var(--f-en);font-size:clamp(52px,10vw,84px);line-height:.9;color:var(--ink)}
.stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-size:16px}
.stats b{display:block;font-family:var(--f-en);font-weight:400;font-size:30px;line-height:1}
.rank{width:min(420px,100%);display:flex;flex-direction:column;gap:2px;text-align:left}
.rank div{display:flex;gap:10px;align-items:baseline;padding:3px 8px;border-bottom:1.5px dashed #0002;font-size:18px}
.rank div.me{background:linear-gradient(transparent 40%,var(--hl-y) 40% 90%,transparent 90%)}
.rank em{font-style:normal;font-family:var(--f-en);width:22px;color:var(--red)}
.rank span{flex:1}
.rank b{font-family:var(--f-en);font-weight:400;font-size:22px}
.linkbox{width:100%;font-size:14px;border:2px dashed var(--ink);border-radius:8px;padding:6px;background:#fff;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{--b:var(--acc);position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 10px 10px;background:#fff;border:3px solid var(--b);border-radius:14px;box-shadow:4px 5px 0 #0002;transition:transform .15s;animation:popin .45s cubic-bezier(.3,1.7,.5,1) backwards;color:var(--ink)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes popin{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.card:hover{transform:rotate(-2deg) translateY(-4px)}
.card.peel{animation:peel .35s ease-in forwards}
@keyframes peel{to{transform:translateY(-60px) rotate(25deg) scale(1.15);opacity:0}}
.card .br{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;font-size:14px;border-radius:999px;padding:0 10px;white-space:nowrap}
.card .disc{width:76px;height:76px;border-radius:50%;background:var(--bg,#fff);border:5px solid #fff;box-shadow:0 0 0 3px var(--b);display:grid;place-items:center;margin-top:6px}
.card .disc svg{width:46px;height:46px}
.card .n{font-size:20px}
.card .lv{display:flex;gap:4px}
.card .lv i{width:12px;height:12px;border-radius:50%;border:2px solid var(--b)}
.card .lv i.on{background:var(--b)}
.card .lv i.nx{background:var(--b);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.25}}
.card .d{font-size:15px;color:#444;min-height:2.6em;line-height:1.3}
.branches{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:15px}
.branches span{display:inline-flex;gap:4px;align-items:center}
.branches i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.branches i.on{background:currentColor}
.missed{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;max-width:100%;font-size:16px}
.mw{display:inline-flex;gap:6px;align-items:baseline}
.mw b{font-family:var(--f-en);font-weight:400;font-size:20px;color:var(--red)}
.newrec{font-family:var(--f-mark);color:var(--red);border:3px solid var(--red);border-radius:var(--hand);padding:2px 12px;transform:rotate(-6deg);font-size:20px}
@media (orientation:landscape) and (max-height:480px){.sheet{padding:14px 16px 12px 58px}.panel{gap:7px}.title{font-size:38px}.cast{height:40px}.cast img{height:34px}.book{padding:8px 10px 8px 18px}.card .disc{width:56px;height:56px}.card .disc svg{width:34px;height:34px}.card{padding:10px 8px 8px}.score-big{font-size:48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="game" id="game">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="flip" id="flip"></div>
    <div class="side">
      <button class="pause" type="button" id="pauseBtn" aria-label="พัก">II</button>
      <div class="pg" id="pg">หน้า<b id="pageN">1</b></div>
      <div class="hearts" id="hearts" aria-label="หัวใจ"></div>
      <div class="shield" id="shield"></div>
    </div>
    <div class="tr">
      <span class="tape" id="score">0</span>
      <span class="target" id="target" hidden></span>
      <span class="combo" id="combo" hidden></span>
      <div class="myskills" id="myskills"></div>
    </div>
    <div class="shav"><i id="shav"></i></div>
    <button class="eraser" type="button" id="eraser" aria-label="ยางลบยักษ์"><b id="eraserN">1</b></button>
    <div class="typed" id="typed"></div>
  </div>
  <div class="bar" id="bar">
    <button class="note" type="button" data-i="0"><span class="w">…</span><span class="k">1</span><span class="tick">✓</span></button>
    <button class="note" type="button" data-i="1"><span class="w">…</span><span class="k">2</span><span class="tick">✓</span></button>
    <button class="note" type="button" data-i="2"><span class="w">…</span><span class="k">3</span><span class="tick">✓</span></button>
    <button class="note" type="button" data-i="3"><span class="w">…</span><span class="k">4</span><span class="tick">✓</span></button>
  </div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"><div class="holes"><i></i><i></i><i></i></div><div class="panel" id="panel"></div></div></div>

<script>
const ART=/*ART*/{};
(()=>{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
// seeded randomness: same seed = same monsters, words and skill offers, so friends race on the same run

let ac=null,nb=null,master=null;
function audio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=1;master.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}ac.resume();}catch(e){ac=null;}}
function nz(d,v,type,f,q=1,at=0,f2){
  if(!ac||!OPT.sfx)return;const t=ac.currentTime+at,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nb;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(master);s.start(t,Math.random()*.3);s.stop(t+d+.02);
}
function tn(f,d,type='sine',v=.08,f2=0,at=0){
  if(!ac||!OPT.sfx)return;note(f,d,type,v,f2,ac.currentTime+at);
}
function note(f,d,type,v,f2,t){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);
}

const MUS={next:0,step:0};
function music(){
  if(!ac||!OPT.music||state!=='play'||!G)return;
  const th=theme(),spb=60/th.bpm/2,now=ac.currentTime;
  if(MUS.next<now)MUS.next=now+.05;
  while(MUS.next<now+.2){
    const s=MUS.step++,bar=Math.floor(s/8),root=[0,5,3,4][bar%4];
    const sc=th.scale,deg=[0,2,1,3,2,4,3,1][s%8];
    const n=sc[(deg+root)%sc.length]+12*Math.floor((deg+root)/sc.length);
    if(s%2===0||G.combo>=5)note(220*Math.pow(2,(n+12)/12),spb*1.6,th.wave,.022,0,MUS.next);
    if(s%4===0)note(110*Math.pow(2,sc[root%sc.length]/12),spb*3,'sine',.05,0,MUS.next);
    MUS.next+=spb;
  }
}

/* ---------- game state ---------- */

function takeWord(){
  const on=new Set(G.enemies.flatMap(e=>e.words.map(w=>w.en)));
  const weak=mode==='normal'?new Set(WEAK[G.tier]):new Set();
  let pool=G.words.filter(w=>!on.has(w.en)&&!G.recent.includes(w.en));if(!pool.length)pool=G.words.filter(w=>!on.has(w.en));
  const wp=pool.filter(w=>weak.has(w.en));
  const w=wp.length&&G.rw()<.35?rpick(G.rw,wp):rpick(G.rw,pool);
  G.recent.push(w.en);if(G.recent.length>Math.min(25,G.words.length/2))G.recent.shift();return w;
}
function spawn(boss){
  const R=G.rs,mh=monH(),r=boss?0:mh/2;
  let bw=0,bh=0;
  if(boss){bw=Math.min(W*.42,380*SC);bh=bw*(IMG.boss?IMG.boss.height/IMG.boss.width:.6);}
  const half=boss?bw/2:mh*.45;
  const L=MX+half+14,Rr=W-half-(boss?20:130);
  let x=(L+Rr)/2;
  for(let k=0;k<10;k++){x=L+R()*Math.max(0,Rr-L);if(G.enemies.every(e=>Math.abs(e.x-x)>190*SC||e.y>H*.45))break;}
  const T=Math.max(5.5,(G.tier==='hard'?14:G.tier==='mid'?13:12)-G.wave*.45);
  const rad=boss?bh/2:r;
  const y0=8+labelH()*(boss?1.2:1)+12+rad;
  const n=boss?3+Math.floor(G.wave/8):1;
  G.enemies.push({id:G.uid++,x,bx:x,y:y0,words:Array.from({length:n},takeWord),idx:0,boss,r:rad,bw,bh,
    kind:Math.floor(R()*6),vy:Math.max(12,(hitY()-y0-rad))/(boss?T*1.8:T),ph:R()*6,flash:0,born:G.t,seen:G.t,dying:0});
  refreshBar();
}
const cur=e=>e.words[e.idx];
const live=()=>G.enemies.filter(e=>!e.dying);

/* ---------- sticky-note answers ---------- */
const notes=[...document.querySelectorAll('.note')];
function setNote(i,w){G.slots[i]=w;const b=notes[i];b.querySelector('.w').textContent=w?w.en:'…';b.classList.remove('new','bad','ok');void b.offsetWidth;b.classList.add('new');}
function refreshBar(){
  if(!G)return;
  const alive=live().sort((a,b)=>b.y-a.y).map(cur),aliveSet=new Set(alive.map(w=>w.en));
  const have=()=>new Set(G.slots.filter(Boolean).map(w=>w.en));
  for(const w of alive.slice(0,3)){
    if(have().has(w.en))continue;
    let i=G.slots.findIndex(s=>!s||!aliveSet.has(s.en));
    if(i<0)i=G.slots.reduce((bi,s,j)=>alive.findIndex(a=>a.en===s.en)>alive.findIndex(a=>a.en===G.slots[bi].en)?j:bi,0);
    setNote(i,w);
  }
  for(let i=0;i<4;i++)if(!G.slots[i]){const h=have();setNote(i,pick(G.words.filter(w=>!h.has(w.en)&&!aliveSet.has(w.en))));}
}
function replaceSlot(i,delay=0){
  const go=()=>{if(!G)return;const alive=live().sort((a,b)=>b.y-a.y).map(cur),have=new Set(G.slots.filter((s,j)=>s&&j!==i).map(w=>w.en));
    setNote(i,alive.find(w=>!have.has(w.en))||pick(G.words.filter(w=>!have.has(w.en)&&!alive.some(a=>a.en===w.en))));};
  delay?setTimeout(go,delay):go();
}
notes.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();fire(i);}));

/* ---------- combat ---------- */
function fire(slot){
  if(state!=='play'||!G||G.t<G.lockUntil)return;
  const w=typeof slot==='number'?G.slots[slot]:slot;if(!w)return;
  const tg=live().filter(e=>cur(e).en===w.en).sort((a,b)=>b.y-a.y);
  if(!tg.length){
    if(typeof slot==='number'){const b=notes[slot];b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}
    const t=tip();
    if(G.fluid>0){G.fluid--;SFX.shield();G.floats.push({x:t.x,y:t.y-40*SC,text:'ไม่เป็นไร',c:'def',life:1,size:26,font:FONT_TH});return;}
    G.combo=0;G.lockUntil=G.t+.7;SFX.bad();buzz(40);
    G.floats.push({x:t.x,y:t.y-40*SC,text:'ผิด!',c:'bad',life:1,size:30,font:FONT_TH});
    return;
  }
  strike(tg[0]);
  const si=G.slots.findIndex(s=>s&&s.en===w.en);
  if(si>=0){const b=notes[si];b.classList.remove('ok','new');void b.offsetWidth;b.classList.add('ok');
    if(!live().some(x=>cur(x).en===w.en))replaceSlot(si,260);}
}
function strike(e){
  const w=cur(e),t=tip();
  G.strokes.push({x1:t.x,y1:t.y,x2:e.x,y2:e.y,life:.22,id:Math.random()*99,red:lvl('redpen')>0});
  G.recoil=1;SFX.scribble();hitstop=.05;
  G.combo++;G.best=Math.max(G.best,G.combo);G.learned.add(w.en);speak(w.en);
  const bk=BOOK[G.tier];if(!bk.includes(w.en)){bk.push(w.en);G.newWords++;}
  WEAK[G.tier]=WEAK[G.tier].filter(x=>x!==w.en);saveBook();
  if(TUT<3){TUT++;store.set('nm-tut',TUT);}
  // skills that reward correct answers
  const fastLimit=[0,2.5,3,3.5][lvl('shav')],fast=fastLimit&&G.t-e.seen<=fastLimit;
  G.charge+=fast?2:1;if(G.charge>=12){G.charge-=12;G.erasers++;G.floats.push({x:W-70,y:H-110,text:'+1',c:'text',life:1.2,size:28,font:FONT_EN});SFX.sticker();}
  const rp=lvl('redpen');if(rp&&G.combo%[0,6,5,4][rp]===0){G.freezeT=[0,1,1.5,2][rp];SFX.freeze();G.floats.push({x:W/2,y:H*.3,text:'หยุด!',c:'#2f7fd1',life:1,size:40,font:FONT_TH});}
  const bl=lvl('bolt');G.hits.push(G.t);G.hits=G.hits.filter(x=>G.t-x<=3);
  if(bl&&G.hits.length>=3){G.hits=[];G.boltT=[0,2,3,4][bl];SFX.zap();G.floats.push({x:W/2,y:H*.3,text:'ฟ้าผ่า!',c:'#e6a700',life:1,size:40,font:FONT_TH});}
  const height=1-clamp(e.y/hitY(),0,1);
  let pts=(100+height*80+Math.min(G.combo,30)*10)*(e.boss?1.5:1);
  const hl=lvl('hl');if(hl&&e.y<hitY()*.45){pts+=[0,60,120,180][hl];if(hl>=3)for(const o of live())if(o!==e)o.y=Math.max(o.y-30*SC,8+labelH()+12+o.r);}
  pts*=1+[0,.03,.05,.07][lvl('star')]*Math.min(G.combo,20);
  if(brBonus('acc'))pts*=1.1;
  pts=Math.round(pts);G.score+=pts;
  if(CH&&!G.passed&&G.score>CH.p){G.passed=true;SFX.pass();G.floats.push({x:W/2,y:H*.25,text:`แซง ${CH.n} แล้ว!`,c:'good',life:2,size:40,font:FONT_TH,hl:true});}
  G.floats.push({x:e.x,y:e.y-e.r-labelH()-14*SC,text:`${w.en} = ${w.th}`,c:'good',life:1.4,size:22,font:FONT_TH,tick:true});
  G.floats.push({x:e.x+(e.boss?e.bw/2:e.r)+16*SC,y:e.y,text:'+'+pts,c:'bad',life:.9,size:24,font:FONT_EN,circle:true});
  if(e.boss&&e.idx<e.words.length-1){e.idx++;e.flash=.25;e.seen=G.t;shake=Math.max(shake,8);crumbs(e.x,e.y,16);SFX.shield();refreshBar();return;}
  e.dying=.35;e.flash=.12;G.kills++;
  if(G.combo>0&&G.combo%10===0)G.floats.push({x:W/2,y:H*.38,text:`x${G.combo}!`,c:'bad',life:1.4,size:60,font:FONT_EN,hl:true});
}
function crumbs(x,y,n,s=1){for(let i=0;i<n;i++){const a=rnd(-Math.PI,0)+rnd(-.5,.5),v=rnd(80,320)*SC*s;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.5,1),max:1,w:rnd(3,8)*SC,h:rnd(2,4)*SC,rot:rnd(0,6),vr:rnd(-8,8),c:pick(['#ff8fa7','#f3a8b7','#9a9a9a','#c4b49a','#e8b26a'])});}}
function baseHit(e){
  e.dying=-1;const w=cur(e);
  if(G.shield>0){G.shield--;SFX.shield();G.floats.push({x:W/2,y:hitY()-40*SC,text:'กันได้!',c:'def',life:1.1,size:26,font:FONT_TH});if(lvl('cover')>=2){G.freezeT=Math.max(G.freezeT,.8);}}
  else{const dmg=e.boss?3:1;G.hp-=dmg;SFX.thud();buzz(90);shake=18;G.combo=0;G.fortHit=.6;heartsUI(false,dmg);}
  if(!G.missed.some(m=>m.en===w.en))G.missed.push(w);
  if(!WEAK[G.tier].includes(w.en)){WEAK[G.tier].push(w.en);saveBook();}
  G.floats.push({x:W/2,y:hitY()-80*SC,text:`${w.en} = ${w.th}`,c:'bad',life:2.3,size:30,font:FONT_TH,boxed:true});

function useEraser(){

}

/* ---------- update ---------- */
function update(dt){
  if(!G)return;
  if(hitstop>0){hitstop-=dt;return;}
  G.t+=dt;seed=Math.floor(G.t*8)%3;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  G.recoil=Math.max(0,G.recoil-dt*6);G.fortHit=Math.max(0,G.fortHit-dt);
  G.freezeT=Math.max(0,G.freezeT-dt);G.boltT=Math.max(0,G.boltT-dt);
  if(state==='play'){
    if(G.spawnLeft>0){
      G.spawnT-=dt;
      if(G.spawnT<=0&&live().length<Math.min(2+Math.floor(G.wave/2),6)){
        if(G.bossPending){spawn(true);G.bossPending=false;}else{spawn(false);G.spawnLeft--;}
        G.spawnT=Math.max(1.1,3-G.wave*.12)*(.8+G.rs()*.4);
      }
    }else if(!G.enemies.length&&!G.bossPending&&!G.sweep){state='between';setTimeout(showShop,850);}
    const hy=hitY(),sm=speedMul();
    for(const e of G.enemies){
      if(e.dying)continue;
      e.y+=e.vy*sm*dt;if(sm>0)e.x=e.bx+Math.sin(G.t*1.2+e.ph)*10*SC;
      if(e.y+e.r*.8>=hy)baseHit(e);
    }
    G.barT-=dt;if(G.barT<=0){G.barT=.35;refreshBar();}
    music();
  }
  for(const e of G.enemies){e.flash=Math.max(0,e.flash-dt);if(e.dying>0){e.dying-=dt;if(e.dying<=0){e.dying=-1;crumbs(e.x,e.y,e.boss?60:24,e.boss?1.6:1);SFX.pop();}}}
  G.enemies=G.enemies.filter(e=>e.dying!==-1);
  if(G.sweep){
    G.sweep.x+=W*1.5*dt;
    for(const e of G.enemies){if(!e.dying&&e.x<G.sweep.x&&!G.sweep.done.has(e.id)){G.sweep.done.add(e.id);
      if(e.boss&&e.idx<e.words.length-1){e.idx++;e.flash=.3;}else{e.dying=.2;G.score+=40;}}}
    if(G.sweep.x>W+150*SC){G.sweep=null;G.slots=[null,null,null,null];refreshBar();}
  }
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy+=520*SC*dt;p.rot+=p.vr*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0&&p.y<H+20);
  G.strokes.forEach(s=>s.life-=dt);G.strokes=G.strokes.filter(s=>s.life>0);
  G.floats.forEach(f=>{f.life-=dt;f.y-=22*dt;});G.floats=G.floats.filter(f=>f.life>0);
}

/* ---------- draw ---------- */
const col=c=>{const th=theme();return c==='text'?th.text:c==='good'?th.good:c==='bad'?th.bad:c==='def'?'#2f7fd1':c;};
function draw(now){
  cx.setTransform(DPR,0,0,DPR,0,0);
  const th=theme();
  if(!bg||bgKey!==th.name+W+'x'+H)buildBg();

      for(let k=0;k<2;k++){cx.strokeStyle=s.red?'#e2463d':(th.deco==='board'||th.deco==='blue'?'#f6f2e4':PENCIL);cx.lineWidth=(4-k*2)*SC;cx.lineCap='round';cx.beginPath();const n=7;for(let i=0;i<=n;i++){const q=i/n;cx.lineTo(s.x1+(s.x2-s.x1)*q+(i%n?(hh(s.id+i+k)-.5)*10:0),s.y1+(s.y2-s.y1)*q+(i%n?(hh(s.id+i*2+k)-.5)*10:0));}cx.stroke();}
      cx.globalAlpha=1;}

function sprite(key,x,y,w,h,flash,red,blue){
  const im=IMG[key];if(!im)return false;

  if(red>0&&SIL[key+'r']){cx.globalAlpha=red;cx.drawImage(SIL[key+'r'],x,y,w,h);cx.globalAlpha=1;}
  if(flash>0&&SIL[key+'w']){cx.globalAlpha=Math.min(1,flash*5);cx.drawImage(SIL[key+'w'],x,y,w,h);cx.globalAlpha=1;}

}
function drawMonster(e,isNear,t){
  const th=theme(),hy=hitY(),danger=e.y>hy-150*SC&&!e.dying;
  const key=e.boss?'boss':'m'+e.kind,im=IMG[key];

  let h=e.boss?e.bh:e.r*2,w=e.boss?e.bw:(im?h*im.width/im.height:h*.8);
  const appear=clamp((t-e.born)/.45,0,1);
  const tt=frozen?0:t;
  const step=Math.sin(tt*9+e.ph);
  const sy=1+.05*step,sxs=1-.04*step,rot=(e.boss?.025:.08)*Math.sin(tt*4.5+e.ph);
  const dk=e.dying>0?1-e.dying/.35:0;
  const jit=danger&&!frozen?Math.sin(t*40)*1.6:0;
  cx.fillStyle='rgba(0,0,0,.1)';cx.beginPath();cx.ellipse(e.x,e.y+h/2+2,w*.36*(1-dk),5*SC,0,0,7);cx.fill();
  cx.save();cx.translate(e.x+jit,e.y+h/2);cx.rotate(rot+dk*1.4);
  const pop=appear<1?1+Math.sin(appear*Math.PI)*.15:1;
  cx.scale(sxs*pop*(1-dk*.7),sy*pop*(1-dk*.7));
  if(appear<1){cx.beginPath();cx.rect(-w,-h*1.1,w*2,h*1.1*appear+2);cx.clip();}
  const pulse=danger&&isNear?.18+.14*Math.sin(t*10):0;
  if(!sprite(key,-w/2,-h,w,h,e.flash,pulse,frozen?.45:0)){cx.fillStyle='#ff9fd0';cx.beginPath();cx.arc(0,-h/2,h/2,0,7);cx.fill();}
  if(e.dying>0){cx.strokeStyle=PENCIL;cx.lineWidth=3.5*SC;cx.lineCap='round';cx.beginPath();const n=Math.floor(dk*14);for(let i=0;i<=n;i++){cx.lineTo(-w/2+i/14*w+(hh(e.id+i)-.5)*6,-h/2+(i%2?-h*.38:h*.38)+(hh(e.id*2+i)-.5)*8);}cx.stroke();}
  cx.restore();
  if(e.dying)return;
  if(e.boss){for(let i=0;i<e.words.length;i++){cx.beginPath();cx.arc(e.x-(e.words.length-1)*11*SC+i*22*SC,e.y+h/2+12*SC,7*SC,0,7);if(i>=e.idx){cx.fillStyle=RED;cx.fill();}cx.strokeStyle=RED;cx.lineWidth=2;cx.stroke();}}
  const wd=cur(e),fs=(e.boss?26:22)*SC;
  cx.font=`${fs}px ${FONT_TH}`;
  const tw=cx.measureText(wd.th).width+26*SC,lh=fs*1.65;
  const lx=clamp(e.x-tw/2,MX+6,W-tw-6),ly=e.y-h/2-lh-8*SC;
  const sw=frozen?0:Math.sin(t*3+e.ph)*.04;
  cx.save();cx.translate(lx+tw/2,ly+lh/2);cx.rotate(sw);cx.scale(appear,appear);
  cx.strokeStyle=th.deco==='board'||th.deco==='blue'?'#ffffff66':'#22305c66';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,lh/2);cx.lineTo(e.x-(lx+tw/2),lh/2+8*SC);cx.stroke();
  cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(-tw/2+3,-lh/2+4,tw,lh);
  cx.fillStyle=danger&&isNear?'#fff1ee':'#fffbe0';cx.fillRect(-tw/2,-lh/2,tw,lh);
  cx.fillStyle='#efe3b4cc';cx.save();cx.rotate(.08);cx.fillRect(-tw*.18,-lh/2-7*SC,tw*.36,13*SC);cx.restore();
  cx.textBaseline='middle';cx.textAlign='center';cx.fillStyle='#22305c';cx.fillText(wd.th,0,2);
  if(isNear&&danger){cx.strokeStyle=RED;cx.lineWidth=2.8;cx.beginPath();cx.ellipse(0,0,tw/2+10+Math.sin(t*10)*2,lh/2+8,0,.2,Math.PI*2+.4);cx.stroke();}
  cx.restore();
}
function drawFort(t){
  const f=fort();
  const breathe=1+.008*Math.sin(t*2);
  const rk=G?G.recoil:0,hk=G?G.fortHit:0;
  const jx=hk?rnd(-6,6)*hk:0;

  cx.save();cx.translate(W/2+jx,H);cx.scale(breathe*(1+rk*.025),breathe*(1-rk*.045));
  if(!sprite('base',-f.w/2,-f.h,f.w,f.h,0,hk*.6,0)){cx.fillStyle='#ffd8a8';cx.fillRect(-f.w/2,-f.h*.7,f.w,f.h*.7);}
  cx.restore();
  if(rk>.6){const p=tip();cx.fillStyle='#4b4b4b';for(let i=0;i<5;i++){cx.beginPath();cx.arc(p.x+rnd(-8,8),p.y+rnd(-8,8),rnd(1,3),0,7);cx.fill();}}
}
function drawSweep(){
  const th=theme(),x=G.sweep.x,y=H*.45,w=110*SC,h=H*.85;

function drawHint(e){
  const i=G.slots.findIndex(s=>s&&s.en===cur(e).en);if(i<0)return;
  const nr=notes[i].getBoundingClientRect(),cr=cv.getBoundingClientRect();

function drawFloat(f){
  cx.globalAlpha=clamp(f.life*2,0,1);

  if(f.boxed){cx.fillStyle='#fffbe0';cx.fillRect(f.x-w/2-16,f.y-f.size*SC*.85,w+32,f.size*SC*1.7);cx.strokeStyle=RED;cx.lineWidth=2.5;cx.strokeRect(f.x-w/2-16,f.y-f.size*SC*.85,w+32,f.size*SC*1.7);}
  cx.fillStyle=f.boxed?RED:(f.hl?'#22305c':c);cx.fillText(f.text+(f.tick?' ✓':''),f.x,f.y);
  if(f.circle){cx.strokeStyle=c;cx.lineWidth=2;cx.beginPath();cx.ellipse(f.x,f.y,w/2+8,f.size*SC*.6,-.1,.3,Math.PI*2+.2);cx.stroke();}

function drawBanner(b){
  const th=theme(),T=b.sub?2.6:2;
  const k=b.t>T-.3?(T-b.t)/.3:b.t<.4?b.t/.4:1;cx.globalAlpha=k;

  cx.font=`${64*SC*sc}px ${FONT_TH}`;cx.textAlign='center';cx.textBaseline='middle';
  const w=cx.measureText(b.text).width;

  cx.fillStyle=b.boss?RED:th.text;cx.fillText(b.text,W/2,H*.36);
  if(b.sub){cx.font=`${26*SC}px ${FONT_TH}`;cx.fillStyle=th.text;cx.fillText(b.sub,W/2,H*.36+54*SC);}

function hud(dt){

function readChallenge(){
  const m=(location.hash||'').match(/^#c=([\w-]+)/);if(!m)return null;

  show(`<h2 class="big">เลือก 1 สกิล</h2><div class="cards">${cards}</div><div class="branches">${brs}</div>
    ${(G.wave+1)%4===0?'<p style="color:var(--red);margin:0;font-size:20px">ต่อไป: บอส!</p>':(G.wave+1)%4===1?`<p style="margin:0;font-size:18px">ต่อไป: บทใหม่ · ${THEMES[chapterOf(G.wave+1)%THEMES.length].name}</p>`:''}`);
  panel.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    if(state!=='shop')return;state='picked';
    const k=b.dataset.k;SFX.sticker();b.classList.add('peel');
    G.sk[k]=(G.sk[k]||0)+1;
    if(k==='plaster'){const L=G.sk[k];G.maxHp=Math.min(8,G.maxHp+1);G.hp=Math.min(G.maxHp,G.hp+(L>=3?2:1));}
    skillsUI();
    setTimeout(()=>{hide();nextWave();},380);
  });
}
function gameOver(){
  if(!G)return;state='over';
  const nb=G.score>(BEST[G.tier]||0);if(nb){BEST[G.tier]=G.score;store.set('nm-best',BEST);}
  const daily=mode==='daily'&&G.seed===dailySeed(G.tier);
  if(daily){const k=today()+'|'+G.tier;DAILY[k]=Math.max(DAILY[k]||0,G.score);store.set('nm-daily',DAILY);}
  const key=runKey(G.tier,G.seed),me=NAME||'ฉัน';
  addRival(key,{n:me,p:G.score,me:true});
  const board=(RIVALS[key]||[]).slice(0,6);
  const tier=G.tier,seedv=G.seed,score=G.score;
  let head=`<h2 class="big red">ป้อมแตก!</h2>`;
  if(CH)head=G.score>CH.p?`<h2 class="big green">ชนะ ${esc(CH.n)}!</h2>`:`<h2 class="big red">แพ้ ${esc(CH.n)} อีก ${fmt(CH.p-G.score)}</h2>`;
  show(`${head}
    <div class="score-big">${fmt(G.score)}</div>${nb?'<span class="newrec">สถิติใหม่!</span>':''}
    <div class="stats"><div><b>${G.wave}</b>หน้า</div><div><b>${G.learned.size}</b>คำถูก</div><div><b>${G.best}</b>คอมโบ</div>${G.newWords?`<div><b>+${G.newWords}</b>คำใหม่</div>`:''}</div>
    ${board.length>1?`<div class="rank">${board.map((r,i)=>`<div class="${r.me?'me':''}"><em>${i+1}</em><span>${esc(r.n)}</span><b>${fmt(r.p)}</b></div>`).join('')}</div>`:''}
    ${G.missed.length?`<div class="missed">${G.missed.slice(0,8).map(w=>`<button class="mw" type="button" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.th)}</span></button>`).join('')}</div>`:''}
    ${NAME?'':nameBox()}
    <div class="row"><button class="btn red" type="button" id="duel">ท้าเพื่อน</button><button class="btn" type="button" id="again">อีกรอบ</button><button class="btn plain" type="button" id="menu">เมนู</button></div>
    <textarea class="linkbox" id="linkbox" rows="2" readonly hidden></textarea>`);
  bindName();
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,true));
  $('#duel').onclick=()=>{const n=NAME||'เพื่อน';const link=SITE+'#c='+b64e({t:tier,s:seedv,n,p:score,d:daily?today():0});
    shareLink(link,`${n} ได้ ${fmt(score)} คะแนนใน Notebook Monsters (${TIERS[tier].name}) แซงได้ไหม?`);};
  $('#again').onclick=()=>start(tier,CH||daily?seedv:(Math.random()*4294967295)>>>0);
  $('#menu').onclick=()=>{CH=null;title();};
}
function pause(){
  if(state!=='play')return;state='paused';
  show(`<h2 class="big">พัก</h2><div class="row"><button class="btn" type="button" id="resume">เล่นต่อ</button><button class="btn plain" type="button" id="quit">เมนู</button></div>`);
  $('#resume').onclick=()=>{hide();state='play';last=performance.now();};$('#quit').onclick=()=>{CH=null;title();};$('#resume').focus();
}
$('#pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

addEventListener('keydown',e=>{
  if(state!=='play'||e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){pause();return;}
  if(/^[1-4]$/.test(e.key)&&!typed){fire(+e.key-1);return;}
  if(e.key===' '&&!typed){e.preventDefault();useEraser();return;}
  if(e.key==='Backspace'){typed=typed.slice(0,-1);e.preventDefault();return;}
  if(e.key==='Enter'){typed='';return;}
  if(/^[a-zA-Z ]$/.test(e.key)){
    typed=(typed+e.key.toLowerCase()).slice(0,20);
    const on=live().map(cur),ex=on.find(w=>w.en===typed);
    if(ex){fire(ex);typed='';return;}
    if(!on.some(w=>w.en.startsWith(typed))&&!G.slots.some(s=>s&&s.en.startsWith(typed))){SFX.bad();typed='';}
  }
});

window.__nm=()=>G;
CH=readChallenge();if(CH&&CH.d)mode='daily';
fit();title();requestAnimationFrame(frame);
})();
</script>
