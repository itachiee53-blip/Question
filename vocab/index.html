<style>
/* Layout: full-screen arcade. Canvas battlefield fills the screen; HUD floats on top; four answer buttons dock at the bottom. Single neon-space look. */
:root{
  --space:#070a1f; --deep:#120d33; --glass:#141a3dcc; --line:#2d3672;
  --fg:#eef1ff; --muted:#9aa3d6;
  --cyan:#3ef0ff; --mag:#ff4fd8; --lime:#b6ff3b; --amber:#ffb020; --red:#ff3b5c;
  --f-logo:"Bungee","Fredoka",system-ui,sans-serif;
  --f-en:"Fredoka","Mitr",system-ui,sans-serif;
  --f-th:"Mitr",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--space);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{margin:0;font-family:var(--f-th);-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

.game{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;font-family:var(--f-en);font-weight:600}
.hud .box{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px 10px;backdrop-filter:blur(4px);white-space:nowrap}
.hp{font-size:18px;letter-spacing:1px}
.wave{font-family:var(--f-logo);font-size:15px;color:var(--cyan)}
.sp{flex:1}
.score{font-size:18px;font-variant-numeric:tabular-nums}
.combo{font-size:16px;color:var(--amber)}
.hud button{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;width:38px;height:34px;font-size:16px}
.bomb{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:64px;height:64px;border-radius:50%;border:2px solid var(--mag);background:radial-gradient(circle at 40% 35%,#ff7fe4,#7a1466 70%);font-size:26px;display:grid;place-items:center;box-shadow:0 0 18px #ff4fd888}
.bomb[disabled]{filter:grayscale(1) brightness(.6);box-shadow:none}
.bomb b{position:absolute;right:-4px;top:-4px;background:var(--amber);color:#1a1000;font-family:var(--f-en);font-size:13px;border-radius:9px;min-width:20px;padding:0 5px}
.charge{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:82px;width:64px;height:6px;background:#ffffff22;border-radius:4px;overflow:hidden}
.charge i{display:block;height:100%;background:var(--mag);width:0;transition:width .2s}
.typed{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-family:var(--f-en);font-weight:700;font-size:28px;color:var(--cyan);text-shadow:0 0 12px var(--cyan);letter-spacing:2px;pointer-events:none}

/* answer bar */
.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(#0b0f2a,#05071a);border-top:1px solid var(--line)}
.ans{--c:var(--cyan);position:relative;min-height:60px;border-radius:14px;border:2px solid var(--c);background:linear-gradient(180deg,#ffffff12,#ffffff03),#0c1233;font-family:var(--f-en);font-weight:600;font-size:clamp(17px,2.6vw,26px);color:#fff;text-shadow:0 0 10px var(--c);box-shadow:0 0 0 0 var(--c),inset 0 -4px 0 #0006;transition:transform .05s,box-shadow .15s;padding:4px 6px;line-height:1.1;overflow-wrap:anywhere}
.ans:nth-child(2){--c:var(--mag)} .ans:nth-child(3){--c:var(--lime)} .ans:nth-child(4){--c:var(--amber)}
.ans:active{transform:translateY(2px) scale(.98)}
.ans .k{position:absolute;left:8px;top:3px;font-size:11px;color:var(--muted);text-shadow:none}
.ans.new{animation:swap .3s}
@keyframes swap{from{transform:rotateX(90deg);opacity:.2}}
.ans.match{box-shadow:0 0 18px var(--c)}
.ans.bad{animation:nope .35s;border-color:var(--red)}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar.lock .ans{opacity:.4}
@media (max-width:560px) and (orientation:portrait){.bar{grid-template-columns:1fr 1fr}.ans{min-height:54px}}
@media (orientation:landscape) and (max-height:480px){.ans{min-height:48px;font-size:18px}.bar{padding-top:6px}}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 30%,#1b1450ee,#070a1ff2 70%);overflow:auto}
.panel{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:auto}
.logo{font-family:var(--f-logo);font-size:clamp(34px,8vw,76px);line-height:.95;margin:0;letter-spacing:1px;background:linear-gradient(180deg,#fff 10%,var(--cyan) 55%,#2b6bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #3ef0ff66)}
.logo span{display:block;background:linear-gradient(180deg,#fff 10%,var(--mag) 60%,#7a1466);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--muted);font-size:clamp(14px,2vw,18px);margin:0}
.how{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.how div{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:520px){.tiers{grid-template-columns:1fr}}
.tier{--c:var(--lime);border:2px solid var(--c);border-radius:18px;background:linear-gradient(180deg,#ffffff10,#ffffff02),#0d1336;padding:14px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .1s,box-shadow .15s}
.tier:hover{transform:translateY(-3px);box-shadow:0 0 24px var(--c)}
.tier .t{font-family:var(--f-logo);font-size:22px;color:var(--c)}
.tier .d{font-size:14px;color:var(--muted)}
.tier .e{font-family:var(--f-en);font-size:15px}
.tier .best{font-family:var(--f-en);font-size:13px;color:var(--amber)}
.tier:nth-child(2){--c:var(--amber)} .tier:nth-child(3){--c:var(--mag)}
.toggles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tg{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px}
.tg[aria-pressed="false"]{opacity:.5}
.big{font-family:var(--f-logo);font-size:clamp(28px,6vw,54px);margin:0;line-height:1}
.go{font-family:var(--f-logo);font-size:20px;border:0;border-radius:14px;padding:12px 28px;background:linear-gradient(180deg,#7ff6ff,#17a8c4);color:#04121a;box-shadow:0 0 24px #3ef0ff66,inset 0 -4px 0 #0004}
.go.alt{background:linear-gradient(180deg,#ff8ae6,#b0218f);color:#fff;box-shadow:0 0 24px #ff4fd855,inset 0 -4px 0 #0004}
.go.ghost{background:var(--glass);border:1px solid var(--line);color:var(--fg);box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.up{border:2px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#ffffff10,#ffffff02),#0d1336;padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .1s,border-color .1s}
.up:hover{transform:translateY(-4px);border-color:var(--cyan)}
.up .i{font-size:40px;line-height:1}
.up .n{font-family:var(--f-th);font-weight:600;font-size:18px}
.up .d{font-size:14px;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--f-en);font-size:24px;color:var(--fg)}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;width:100%;max-height:34vh;overflow:auto;text-align:left}
.mw{display:flex;gap:8px;align-items:center;background:#ff3b5c18;border:1px solid #ff3b5c66;border-radius:10px;padding:5px 10px;min-width:0}
.mw b{font-family:var(--f-en);display:block;line-height:1.1}
.mw small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (orientation:landscape) and (max-height:480px){.panel{gap:8px}.logo{font-size:40px}.tier{padding:8px}.up{padding:8px}.up .i{font-size:30px}}
@media (prefers-reduced-motion:reduce){.ans.new,.ans.bad{animation:none}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);

/* ---------- words ---------- */
const parse=s=>s.trim().split(';').filter(Boolean).map(x=>{const [en,th,em]=x.split('|');return{en:en.trim(),th:th.trim(),em:(em||'').trim()};});
const TIERS={

bed|เตียง|🛏️;chair|เก้าอี้|🪑;door|ประตู|🚪;window|หน้าต่าง|🪟;key|กุญแจ|🔑;spoon|ช้อน|🥄;phone|โทรศัพท์|📱;house|บ้าน|🏠;
run|วิ่ง|🏃;swim|ว่ายน้ำ|🏊;sleep|นอนหลับ|😴;sing|ร้องเพลง|🎤;dance|เต้นรำ|💃;cry|ร้องไห้|😢;happy|มีความสุข|😊;angry|โกรธ|😠;hungry|หิว|🤤`)},

weak|อ่อนแอ;dangerous|อันตราย;difficult|ยาก;easy|ง่าย;empty|ว่างเปล่า;famous|มีชื่อเสียง;heavy|หนัก;honest|ซื่อสัตย์;lazy|ขี้เกียจ;polite|สุภาพ;

/* ---------- settings / saves ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let OPT=store.get('wd-opt',{sfx:true,voice:true});
let BEST=store.get('wd-best',{});

/* ---------- audio ---------- */
let ac=null,noiseBuf=null;
function audio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}ac.resume();}catch(e){ac=null;}}
function tone(f,d,type='sine',v=.08,f2=0,at=0){
  if(!ac||!OPT.sfx)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d=.3,v=.25,lp=1200){
  if(!ac||!OPT.sfx)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(lp,t);f.frequency.exponentialRampToValueAtTime(80,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+d);
}
const SFX={
  zap(){tone(1400,.14,'sawtooth',.05,180);tone(900,.1,'square',.03,300);},
  boom(){noise(.45,.3,1600);tone(120,.3,'sine',.12,40);},
  hit(){noise(.6,.35,500);tone(80,.5,'triangle',.15,30);},
  bad(){tone(180,.18,'square',.06,120);tone(140,.22,'square',.05,90,.08);},
  wave(){[392,523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.09));},
  boss(){[110,104,98].forEach((f,i)=>tone(f,.4,'sawtooth',.08,f*.9,i*.35));},
  bomb(){noise(1.1,.45,3000);tone(60,1,'sine',.2,25);},
  up(){tone(660,.1,'triangle',.07);tone(990,.18,'triangle',.07,0,.08);},
  shield(){tone(500,.25,'sine',.08,1400);}

  const have=()=>new Set(G.slots.filter(Boolean).map(w=>w.en));
  const changed=new Set();
  for(const w of need){
    if(have().has(w.en))continue;
    let i=G.slots.findIndex(s=>!s||!aliveSet.has(s.en));
    if(i<0)i=G.slots.reduce((bi,s,j)=>{const r=alive.findIndex(a=>a.en===s.en),rb=alive.findIndex(a=>a.en===G.slots[bi].en);return r>rb?j:bi;},0);

  for(let i=0;i<4;i++){

      const h=have();const d=pick(G.words.filter(w=>!h.has(w.en)&&!aliveSet.has(w.en)));G.slots[i]=d;changed.add(i);
    }
  }
  changed.forEach(i=>{const b=ansBtns[i];b.querySelector('.w').textContent=G.slots[i].en;b.classList.remove('new');void b.offsetWidth;b.classList.add('new');});
}
function decoyOut(i){ // when a killed word leaves the bar, replace with a decoy or a needed word

  const targets=G.enemies.filter(e=>curWord(e).en===w.en).sort((a,b)=>b.y-a.y);
  if(!targets.length){

    if(typeof slot==='number'){const b=ansBtns[slot];b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}
    G.floats.push({x:W/2,y:groundY()-110*SC,text:`ไม่มีศัตรูคำว่า "${w.en}"`,c:'#ff3b5c',life:1.2,size:18});
    return;
  }

/* ---------- loop ---------- */
function update(dt){
  if(!G)return;
  G.t+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(state==='play'){
    if(G.spawnLeft>0){
      G.spawnT-=dt;
      const maxAlive=Math.min(2+Math.floor(G.wave/2),6);
      if(G.spawnT<=0&&G.enemies.length<maxAlive){
        if(G.bossPending){spawn(true);G.bossPending=false;}
        else{spawn(false);G.spawnLeft--;}
        G.spawnT=Math.max(1.1,3-G.wave*.12)*rnd(.8,1.2);
      }
    }else if(!G.enemies.length&&!G.bossPending){state='between';setTimeout(showShop,700);}
    for(const e of G.enemies){
      e.y+=e.vy*G.slow*dt;
      e.x=e.bx+Math.sin(G.t*1.3+e.ph)*14*SC;
      e.flash=Math.max(0,e.flash-dt);
      if(e.y+e.r>=hitY())baseHit(e);
    }
    G.barT-=dt;if(G.barT<=0){G.barT=.35;refreshBar(false);}
  }
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+200*SC*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  G.lasers.forEach(l=>l.life-=dt);G.lasers=G.lasers.filter(l=>l.life>0);
  G.rings.forEach(r=>r.life-=dt);G.rings=G.rings.filter(r=>r.life>0);
  G.floats.forEach(f=>{f.life-=dt;f.y-=24*dt;});G.floats=G.floats.filter(f=>f.life>0);
  G.flashRed=Math.max(0,(G.flashRed||0)-dt);G.flashWhite=Math.max(0,(G.flashWhite||0)-dt);
}

  rr(lx,ly,tw,fs*1.75,10*SC);cx.fill();cx.stroke();
  cx.textBaseline='middle';cx.textAlign='left';cx.fillStyle='#fff';
  let tx=lx+11*SC;if(emo){cx.font=`${fs*1.05}px sans-serif`;cx.fillText(emo,tx,ly+fs*.9);tx+=fs*1.3;cx.font=`600 ${fs}px Mitr, sans-serif`;}
  cx.fillText(label,tx,ly+fs*.9);
}
function drawBase(t){
  const x=W/2,y=groundY();
  // shield bubble
  if(G.shield>0){cx.strokeStyle=`rgba(62,240,255,${.5+.3*Math.sin(t/200)})`;cx.lineWidth=3;cx.shadowColor='#3ef0ff';cx.shadowBlur=16;cx.beginPath();cx.arc(x,y,92*SC,Math.PI,0);cx.stroke();cx.shadowBlur=0;}
  // platform
  cx.fillStyle='#1d2260';rr(x-90*SC,y-14*SC,180*SC,22*SC,8*SC);cx.fill();
  cx.fillStyle='#3ef0ff';for(let i=-3;i<=3;i++){cx.globalAlpha=.4+.6*((Math.sin(t/200+i)+1)/2);cx.fillRect(x+i*22*SC-4*SC,y-6*SC,8*SC,4*SC);}cx.globalAlpha=1;
  // dome
  const dg=cx.createRadialGradient(x-14*SC,y-46*SC,4,x,y-20*SC,52*SC);dg.addColorStop(0,'#e9fbff');dg.addColorStop(.5,'#59c7ff');dg.addColorStop(1,'#1a3c9a');
  cx.fillStyle=dg;cx.beginPath();cx.arc(x,y-14*SC,46*SC,Math.PI,0);cx.fill();
  // turret
  cx.save();cx.translate(x,y-30*SC);cx.rotate(G.turretA);
  cx.fillStyle='#0d1a4a';rr(0,-9*SC,56*SC,18*SC,6*SC);cx.fill();
  cx.fillStyle='#3ef0ff';cx.fillRect(48*SC,-6*SC,10*SC,12*SC);
  cx.restore();
  cx.fillStyle='#0d1a4a';cx.beginPath();cx.arc(x,y-30*SC,16*SC,0,7);cx.fill();
  cx.fillStyle=G.t<G.lockUntil?'#ff3b5c':'#3ef0ff';cx.beginPath();cx.arc(x,y-30*SC,7*SC,0,7);cx.fill();
}

/* ---------- HUD ---------- */
function hud(){
  if(!G)return;
  $('#hp').textContent='❤️'.repeat(Math.max(0,G.hp))+(G.shield?' 🛡️'+G.shield:'');
  $('#wave').textContent='WAVE '+G.wave;
  $('#score').textContent=G.score.toLocaleString('en-US');
  const c=$('#combo');c.hidden=G.combo<2;c.textContent='🔥 x'+G.combo;
  $('#bombN').textContent=G.bombs;$('#bomb').disabled=G.bombs<=0;
  $('#charge').style.width=G.charge*10+'%';
  $('#bar').classList.toggle('lock',G.t<G.lockUntil);
  $('#typed').textContent=typed;
  ansBtns.forEach((b,i)=>b.classList.toggle('match',!!typed&&!!G.slots[i]&&G.slots[i].en.startsWith(typed)));
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'||state==='dying'||state==='between')update(dt);
  draw(now);hud();
  requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
const ov=$('#ov'),panel=$('#panel');
function show(html){panel.innerHTML=html;ov.hidden=false;}
function title(){
  state='title';G=null;typed='';
  const tiers=Object.entries(TIERS).map(([k,t])=>`<button class="tier" type="button" data-tier="${k}"><span class="t">${t.name}</span><span class="d">${t.th} · ${t.d}</span><span class="e">${t.ex}</span><span class="best">${BEST[k]?'🏆 สถิติ '+BEST[k].toLocaleString('en-US'):'ยังไม่มีสถิติ'}</span></button>`).join('');
  show(`<h1 class="logo">WORD<span>DEFENDERS</span></h1>
    <p class="sub">มอนสเตอร์ถือคำภาษาไทยบุกฐาน! ยิงมันด้วยคำศัพท์ภาษาอังกฤษที่ถูกต้อง</p>
    <div class="how"><div>👾 ศัตรูถือคำแปลภาษาไทย</div><div>👆 แตะคำอังกฤษที่ตรงกันเพื่อยิง</div><div>⌨️ หรือพิมพ์คำ / กด 1–4</div><div>💥 ระเบิดล้างจอ</div></div>
    <div class="tiers">${tiers}</div>
    <div class="toggles"><button class="tg" type="button" id="tSfx" aria-pressed="${OPT.sfx}">🔊 เสียงเอฟเฟกต์</button><button class="tg" type="button" id="tVoice" aria-pressed="${OPT.voice}">🗣️ อ่านออกเสียงคำ</button></div>`);
  panel.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>start(b.dataset.tier));
  $('#tSfx').onclick=e=>{OPT.sfx=!OPT.sfx;e.currentTarget.setAttribute('aria-pressed',OPT.sfx);store.set('wd-opt',OPT);};
  $('#tVoice').onclick=e=>{OPT.voice=!OPT.voice;e.currentTarget.setAttribute('aria-pressed',OPT.voice);store.set('wd-opt',OPT);};
  ansBtns.forEach(b=>b.querySelector('.w').textContent='—');
}
function start(tier){
  audio();
  if(matchMedia('(pointer:coarse)').matches){try{document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}
  ov.hidden=true;typed='';newGame(tier);
}
function showShop(){
  if(!G)return;
  state='shop';
  const opts=shuffle(UPG.filter(u=>!(u.id==='repair'&&G.hp>=G.maxHp))).slice(0,3);
  show(`<p class="sub">WAVE ${G.wave} ผ่านแล้ว!</p><h2 class="big" style="color:var(--lime)">เลือกอัปเกรด</h2>
    <div class="stats"><div><b>${G.score.toLocaleString('en-US')}</b>คะแนน</div><div><b>${G.learned.size}</b>คำที่ยิงถูก</div><div><b>${G.best}</b>คอมโบสูงสุด</div></div>
    <div class="cards">${opts.map(u=>`<button class="up" type="button" data-u="${u.id}"><span class="i">${u.i}</span><span class="n">${u.n}</span><span class="d">${u.d}</span></button>`).join('')}</div>
    <p class="sub">ต่อไป: ${(G.wave+1)%4===0?'<b style="color:var(--mag)">BOSS WAVE</b>':'WAVE '+(G.wave+1)}</p>`);
  panel.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.u;SFX.up();
    if(id==='repair')G.hp=Math.min(G.maxHp,G.hp+2);
    if(id==='shield')G.shield+=2;
    if(id==='bomb')G.bombs++;
    if(id==='slow')G.slow*=.88;
    if(id==='chain')G.chain=Math.min(.9,G.chain+.3);
    if(id==='mult')G.mult*=1.25;
    ov.hidden=true;nextWave();
  });
}
function gameOver(){
  if(!G)return;
  state='over';
  const nb=G.score>(BEST[G.tier]||0);if(nb){BEST[G.tier]=G.score;store.set('wd-best',BEST);}
  const tier=G.tier;
  show(`<h2 class="big" style="color:var(--red)">ฐานแตกแล้ว!</h2>
    ${nb?'<p class="sub" style="color:var(--amber)">🏆 สถิติใหม่!</p>':''}
    <div class="stats"><div><b>${G.score.toLocaleString('en-US')}</b>คะแนน</div><div><b>${G.wave}</b>เวฟ</div><div><b>${G.learned.size}</b>คำที่ยิงถูก</div><div><b>${G.best}</b>คอมโบสูงสุด</div></div>
    ${G.missed.length?`<p class="sub">คำที่หลุดเข้าฐาน จำไว้รอบหน้า 👇 (แตะเพื่อฟัง)</p><div class="missed">${G.missed.map(w=>`<button class="mw" type="button" data-say="${esc(w.en)}">${w.em?`<span style="font-size:24px">${w.em}</span>`:''}<span><b>${esc(w.en)}</b><small>${esc(w.th)}</small></span></button>`).join('')}</div>`:''}
    <div class="row"><button class="go" type="button" id="again">เล่นอีกครั้ง</button><button class="go ghost" type="button" id="menu">เปลี่ยนระดับ</button></div>`);
  panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const o=OPT.voice;OPT.voice=true;speak(b.dataset.say);OPT.voice=o;});
  $('#again').onclick=()=>start(tier);$('#menu').onclick=title;
}
function pause(){
  if(state!=='play')return;state='paused';
  show(`<h2 class="big">หยุดชั่วคราว</h2><div class="row"><button class="go" type="button" id="resume">เล่นต่อ</button><button class="go ghost" type="button" id="quit">ออกไปหน้าแรก</button></div>`);
  $('#resume').onclick=()=>{ov.hidden=true;state='play';last=performance.now();};$('#quit').onclick=title;$('#resume').focus();
}
$('#pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(e.key==='Escape'){pause();return;}
  if(/^[1-4]$/.test(e.key)&&!typed){fire(+e.key-1);return;}
  if(e.key===' '&&!typed){e.preventDefault();useBomb();return;}
  if(e.key==='Backspace'){typed=typed.slice(0,-1);e.preventDefault();return;}
  if(e.key==='Enter'){typed='';return;}
  if(/^[a-zA-Z ]$/.test(e.key)){
    typed=(typed+e.key.toLowerCase()).slice(0,20);
    const onScreen=G.enemies.map(curWord);
    const exact=onScreen.find(w=>w.en===typed);
    if(exact){fire(exact);typed='';return;}
    const anyPrefix=onScreen.some(w=>w.en.startsWith(typed))||G.slots.some(s=>s&&s.en.startsWith(typed));
    if(!anyPrefix){SFX.bad();typed='';}
  }
});

window.__wd=()=>G;
fit();title();requestAnimationFrame(frame);
})();
</script>
