<title>ปั่นป่วนคาเฟ่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Anuphan:wght@400;600&display=swap">
<style>
/* Layout: a night drink stall, landscape-first. Three columns: customer + order | the glass + actions | ingredient shelf. Portrait stacks into two rows. */
:root{
  --bg:#0f2629; --panel:#16363b; --panel2:#1e464c; --line:#2b5a60;
  --fg:#eef7f5; --muted:#9cc0bb;
  --pink:#ff6f91; --gold:#ffd166; --ok:#5fd38d; --bad:#ff5a5f;
  --f-display:"Mitr","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;overflow:hidden;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  background:radial-gradient(120% 80% at 50% -10%,#1d4a50 0%,var(--bg) 60%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:1100px;max-height:680px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;container-type:size;position:relative}

.top{position:relative;z-index:11;display:flex;align-items:center;gap:clamp(8px,2cqw,18px);font-family:var(--f-display);font-size:clamp(12px,3.6cqh,18px);white-space:nowrap;min-width:0}
.logo{color:var(--pink);font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .s{font-variant-numeric:tabular-nums}
.top .s b{color:var(--gold)}
.sp{flex:1}
.tbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:clamp(11px,3cqh,14px);cursor:pointer;color:var(--muted)}
.tbtn.rot{border-color:var(--gold);color:var(--gold)}
.tbtn:focus-visible,.ing:focus-visible,.abtn:focus-visible,.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.play{display:grid;grid-template-columns:minmax(0,33fr) minmax(0,24fr) minmax(0,43fr);gap:clamp(6px,1.4cqw,14px);min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0;min-width:0;position:relative}

/* customer */
.cust{display:flex;flex-direction:column;padding:clamp(6px,1.6cqh,14px);gap:clamp(4px,1.2cqh,10px)}
.who{display:flex;align-items:center;gap:10px}
.face{font-size:clamp(30px,12cqh,72px);line-height:1.15;transition:transform .3s}
.face.in{animation:walk .45s ease-out}
@keyframes walk{from{transform:translateX(-80%);opacity:0}}
.pat{flex:1;min-width:0}
.pat small{color:var(--muted);font-size:clamp(10px,2.8cqh,13px);display:block}
.pbar{height:clamp(6px,1.8cqh,10px);border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;width:100%;background:var(--ok);transition:background .3s}
.bub{background:#fff;color:#14302f;border-radius:14px;padding:clamp(6px,1.6cqh,12px);display:flex;flex-direction:column;gap:clamp(4px,1.2cqh,8px);flex:1;min-height:0;overflow:auto}
.bub .dn{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,4.6cqh,24px);line-height:1.15}
.bub .pr{font-size:clamp(11px,3cqh,14px);color:#4b6e6a}
.chips{display:flex;flex-wrap:wrap;gap:clamp(3px,1cqh,6px)}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:10px;padding:clamp(2px,.7cqh,4px) clamp(5px,1cqw,8px);background:#e6efee;color:#14302f;font-size:clamp(14px,4.8cqh,24px);font-family:var(--f-display);border:2px solid transparent}
.chip small{font-size:.75em}
.chip.ok{background:#d4f5e2;border-color:var(--ok)}
.chip.ok::after{content:"✓";color:#1f8a4c;font-weight:700}
.chip.over{background:#ffe0e1;border-color:var(--bad)}
.empty{color:var(--muted);text-align:center;margin:auto;font-family:var(--f-display)}

/* glass */
.bar{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(6px,1.6cqh,14px) 6px;gap:6px}
.glassArea{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.glass{position:relative;height:min(100%,56cqh);aspect-ratio:3/4;max-width:92%}
.cupb{position:absolute;inset:14% 0 0 0;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:linear-gradient(90deg,#ffffff14,#ffffff30 30%,#ffffff12 70%,#ffffff26);overflow:hidden}
.liq{position:absolute;left:0;right:0;bottom:0;top:8%;display:flex;flex-direction:column-reverse}
.layer{height:25%;flex:none;animation:pour .35s ease-out;position:relative}
.layer.mix{animation:none}
@keyframes pour{from{height:0}}
.glass.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.ice{position:absolute;inset:18% 18% 30% 18%;pointer-events:none}
.ice i{position:absolute;width:30%;aspect-ratio:1;border-radius:18%;background:#e8fbffaa;border:1px solid #fff;box-shadow:inset 0 0 6px #fff}
.pearls{position:absolute;left:16%;right:16%;bottom:2%;height:16%;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px}
.pearls i{width:13%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b4a3a,#1c110c)}
.cream{position:absolute;left:4%;right:4%;top:0;height:24%;background:radial-gradient(ellipse at 50% 100%,#fff 60%,transparent 61%),radial-gradient(circle at 30% 70%,#fff 30%,transparent 31%),radial-gradient(circle at 70% 70%,#fff 30%,transparent 31%),radial-gradient(circle at 50% 35%,#fff 26%,transparent 27%);animation:pour .3s}
.bubbles i{position:absolute;bottom:4%;width:5%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffffcc;animation:fizz 1.6s linear infinite}
@keyframes fizz{to{transform:translateY(-500%);opacity:0}}
.straw{position:absolute;right:28%;top:-6%;width:7%;height:60%;background:repeating-linear-gradient(0deg,var(--pink) 0 8px,#fff 8px 14px);border-radius:4px;transform:rotate(12deg);transform-origin:bottom}
.count{font-family:var(--f-display);font-size:clamp(11px,3cqh,14px);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.abtn{border:0;border-radius:12px;padding:clamp(4px,1.4cqh,10px) 4px;background:var(--panel2);cursor:pointer;font-family:var(--f-display);font-size:clamp(11px,3.2cqh,16px);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.abtn span{font-size:clamp(16px,5.4cqh,28px)}
.abtn.serve{grid-column:1/-1;background:var(--gold);color:#2a1d00;flex-direction:row;justify-content:center;gap:6px;font-weight:600}
.abtn.serve span{font-size:clamp(16px,5cqh,26px)}
.abtn:active,.ing:active{transform:scale(.95)}
.abtn[disabled]{opacity:.4}

/* shelf */
.shelf{padding:clamp(6px,1.4cqh,12px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(4px,1.2cqh,8px)}
.ing{position:relative;border:2px solid var(--line);border-radius:14px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;min-width:0;padding:2px}
.ing .sw{width:clamp(30px,11cqh,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(17px,6cqh,32px);box-shadow:inset 0 -4px 0 #0003}
.ing .nm{font-family:var(--f-display);font-size:clamp(10px,2.9cqh,14px);line-height:1.1;text-align:center}
.ing.x{border-style:dashed}
.ing.on{border-color:var(--gold);border-style:solid;background:#3b4a2c}
.ing.need{box-shadow:0 0 0 2px var(--ok)}
.ing.new::before{content:"ใหม่";position:absolute;top:3px;right:4px;background:var(--pink);color:#fff;font-size:10px;border-radius:5px;padding:0 4px;font-family:var(--f-display)}

/* feedback */
.fb{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:600;font-size:clamp(16px,6cqh,32px);text-align:center;width:max-content;max-width:96%;pointer-events:none;text-shadow:0 2px 0 #000,0 0 14px #000;animation:rise 1.4s ease-out forwards;z-index:4}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.gold{color:var(--gold)}
.fb small{display:block;font-size:.55em;color:var(--fg)}
@keyframes rise{0%{transform:translate(-50%,10px) scale(.8);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-40px);opacity:0}}

/* overlays */
.ov{position:absolute;inset:0;z-index:10;background:#0f2629f0;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.card{max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2cqh,12px);margin:auto}
.card h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,9cqh,46px);line-height:1.05;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--pink)}
.card p{margin:0;color:var(--muted);font-size:clamp(12px,3.6cqh,16px)}
.recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;width:100%}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left}
.rc b{font-family:var(--f-display);font-weight:600;display:block;font-size:clamp(13px,3.8cqh,17px)}
.rc .chips .chip{font-size:clamp(11px,3.2cqh,15px)}
.go{background:var(--gold);color:#2a1d00;border:0;border-radius:12px;padding:clamp(6px,2cqh,12px) 28px;font-family:var(--f-display);font-weight:600;font-size:clamp(15px,4.6cqh,20px);cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-family:var(--f-display)}
.stats b{color:var(--gold);font-size:1.2em}

/* portrait: two rows */
html.port .play{grid-template-columns:minmax(0,1fr) minmax(0,.8fr);grid-template-rows:minmax(0,1fr) minmax(0,1.05fr)}
html.port .shelf{grid-column:1/-1}
html.port .logo{display:none}
html.port .top{gap:8px;font-size:13px}
html.port .chip{font-size:15px}
html.port .face{font-size:clamp(30px,8cqh,70px)}
html.port .glass{height:min(100%,30cqh)}
html.force body{position:fixed;top:0;left:0;margin:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
@media (prefers-reduced-motion:reduce){.layer,.cream,.face.in,.glass.shake,.bubbles i{animation:none}.fb{animation-duration:2.2s}}
</style>

<div class="app" id="app">
  <div class="top">
    <span class="logo">🍹 ปั่นป่วนคาเฟ่</span>
    <span class="s">วันที่ <b id="day">1</b></span>
    <span class="s">⏱ <b id="time">1:20</b></span>
    <span class="s">💰 <b id="coins">0</b>/<span id="target">120</span></span>
    <span class="s" id="hearts">❤️❤️❤️</span>
    <span class="sp"></span>
    <button class="tbtn" id="mute" type="button">🔊</button>
    <button class="tbtn rot" id="rot" type="button">แนวนอน</button>
  </div>

  <div class="play">
    <section class="col cust" aria-label="ลูกค้า">
      <div class="who">
        <span class="face" id="face">🙂</span>
        <div class="pat"><small id="patTxt">ความอดทน</small><div class="pbar"><i id="patBar"></i></div></div>
      </div>
      <div class="bub" id="bub"><div class="empty">รอลูกค้า…</div></div>
    </section>

    <section class="col bar" aria-label="แก้ว">
      <div class="glassArea">
        <div class="glass" id="glass">
          <div class="cupb"><div class="liq" id="liq"></div><div class="bubbles" id="bubbles"></div><div class="pearls" id="pearls"></div><div class="ice" id="ice"></div></div>
          <div class="cream" id="cream" hidden></div>
          <div class="straw" id="straw" hidden></div>
        </div>
      </div>
      <span class="count" id="count">แก้วว่าง · เทได้อีก 4 ส่วน</span>
      <div class="acts">
        <button class="abtn" id="blend" type="button"><span>🌀</span>ปั่น</button>
        <button class="abtn" id="trash" type="button"><span>🗑️</span>เททิ้ง</button>
        <button class="abtn serve" id="serve" type="button"><span>🛎️</span>เสิร์ฟ</button>
      </div>
    </section>

    <section class="col shelf" id="shelf" aria-label="วัตถุดิบ"></section>
  </div>

  <div class="ov" id="ov">
    <div class="card" id="ovCard"></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rand=(a,b)=>a+Math.random()*(b-a);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- data ---------- */
const ING={
  thai:  {n:'ชาไทย',ic:'🫖',c:'#e8843a'},
  milk:  {n:'นม',ic:'🥛',c:'#f3ede3'},
  coffee:{n:'กาแฟ',ic:'☕',c:'#5b3a26'},
  green: {n:'ชาเขียว',ic:'🍵',c:'#8dbf4c'},
  soda:  {n:'โซดา',ic:'🫧',c:'#cfeaff'},
  berry: {n:'สตรอว์เบอร์รี',ic:'🍓',c:'#e8455a'},
  lemon: {n:'มะนาว',ic:'🍋',c:'#e8e05a'},
  mango: {n:'มะม่วง',ic:'🥭',c:'#ffb13b'}
};
const EXTRA={ice:{n:'น้ำแข็ง',ic:'🧊',c:'#bfefff'},pearl:{n:'ไข่มุก',ic:'⚫',c:'#6b4a3a'},cream:{n:'วิปครีม',ic:'🍦',c:'#ffffff'}};
const MENU=[
  {n:'ชาไทยเย็น',p:40,r:{thai:2,milk:1},x:['ice'],day:1},
  {n:'กาแฟเย็น',p:45,r:{coffee:2,milk:1},x:['ice'],day:1},
  {n:'ชาเขียวนม',p:45,r:{green:2,milk:1},x:['ice'],day:2},
  {n:'ชาไทยไข่มุก',p:55,r:{thai:2,milk:1},x:['ice','pearl'],day:2},
  {n:'สตรอว์เบอร์รีโซดา',p:50,r:{berry:1,soda:2},x:['ice'],day:3},
  {n:'มะนาวโซดา',p:45,r:{lemon:1,soda:3},x:['ice'],day:3},
  {n:'มะม่วงปั่น',p:60,r:{mango:2,milk:1},x:['ice'],blend:true,day:4},
  {n:'ลาเต้วิปครีม',p:60,r:{coffee:1,milk:2},x:['cream'],day:4},
  {n:'นมชมพูปั่น',p:65,r:{berry:1,milk:2},x:['ice','cream'],blend:true,day:5},
  {n:'มัทฉะมะนาวโซดา',p:60,r:{green:1,lemon:1,soda:2},x:['ice'],day:5}
];
const FACES=['🧑','👩','👨','👵','👴','🧒','👧','🐱','🐶','🐼','🦊','🐸','🐻','🤖','👽'];
const CAP=4;
const dayCfg=d=>({target:[0,120,200,280,360][d]||360+(d-4)*90,patience:Math.max(11,26-d*2.5),len:80});

/* ---------- state ---------- */
let G={day:1,total:0,muted:false};
let D=null; // day state
let cup=null;
const newCup=()=>({layers:[],x:{ice:false,pearl:false,cream:false},blend:false});
const unlockedMenu=()=>MENU.filter(m=>m.day<=G.day);
function unlockedIng(){const s=new Set(),x=new Set();unlockedMenu().forEach(m=>{Object.keys(m.r).forEach(k=>s.add(k));m.x.forEach(k=>x.add(k));});return{l:[...Object.keys(ING)].filter(k=>s.has(k)),x:[...Object.keys(EXTRA)].filter(k=>x.has(k))};}
const newThisDay=()=>MENU.filter(m=>m.day===G.day);

/* ---------- sound ---------- */
let actx=null;
function beep(f,d=.08,type='sine',v=.06,slide=0){
  if(G.muted||!actx)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const glug=()=>{beep(300,.07,'sine',.07,-120);setTimeout(()=>beep(260,.07,'sine',.06,-100),70);};
const ding=()=>{beep(880,.12,'triangle',.08);setTimeout(()=>beep(1320,.18,'triangle',.08),100);};
const buzz=()=>beep(150,.3,'sawtooth',.05,-40);
$('mute').onclick=()=>{G.muted=!G.muted;$('mute').textContent=G.muted?'🔇':'🔊';};

/* ---------- shelf ---------- */
function buildShelf(){
  const sh=$('shelf');sh.innerHTML='';
  const u=unlockedIng(),fresh=new Set();
  newThisDay().forEach(m=>{Object.keys(m.r).forEach(k=>fresh.add(k));m.x.forEach(k=>fresh.add(k));});
  const prev=new Set();MENU.filter(m=>m.day<G.day).forEach(m=>{Object.keys(m.r).forEach(k=>prev.add(k));m.x.forEach(k=>prev.add(k));});
  const mk=(k,def,isX)=>{
    const b=document.createElement('button');b.type='button';b.className='ing'+(isX?' x':'')+(G.day>1&&fresh.has(k)&&!prev.has(k)?' new':'');b.id='ing-'+k;
    b.innerHTML=`<span class="sw" style="background:${def.c}">${def.ic}</span><span class="nm">${def.n}</span>`;
    b.onclick=()=>isX?toggleX(k):pour(k);
    sh.appendChild(b);
  };
  u.l.forEach(k=>mk(k,ING[k],false));
  u.x.forEach(k=>mk(k,EXTRA[k],true));
  const cols=u.l.length+u.x.length<=6?3:4;
  sh.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  $('blend').hidden=!unlockedMenu().some(m=>m.blend);
  $('serve').style.gridColumn=$('blend').hidden?'2':'1 / -1';
}

/* ---------- cup actions ---------- */
function pour(k){
  if(!D||!D.running)return;
  if(cup.layers.length>=CAP){fb('แก้วเต็มแล้ว!','bad');buzz();return;}
  cup.layers.push(k);cup.blend=false;glug();drawCup(true);updateOrder();
}
function toggleX(k){
  if(!D||!D.running)return;
  cup.x[k]=!cup.x[k];beep(cup.x[k]?660:440,.08,'triangle',.06);drawCup();updateOrder();
}
$('blend').onclick=()=>{
  if(!D||!D.running)return;
  if(!cup.layers.length){fb('ยังไม่มีอะไรให้ปั่น','bad');return;}
  cup.blend=true;const g=$('glass');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
  for(let i=0;i<6;i++)setTimeout(()=>beep(180+i*30,.06,'square',.03),i*60);
  drawCup();updateOrder();
};
$('trash').onclick=()=>{if(!D||!D.running)return;cup=newCup();beep(200,.15,'sine',.05,-100);drawCup();updateOrder();};
$('serve').onclick=serve;

function mixColor(keys){
  const rgb=keys.map(k=>ING[k].c.match(/\w\w/g).map(h=>parseInt(h,16)));
  const avg=[0,1,2].map(i=>Math.round(rgb.reduce((a,c)=>a+c[i],0)/rgb.length));
  return `rgb(${avg.join(',')})`;
}
function drawCup(anim){
  const liq=$('liq'),n=cup.layers.length;
  if(cup.blend&&n){
    liq.innerHTML=`<div class="layer mix" style="height:${n*25}%;background:${mixColor(cup.layers)}"></div>`;
  }else{
    const have=liq.querySelectorAll('.layer:not(.mix)').length;
    if(!anim||have!==n-1)liq.innerHTML=cup.layers.map(k=>`<div class="layer mix" style="background:${ING[k].c}"></div>`).join('');
    else liq.insertAdjacentHTML('beforeend',`<div class="layer" style="background:${ING[cup.layers[n-1]].c}"></div>`);
  }
  $('ice').innerHTML=cup.x.ice?'<i style="left:4%;top:8%;transform:rotate(14deg)"></i><i style="left:40%;top:0;transform:rotate(-10deg)"></i><i style="left:62%;top:22%;transform:rotate(25deg)"></i><i style="left:22%;top:34%;transform:rotate(-20deg)"></i>':'';
  $('pearls').innerHTML=cup.x.pearl?'<i></i>'.repeat(12):'';
  $('cream').hidden=!cup.x.cream;
  $('bubbles').innerHTML=cup.layers.includes('soda')?[12,30,48,66,80].map((l,i)=>`<i style="left:${l}%;animation-delay:${i*.3}s"></i>`).join(''):'';
  $('count').textContent=n?(n>=CAP?'แก้วเต็ม':`เทได้อีก ${CAP-n} ส่วน`)+(cup.blend?' · ปั่นแล้ว':''):`แก้วว่าง · เทได้อีก ${CAP} ส่วน`;
  document.querySelectorAll('.ing.x').forEach(b=>b.classList.toggle('on',!!cup.x[b.id.slice(4)]));
}

/* ---------- orders ---------- */
function check(o){
  const items=[],cnt={};cup.layers.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  for(const k in o.r){const h=cnt[k]||0,need=o.r[k];items.push({k,ic:ING[k].ic,t:'×'+need,s:h===need?'ok':h>need?'over':'under',why:h>need?`${ING[k].n}เยอะไป`:`${ING[k].n}ยังไม่พอ`});}
  for(const k in cnt)if(!(k in o.r))items.push({k,ic:ING[k].ic,t:'ไม่ได้สั่ง',s:'over',why:`ไม่ได้สั่ง${ING[k].n}`});
  for(const e in EXTRA){const need=o.x.includes(e),h=cup.x[e];
    if(need)items.push({k:e,ic:EXTRA[e].ic,t:'',s:h?'ok':'under',why:`ลืมใส่${EXTRA[e].n}`});
    else if(h)items.push({k:e,ic:EXTRA[e].ic,t:'ไม่ได้สั่ง',s:'over',why:`ไม่ได้สั่ง${EXTRA[e].n}`});}
  if(o.blend)items.push({k:'blend',ic:'🌀',t:'ปั่น',s:cup.blend?'ok':'under',why:'ยังไม่ได้ปั่น'});
  else if(cup.blend)items.push({k:'blend',ic:'🌀',t:'ไม่ต้องปั่น',s:'over',why:'ไม่ต้องปั่น'});
  return items;
}
const chipHTML=it=>`<span class="chip ${it.s}">${it.ic}${it.t?`<small>${it.t}</small>`:''}</span>`;
function updateOrder(){
  document.querySelectorAll('.ing').forEach(b=>b.classList.remove('need'));
  if(!D||!D.cust){return;}
  const items=check(D.cust.o);
  $('bub').innerHTML=`<div class="dn">${D.cust.o.n}</div><div class="chips">${items.map(chipHTML).join('')}</div><div class="pr">ราคา 💰${D.cust.o.p} + ทิปถ้าเร็ว</div>`;
  // hint: glow the next thing still missing
  const next=items.find(i=>i.s==='under');
  if(next&&next.k!=='blend'){const b=$('ing-'+next.k);if(b)b.classList.add('need');}
}
function newCustomer(){
  const m=unlockedMenu(),fresh=newThisDay();
  const o=fresh.length&&Math.random()<.45?pick(fresh):pick(m);
  const P=dayCfg(G.day).patience;
  D.cust={o,face:pick(FACES),pat:P,max:P};
  const f=$('face');f.textContent=D.cust.face;f.classList.remove('in');void f.offsetWidth;f.classList.add('in');
  beep(520,.08,'triangle',.05);
  updateOrder();
}
function leave(){
  D.cust=null;$('bub').innerHTML='<div class="empty">รอลูกค้า…</div>';$('face').textContent='🚪';
  $('patBar').style.width='0';updateOrder();
  D.nextAt=D.t+1.1;
}
function serve(){
  if(!D||!D.running)return;
  if(!D.cust){fb('ยังไม่มีลูกค้า','bad');return;}
  if(!cup.layers.length){fb('แก้วยังว่างอยู่!','bad');buzz();return;}
  const items=check(D.cust.o),bad=items.filter(i=>i.s!=='ok');
  if(!bad.length){
    D.combo++;
    const frac=D.cust.pat/D.cust.max;
    const tip=Math.round(D.cust.o.p*.5*frac)+(D.combo>1?Math.min(5*(D.combo-1),25):0);
    const got=D.cust.o.p+tip;D.coins+=got;D.served++;
    $('face').textContent=frac>.5?'😍':'😊';
    $('straw').hidden=false;
    fb(`อร่อยมาก! +💰${got}`,'ok',tip?`ทิป ${tip}${D.combo>1?` · คอมโบ ${D.combo}`:''}`:'');ding();
  }else{
    D.combo=0;D.hearts--;
    $('face').textContent='😤';
    fb('ไม่ใช่ที่สั่ง!','bad',bad[0].why);buzz();
  }
  D.running=false;
  setTimeout(()=>{if(!D)return;$('straw').hidden=true;cup=newCup();drawCup();D.running=true;leave();if(D.hearts<=0)endDay(true);},900);
}
function fb(text,cls,sub){
  const e=document.createElement('div');e.className='fb '+cls;e.innerHTML=text+(sub?`<small>${sub}</small>`:'');
  document.querySelector('.bar').appendChild(e);setTimeout(()=>e.remove(),1400);
}

/* ---------- day flow ---------- */
function showDayStart(){
  const cfg=dayCfg(G.day),nm=newThisDay();
  const list=(nm.length?nm:unlockedMenu()).map(m=>{
    const items=Object.entries(m.r).map(([k,n])=>chipHTML({ic:ING[k].ic,t:'×'+n,s:''})).join('')+m.x.map(k=>chipHTML({ic:EXTRA[k].ic,t:'',s:''})).join('')+(m.blend?chipHTML({ic:'🌀',t:'ปั่น',s:''}):'');
    return `<div class="rc"><b>${m.n}</b><div class="chips">${items}</div></div>`;}).join('');
  $('ovCard').innerHTML=`
    ${G.day===1?'<h1>ปั่นป่วน<em>คาเฟ่</em></h1><p>แตะวัตถุดิบตามสูตรในใบสั่ง ✓ เขียว = ถูกแล้ว แล้วกด 🛎️ เสิร์ฟ</p>':`<h1>วันที่ <em>${G.day}</em></h1>`}
    <p>${nm.length?(G.day===1?'เมนูวันนี้':'🎉 เมนูใหม่!'):'วันนี้ลูกค้าเยอะขึ้น ใจเย็นน้อยลง'}</p>
    <div class="recipes">${list}</div>
    <p>เป้าหมายวันนี้ 💰${cfg.target} · ทำผิดได้ 3 ครั้ง</p>
    <button class="go" id="goBtn" type="button">เปิดร้าน!</button>`;
  $('ov').hidden=false;$('goBtn').onclick=startDay;$('goBtn').focus();
  buildShelf();
}
function startDay(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){actx=null;}
  const cfg=dayCfg(G.day);
  D={t:0,left:cfg.len,coins:0,hearts:3,combo:0,served:0,cust:null,nextAt:.6,running:true,target:cfg.target};
  cup=newCup();drawCup();$('ov').hidden=true;
  $('bub').innerHTML='<div class="empty">รอลูกค้า…</div>';$('face').textContent='🚪';
}
function endDay(failedHearts){
  if(!D)return;
  const pass=!failedHearts&&D.coins>=D.target;
  const d=D;D=null;G.total+=d.coins;
  const best=+(store.get('bestDay')||0);if(pass&&G.day>best)store.set('bestDay',String(G.day));
  $('ovCard').innerHTML=`
    <h1>${pass?'ปิดร้าน <em>สำเร็จ!</em>':failedHearts?'ลูกค้า<em>โกรธ</em>หมดแล้ว':'ยัง<em>ไม่ถึง</em>เป้า'}</h1>
    <p>${pass?'เก่งมาก! พรุ่งนี้มีเมนูใหม่รออยู่':failedHearts?'ทำผิดครบ 3 ครั้ง ดูเครื่องหมาย ✓ ในใบสั่งให้ครบก่อนเสิร์ฟ':'เสิร์ฟให้เร็วขึ้นจะได้ทิปเพิ่ม'}</p>
    <div class="stats"><div>💰 <b>${d.coins}</b> / ${d.target}</div><div>🥤 เสิร์ฟ <b>${d.served}</b> แก้ว</div><div>🏆 รวม <b>${G.total}</b></div></div>
    <button class="go" id="goBtn" type="button">${pass?`ไปวันที่ ${G.day+1}`:'ลองวันนี้อีกครั้ง'}</button>`;
  $('ov').hidden=false;
  $('goBtn').onclick=()=>{if(pass)G.day++;showDayStart();};$('goBtn').focus();
}

/* ---------- loop ---------- */
function tick(dt){
  if(!D)return;
  if(D.running){
    D.t+=dt;D.left-=dt;
    if(D.cust){
      D.cust.pat-=dt;
      if(D.cust.pat<=0){D.hearts--;D.combo=0;$('face').textContent='😡';fb('รอนานเกินไป!','bad','ลูกค้าเดินออกไปแล้ว');buzz();cup=newCup();drawCup();leave();if(D.hearts<=0){endDay(true);return;}}
    }else if(D.t>=D.nextAt&&D.left>3)newCustomer();
    if(D.left<=0){D.left=0;endDay(false);return;}
  }
  const l=Math.ceil(D.left);$('time').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');
  $('coins').textContent=D.coins;$('target').textContent=D.target;
  $('coins').style.color=D.coins>=D.target?'var(--ok)':'';
  $('hearts').textContent='❤️'.repeat(Math.max(0,D.hearts))+'🤍'.repeat(3-Math.max(0,D.hearts));
  $('day').textContent=G.day;
  if(D.cust){
    const f=D.cust.pat/D.cust.max;
    $('patBar').style.width=f*100+'%';$('patBar').style.background=f>.5?'var(--ok)':f>.25?'var(--gold)':'var(--bad)';
    $('patTxt').textContent=f>.5?'ความอดทน':f>.25?'เริ่มรอนานแล้ว…':'จะเดินออกแล้ว!';
    if(D.running&&!['😍','😊','😤'].includes($('face').textContent))$('face').textContent=f>.25?D.cust.face:'😠';
  }
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);requestAnimationFrame(frame);}

/* ---------- orientation ---------- */
const root=document.documentElement;let forced=false;
function layout(){
  const iw=innerWidth,ih=innerHeight,portrait=ih>iw;
  const force=forced&&portrait&&iw<760;
  root.classList.toggle('force',force);
  root.classList.toggle('port',portrait&&!force);
  const b=document.body.style;
  if(force){b.width=ih+'px';b.height=iw+'px';}else{b.width='';b.height='';}
  $('rot').hidden=!(portrait&&iw<760)&&!force;
  $('rot').textContent=force?'แนวตั้ง':'แนวนอน';
}
$('rot').onclick=async()=>{
  if(root.classList.contains('force')){forced=false;layout();return;}
  let ok=false;
  try{if(!document.fullscreenElement)await root.requestFullscreen();await screen.orientation.lock('landscape');ok=true;}catch(e){}
  if(ok)await new Promise(r=>setTimeout(r,700));
  if(innerHeight>innerWidth){try{if(document.fullscreenElement)await document.exitFullscreen();}catch(e){}forced=true;}
  layout();
};
addEventListener('resize',layout);
try{screen.orientation.addEventListener('change',layout);}catch(e){}
layout();

/* keyboard: 1-9 ingredients in shelf order, space = serve */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '&&D){e.preventDefault();serve();return;}
  const n=+e.key;const btns=[...document.querySelectorAll('.ing')];
  if(n>=1&&n<=btns.length){btns[n-1].click();}
});

cup=newCup();drawCup();showDayStart();
requestAnimationFrame(frame);
})();
</script>
